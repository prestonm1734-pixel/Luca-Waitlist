<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — talk to your money.</title>
  <meta name="description" content="Most people have no idea what their money is actually doing. Luca fixes that.">

  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
:root {
  --bg:        #0C0C11;
  --bg-2:      #111118;
  --card:      #16161E;
  --card-2:    #1C1C26;
  --ink:       #FFFFFF;
  --muted:     rgba(255,255,255,0.42);
  --dim:       rgba(255,255,255,0.18);
  --line:      rgba(255,255,255,0.07);
  --line-2:    rgba(255,255,255,0.11);
  --purple:    #4F5A97;
  --purple-hi: #A8B4E8;
  --green:     #4ADE80;
  --sans:  "Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif: "Instrument Serif","Times New Roman",serif;
  --mono:  "Geist Mono",ui-monospace,monospace;
  --pad:   clamp(24px,5vw,64px);
  --max:   1060px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--purple);color:#fff}

/* glow */
body::before{
  content:"";
  position:fixed;top:-30vh;left:-20vw;
  width:90vw;height:90vw;max-width:1000px;max-height:1000px;
  background:radial-gradient(circle,rgba(79,90,151,0.11) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

/* ── Nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 var(--pad);
  border-bottom:1px solid var(--line);
  background:rgba(12,12,17,0.8);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.nav-row{
  max-width:var(--max);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:56px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-word{font-size:16px;font-weight:600;letter-spacing:-0.03em}
.nav-btn{
  background:#fff;color:var(--bg);
  padding:8px 18px;border-radius:999px;
  font-size:13px;font-weight:600;letter-spacing:-0.01em;
  transition:opacity .15s;
}
.nav-btn:hover{opacity:.85}

/* ── Hero ── */
.hero{
  position:relative;z-index:1;
  min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;
  padding:120px var(--pad) 100px;
  max-width:var(--max);margin:0 auto;
}

.eyebrow{
  font-family:var(--mono);font-size:11px;
  text-transform:uppercase;letter-spacing:0.12em;
  color:var(--purple-hi);
  display:inline-flex;align-items:center;gap:8px;
  margin-bottom:36px;
}
.eyebrow-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--purple-hi);
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.hero-h{
  font-size:clamp(50px,7.5vw,112px);
  font-weight:500;line-height:1.0;
  letter-spacing:-0.05em;
  margin-bottom:32px;
  max-width:14ch;
}
.hero-h em{
  font-family:var(--serif);font-style:italic;
  font-weight:400;letter-spacing:-0.025em;
}
.hero-h .fade{color:var(--muted)}

.hero-sub{
  font-size:clamp(16px,1.5vw,20px);
  color:var(--muted);
  line-height:1.65;
  max-width:38ch;
  margin-bottom:48px;
  letter-spacing:-0.01em;
}

/* ── Form ── */
.form-wrap{max-width:400px}
.form-row{
  display:flex;align-items:center;
  background:rgba(255,255,255,0.055);
  border:1px solid var(--line-2);
  border-radius:14px;padding:5px 5px 5px 20px;
  transition:border-color .2s,background .2s;
}
.form-row:focus-within{
  border-color:rgba(79,90,151,0.55);
  background:rgba(255,255,255,0.08);
}
.form-row input{
  flex:1;background:none;border:none;outline:none;
  font-size:15px;color:#fff;padding:12px 0;min-width:0;
}
.form-row input::placeholder{color:rgba(255,255,255,0.25)}
.form-btn{
  background:var(--purple);color:#fff;
  padding:11px 20px;border-radius:10px;
  font-size:13px;font-weight:500;letter-spacing:-0.01em;
  white-space:nowrap;flex-shrink:0;
  transition:opacity .15s,transform .1s;
}
.form-btn:hover:not(:disabled){opacity:.8}
.form-btn:active{transform:scale(.97)}
.form-btn:disabled{opacity:.35;cursor:default}
.form-note{
  font-family:var(--mono);font-size:11px;
  color:var(--dim);margin-top:12px;
  letter-spacing:0.05em;text-transform:uppercase;
}
.form-error{font-size:12px;color:#F87171;margin-top:8px;font-family:var(--mono)}
.form-thanks{
  font-size:20px;font-weight:500;
  letter-spacing:-0.03em;color:var(--purple-hi);line-height:1.4;
}

/* ── Divider ── */
hr{border:none;border-top:1px solid var(--line)}

/* ── Sections ── */
.section{
  position:relative;z-index:1;
  padding:96px var(--pad);
}
.section-inner{max-width:var(--max);margin:0 auto}

.label{
  font-family:var(--mono);font-size:11px;
  text-transform:uppercase;letter-spacing:0.1em;
  color:var(--purple-hi);margin-bottom:20px;
}
.sh{
  font-size:clamp(32px,4vw,58px);
  font-weight:500;letter-spacing:-0.045em;line-height:1.07;
  margin-bottom:16px;
}
.sh em{font-family:var(--serif);font-style:italic;font-weight:400}
.sp{
  font-size:16px;color:var(--muted);
  max-width:44ch;line-height:1.7;letter-spacing:-0.005em;
}

/* ── Three pillars ── */
.pillars{
  margin-top:56px;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--line);
  border:1px solid var(--line);
  border-radius:20px;overflow:hidden;
}
@media(max-width:640px){.pillars{grid-template-columns:1fr}}
.pillar{
  background:var(--card);
  padding:36px 30px;
}
.pillar-n{
  font-family:var(--mono);font-size:11px;
  color:var(--purple-hi);letter-spacing:0.06em;
  margin-bottom:18px;
}
.pillar-t{
  font-size:17px;font-weight:500;
  letter-spacing:-0.03em;margin-bottom:8px;
}
.pillar-b{font-size:14px;color:var(--muted);line-height:1.65}

/* ── Stats ── */
.stats{
  margin-top:56px;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;
}
@media(max-width:640px){.stats{grid-template-columns:1fr}}
.stat{
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:28px 26px;
}
.stat-val{
  font-size:clamp(36px,4vw,52px);
  font-weight:600;letter-spacing:-0.05em;
  color:var(--green);margin-bottom:6px;
}
.stat-lbl{font-size:13px;color:var(--muted);line-height:1.5;max-width:22ch}

/* ── Price ── */
.price-cards{
  margin-top:56px;
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:12px;max-width:640px;
}
@media(max-width:560px){.price-cards{grid-template-columns:1fr}}
.pc{
  background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:30px;
}
.pc.hi{
  background:var(--purple);border-color:transparent;
  box-shadow:0 8px 32px rgba(79,90,151,0.35);
}
.pc-tier{
  font-family:var(--mono);font-size:10px;
  text-transform:uppercase;letter-spacing:0.08em;
  color:var(--muted);margin-bottom:14px;
}
.pc.hi .pc-tier{color:rgba(255,255,255,0.6)}
.pc-amt{font-size:40px;font-weight:600;letter-spacing:-0.05em}
.pc-amt sup{font-size:20px;font-weight:500;vertical-align:top;margin-top:7px;display:inline-block}
.pc-period{font-size:13px;color:var(--muted);margin-top:2px}
.pc.hi .pc-period{color:rgba(255,255,255,0.5)}
.pc-line{border:none;border-top:1px solid var(--line);margin:22px 0}
.pc.hi .pc-line{border-color:rgba(255,255,255,0.15)}
.pc-list{display:flex;flex-direction:column;gap:9px}
.pc-item{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.pc.hi .pc-item{color:rgba(255,255,255,0.82)}
.pc-check{font-size:12px;color:var(--purple-hi);flex-shrink:0}
.pc.hi .pc-check{color:rgba(255,255,255,0.55)}

.price-cta{margin-top:52px;max-width:420px}
.price-cta-h{
  font-size:clamp(24px,2.8vw,36px);
  font-weight:500;letter-spacing:-0.04em;
  line-height:1.15;margin-bottom:26px;
}
.price-cta-h em{font-family:var(--serif);font-style:italic;font-weight:400}
.price-small{
  font-family:var(--mono);font-size:11px;
  text-transform:uppercase;letter-spacing:0.06em;
  color:var(--dim);margin-top:14px;
}

/* ── Sticky ── */
.sticky{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:200;transition:opacity .3s,transform .3s;
}
.sticky.hide{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
.sticky-inner{
  display:flex;align-items:center;gap:14px;
  background:rgba(18,18,26,0.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line-2);
  border-radius:999px;
  padding:8px 8px 8px 24px;
  box-shadow:0 8px 32px rgba(0,0,0,0.55);
}
.sticky-text{font-size:13.5px;color:rgba(255,255,255,0.72);white-space:nowrap;letter-spacing:-0.01em}
.sticky-btn{
  background:#fff;color:var(--bg);
  padding:10px 22px;border-radius:999px;
  font-size:13px;font-weight:600;letter-spacing:-0.01em;
  transition:opacity .15s;
}
.sticky-btn:hover{opacity:.88}

/* ── Footer ── */
footer{padding:42px var(--pad)}
.foot-row{
  max-width:var(--max);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:16px;
}
.foot-brand{display:flex;align-items:center;gap:9px}
.foot-word{font-size:15px;font-weight:600;letter-spacing:-0.03em}
.foot-copy{font-size:13px;color:var(--dim)}
.foot-links{display:flex;gap:24px}
.foot-link{font-size:13px;color:var(--muted);transition:color .15s}
.foot-link:hover{color:#fff}

/* reveal */
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    window.SUPABASE_URL      = 'https://ioeqnfqparfunotdjosy.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_WgGtHiiEJJ-EJzYrG5jV7g_XlZnxTAJ';
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Mark = ({ size = 24 }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
    width={size} height={size}
    style={{display:"block",width:size,height:size,flexShrink:0}}>
    <g fill="#A8B4E8">
      <rect x="46" y="14" width="8" height="8" rx="1.5"/>
      <rect x="78" y="46" width="8" height="8" rx="1.5"/>
      <rect x="46" y="78" width="8" height="8" rx="1.5"/>
      <rect x="14" y="46" width="8" height="8" rx="1.5"/>
      <rect x="69" y="23" width="8" height="8" rx="1.5" transform="rotate(45 73 27)"/>
      <rect x="69" y="69" width="8" height="8" rx="1.5" transform="rotate(45 73 73)"/>
      <rect x="23" y="69" width="8" height="8" rx="1.5" transform="rotate(45 27 73)"/>
      <rect x="23" y="23" width="8" height="8" rx="1.5" transform="rotate(45 27 27)"/>
      <circle cx="50" cy="50" r="17"/>
      <circle cx="50" cy="50" r="11" fill="#0C0C11"/>
      <circle cx="50" cy="50" r="6"/>
      <circle cx="50" cy="50" r="2.2" fill="#0C0C11"/>
    </g>
  </svg>
);

const Form = ({ source, btn = "Join waitlist", ph = "your@email.com" }) => {
  const [v, setV]   = useState("");
  const [ok, setOk] = useState(false);
  const [ld, setLd] = useState(false);
  const [er, setEr] = useState("");

  const go = async (e) => {
    e.preventDefault();
    if (!v.includes("@")) { setEr("Enter a valid email."); return; }
    setLd(true); setEr("");
    try {
      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      const { error } = await sb.from("waitlist").insert([{ email: v, source: source || "landing" }]);
      if (error && error.code !== "23505") setEr("Something went wrong. Try again.");
      else setOk(true);
    } catch { setEr("Something went wrong. Try again."); }
    finally { setLd(false); }
  };

  if (ok) return <div className="form-thanks">You're on the list.<br/>We'll be in touch.</div>;
  return (
    <div className="form-wrap">
      <form className="form-row" onSubmit={go}>
        <input type="email" value={v} onChange={e=>{setV(e.target.value);setEr("")}} placeholder={ph} autoComplete="email"/>
        <button className="form-btn" type="submit" disabled={ld}>{ld?"…":btn}</button>
      </form>
      {er && <div className="form-error">{er}</div>}
      <div className="form-note">No spam · Free to join</div>
    </div>
  );
};

const useReveal = () => {
  const r = useRef(null);
  useEffect(() => {
    const el = r.current; if (!el) return;
    const o = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); o.unobserve(e.target); }});
    }, { threshold: 0.1 });
    o.observe(el); return () => o.disconnect();
  }, []);
  return r;
};

const App = () => {
  const [bar, setBar] = useState(false);
  const heroRef = useRef(null);
  const r1 = useReveal(), r2 = useReveal(), r3 = useReveal();

  useEffect(() => {
    const o = new IntersectionObserver(([e]) => setBar(!e.isIntersecting), { threshold: 0.2 });
    if (heroRef.current) o.observe(heroRef.current);
    return () => o.disconnect();
  }, []);

  return (<>
    {/* Nav */}
    <nav>
      <div className="nav-row">
        <div className="brand"><Mark size={26}/><span className="brand-word">Luca</span></div>
        <a href="#waitlist" className="nav-btn">Get early access</a>
      </div>
    </nav>

    {/* Hero */}
    <section className="hero" ref={heroRef}>
      <div className="eyebrow"><span className="eyebrow-dot"/>Early access · Limited spots</div>
      <h1 className="hero-h">
        You have no idea<br/>
        what your money<br/>
        <em className="fade">is doing.</em>
      </h1>
      <p className="hero-sub">
        Luca connects to your accounts and tells you — clearly, honestly, instantly.
      </p>
      <Form source="hero" btn="Get early access" ph="Enter your email"/>
    </section>

    <hr/>

    {/* How */}
    <section className="section">
      <div className="section-inner rv" ref={r1}>
        <div className="label">What Luca does</div>
        <h2 className="sh">Ask anything.<br/><em>Get a real answer.</em></h2>
        <p className="sp">No dashboards to learn. No jargon. Just ask.</p>
        <div className="pillars">
          {[
            ["01","Where is it going?","See exactly where your money goes — week by week, category by category. No guessing."],
            ["02","What should I do?","Luca tells you the next right move. Specific, ranked, based on your real numbers."],
            ["03","Am I on track?","Know if you're ahead or behind — on savings, debt, goals, retirement. In one sentence."],
          ].map(([n,t,b]) => (
            <div key={n} className="pillar">
              <div className="pillar-n">{n}</div>
              <div className="pillar-t">{t}</div>
              <div className="pillar-b">{b}</div>
            </div>
          ))}
        </div>
      </div>
    </section>

    <hr/>

    {/* Stats */}
    <section className="section">
      <div className="section-inner rv" ref={r2}>
        <div className="label">The average Luca user</div>
        <h2 className="sh">The numbers<br/><em>speak for themselves.</em></h2>
        <div className="stats">
          {[
            ["$340","Found per month they didn't know was there"],
            ["11 min","To connect all accounts and get your first insight"],
            ["6×","More likely to hit a savings goal with Luca than without"],
          ].map(([v,l]) => (
            <div key={v} className="stat">
              <div className="stat-val">{v}</div>
              <div className="stat-lbl">{l}</div>
            </div>
          ))}
        </div>
      </div>
    </section>

    <hr/>

    {/* Price */}
    <section className="section" id="waitlist">
      <div className="section-inner rv" ref={r3}>
        <div className="label">Pricing</div>
        <h2 className="sh">Start free.<br/><em>Upgrade when it clicks.</em></h2>
        <div className="price-cards">
          <div className="pc">
            <div className="pc-tier">Free</div>
            <div className="pc-amt"><sup>$</sup>0</div>
            <div className="pc-period">forever</div>
            <hr className="pc-line"/>
            <div className="pc-list">
              {["1 bank account","Monthly summary","3 questions/month"].map(f=>(
                <div key={f} className="pc-item"><span className="pc-check">✓</span>{f}</div>
              ))}
            </div>
          </div>
          <div className="pc hi">
            <div className="pc-tier">Pro</div>
            <div className="pc-amt"><sup>$</sup>14</div>
            <div className="pc-period">per month</div>
            <hr className="pc-line"/>
            <div className="pc-list">
              {["Unlimited accounts","Unlimited questions","Goals + alerts","Investment guidance","Priority support"].map(f=>(
                <div key={f} className="pc-item"><span className="pc-check">✓</span>{f}</div>
              ))}
            </div>
          </div>
        </div>
        <div className="price-cta">
          <div className="price-cta-h">Get <em>6 months free</em><br/>when we launch.</div>
          <Form source="price" btn="Claim your spot" ph="your@email.com"/>
          <div className="price-small">No credit card · Cancel anytime</div>
        </div>
      </div>
    </section>

    {/* Footer */}
    <hr/>
    <footer>
      <div className="foot-row">
        <div className="foot-brand"><Mark size={20}/><span className="foot-word">Luca</span></div>
        <span className="foot-copy">© 2025 Luca</span>
        <div className="foot-links">
          <a href="#" className="foot-link">Privacy</a>
          <a href="#" className="foot-link">Security</a>
        </div>
      </div>
    </footer>

    {/* Sticky */}
    <div className={`sticky ${bar?"":"hide"}`}>
      <div className="sticky-inner">
        <span className="sticky-text">6 months free when we launch →</span>
        <a href="#waitlist" className="sticky-btn">Join waitlist</a>
      </div>
    </div>
  </>);
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
