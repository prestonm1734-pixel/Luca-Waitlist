  <style>
:root {
  --bg:     #08080D;
  --ink:    #F5F5F7;
  --muted:  rgba(245,245,247,0.5);
  --dim:    rgba(245,245,247,0.25);
  --line:   rgba(255,255,255,0.07);
  --line2:  rgba(255,255,255,0.11);
  --purple: #4F5A97;
  --accent: #A8B4E8;
  --sans:   "Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:  "Instrument Serif","Times New Roman",serif;
  --mono:   ui-monospace,"SF Mono",monospace;
  --pad:    clamp(24px,6vw,80px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--purple);color:#fff}

body::before{
  content:"";position:fixed;top:-25vh;left:-15vw;
  width:80vw;height:80vw;max-width:900px;max-height:900px;
  background:radial-gradient(circle,rgba(79,90,151,0.1) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}

/* ── Nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);
  background:rgba(8,8,13,0.8);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-word{font-size:15px;font-weight:600;letter-spacing:-0.025em}
.nav-btn{font-size:13px;font-weight:500;color:var(--accent);transition:opacity .15s}
.nav-btn:hover{opacity:.65}

/* ── Sections ── */
section{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:140px var(--pad);min-height:100svh;position:relative;
}
section.short{min-height:auto;padding:100px var(--pad)}

/* ── Hero ── */
.eyebrow{
  font-size:13px;color:var(--accent);letter-spacing:0.01em;
  margin-bottom:28px;display:inline-flex;align-items:center;gap:8px;
}
.eyebrow-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 2.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

h1{
  font-size:clamp(52px,8.5vw,120px);font-weight:600;
  line-height:1.0;letter-spacing:-0.05em;
  margin-bottom:28px;max-width:14ch;
}
h1 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-0.03em}

.hero-sub{
  font-size:clamp(17px,1.7vw,21px);color:var(--muted);
  line-height:1.6;max-width:34ch;margin-bottom:52px;
  letter-spacing:-0.01em;
}

/* ── Form ── */
.form-wrap{width:100%;max-width:380px}
.form-row{
  display:flex;align-items:center;
  background:rgba(255,255,255,0.07);border:1px solid var(--line2);
  border-radius:999px;padding:5px 5px 5px 22px;
  transition:border-color .2s,background .2s;
}
.form-row:focus-within{border-color:rgba(168,180,232,0.45);background:rgba(255,255,255,0.09)}
.form-row input{
  flex:1;background:none;border:none;outline:none;
  font-size:15px;color:#fff;padding:11px 0;min-width:0;letter-spacing:-0.005em;
}
.form-row input::placeholder{color:rgba(255,255,255,0.22)}
.form-btn{
  background:#fff;color:#08080D;padding:11px 22px;border-radius:999px;
  font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;
  transition:opacity .15s,transform .1s;
}
.form-btn:hover:not(:disabled){opacity:.82}
.form-btn:active{transform:scale(.98)}
.form-btn:disabled{opacity:.3;cursor:default}
.form-note{font-size:12px;color:var(--dim);margin-top:14px;letter-spacing:.01em}
.form-error{font-size:12px;color:#F87171;margin-top:10px}
.form-thanks{font-size:clamp(20px,2vw,26px);font-weight:500;letter-spacing:-0.03em;color:var(--accent);line-height:1.45}

/* ── Section headlines ── */
h2{
  font-size:clamp(38px,6vw,86px);font-weight:600;
  line-height:1.02;letter-spacing:-0.048em;max-width:18ch;
}
h2 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-0.025em}
h2 .dim{color:var(--muted)}
.section-sub{font-size:clamp(16px,1.5vw,19px);color:var(--muted);max-width:36ch;line-height:1.65;margin-top:18px;letter-spacing:-0.008em}

/* ── Dashboard preview ── */
.preview-section{
  padding:0 var(--pad) 120px;
  min-height:auto;
}
.preview-label{
  font-size:12px;color:var(--dim);letter-spacing:0.06em;
  text-transform:uppercase;font-family:var(--mono);
  margin-bottom:32px;
}
.browser-frame{
  width:100%;max-width:1000px;
  border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 40px 120px rgba(0,0,0,0.55),0 8px 32px rgba(0,0,0,0.35);
}
.browser-bar{
  background:#1C1C24;
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.browser-dots{display:flex;gap:6px}
.browser-dot{width:10px;height:10px;border-radius:50%}
.browser-url{
  flex:1;background:rgba(255,255,255,0.06);
  border-radius:6px;padding:5px 14px;
  font-size:11px;color:rgba(255,255,255,0.3);font-family:var(--mono);
  text-align:center;letter-spacing:0.01em;
}

/* Dashboard inside */
.dash{
  background:#F7F7F5;
  display:grid;grid-template-columns:220px 1fr;
  min-height:520px;
  font-family:var(--sans);
}
@media(max-width:700px){.dash{grid-template-columns:1fr}}

/* Sidebar */
.dash-sidebar{
  background:#EFEEEB;
  border-right:1px solid rgba(0,0,0,0.07);
  padding:20px 16px;
  display:flex;flex-direction:column;gap:0;
}
@media(max-width:700px){.dash-sidebar{display:none}}
.ds-brand{display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:4px 8px}
.ds-brand-word{font-size:14px;font-weight:600;letter-spacing:-0.025em;color:#0D0D0D}
.ds-new{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:8px;margin-bottom:16px;
  font-size:12px;color:#555;cursor:pointer;
}
.ds-new:hover{background:rgba(0,0,0,0.04)}
.ds-section{font-size:10px;color:#AAA;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);padding:4px 10px;margin-bottom:4px}
.ds-item{
  font-size:12px;color:#555;padding:7px 10px;border-radius:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.ds-item:hover{background:rgba(0,0,0,0.05);color:#1A1A1A}
.ds-item.active{background:rgba(79,90,151,0.1);color:#4F5A97}
.ds-foot{margin-top:auto;padding:12px 10px;border-top:1px solid rgba(0,0,0,0.07);display:flex;align-items:center;gap:9px}
.ds-avatar{width:28px;height:28px;border-radius:50%;background:#4F5A97;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:600;flex-shrink:0}
.ds-foot-name{font-size:12px;font-weight:500;color:#1A1A1A}
.ds-foot-plan{font-size:10px;color:#AAA;font-family:var(--mono)}

/* Main area */
.dash-main{
  padding:36px 40px;
  display:flex;flex-direction:column;gap:28px;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(79,90,151,0.06) 0%, transparent 70%),
    #F7F7F5;
}
@media(max-width:700px){.dash-main{padding:24px 20px}}

.dash-greeting{
  font-size:clamp(24px,3vw,34px);font-weight:600;
  letter-spacing:-0.04em;color:#0D0D0D;line-height:1.1;
}
.dash-greeting em{font-family:var(--serif);font-style:italic;font-weight:400;color:#4F5A97}
.dash-sub{font-size:13px;color:#777;margin-top:6px;line-height:1.55;max-width:56ch}

/* Stat cards */
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.dash-stats{grid-template-columns:1fr 1fr}}
.ds-card{
  background:white;border:1px solid rgba(0,0,0,0.07);
  border-radius:14px;padding:18px 20px;
}
.ds-card-label{
  font-size:9px;color:#AAA;text-transform:uppercase;letter-spacing:0.1em;
  font-family:var(--mono);margin-bottom:8px;
}
.ds-card-val{font-size:clamp(18px,2.2vw,26px);font-weight:600;letter-spacing:-0.04em;color:#0D0D0D}
.ds-card-change{font-size:11px;margin-top:4px}
.ds-up{color:#2A7A4F}
.ds-down{color:#B03030}
.ds-neutral{color:#888}

/* Sparkline */
.sparkline{margin-top:10px}
.spark-svg{width:100%;height:28px}

/* Prompts */
.dash-prompts-label{
  font-size:10px;color:#AAA;text-transform:uppercase;
  letter-spacing:0.08em;font-family:var(--mono);
  display:flex;justify-content:space-between;align-items:center;
}
.dash-prompts-label span{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:10px;color:#BBB}
.dash-prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:500px){.dash-prompts{grid-template-columns:1fr}}
.dp{
  background:white;border:1px solid rgba(0,0,0,0.07);border-radius:12px;
  padding:14px 16px;cursor:pointer;transition:border-color .15s;
}
.dp:hover{border-color:rgba(79,90,151,0.35)}
.dp-icon{font-size:16px;margin-bottom:8px}
.dp-title{font-size:12px;font-weight:500;color:#1A1A1A;letter-spacing:-0.015em;margin-bottom:3px}
.dp-sub{font-size:11px;color:#AAA;line-height:1.4}

/* Input bar at bottom */
.dash-input-bar{
  background:white;border:1px solid rgba(0,0,0,0.1);
  border-radius:12px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;
  color:#AAA;font-size:13px;
}
.dash-input-send{
  margin-left:auto;
  width:30px;height:30px;border-radius:8px;
  background:#4F5A97;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ── Feature list ── */
.feat-list{
  margin-top:72px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:0;border-top:1px solid var(--line);max-width:900px;width:100%;text-align:left;
}
@media(max-width:640px){.feat-list{grid-template-columns:1fr}}
.feat{padding:40px 36px 40px 0;border-right:1px solid var(--line)}
.feat:last-child{border-right:none;padding-right:0;padding-left:36px}
.feat:nth-child(2){padding-left:36px}
@media(max-width:640px){
  .feat{border-right:none;border-bottom:1px solid var(--line);padding:36px 0}
  .feat:last-child{border-bottom:none}
  .feat,.feat:nth-child(2),.feat:last-child{padding-left:0;padding-right:0}
}
.feat-title{font-size:17px;font-weight:600;letter-spacing:-0.03em;margin-bottom:10px}
.feat-body{font-size:14px;color:var(--muted);line-height:1.65}

/* ── How ── */
.how-items{
  margin-top:72px;display:flex;flex-direction:column;gap:0;
  max-width:680px;width:100%;text-align:left;
}
.how-item{display:flex;align-items:flex-start;gap:32px;padding:40px 0;border-bottom:1px solid var(--line)}
.how-item:first-child{border-top:1px solid var(--line)}
.how-n{font-size:13px;color:var(--dim);font-weight:500;letter-spacing:0.02em;min-width:28px;margin-top:2px;flex-shrink:0}
.how-title{font-size:18px;font-weight:500;letter-spacing:-0.03em;margin-bottom:8px}
.how-body{font-size:14px;color:var(--muted);line-height:1.65}

/* ── Price ── */
.price-pair{
  margin-top:72px;display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;max-width:640px;width:100%;text-align:left;
}
@media(max-width:520px){.price-pair{grid-template-columns:1fr}}
.pc{background:var(--bg);padding:36px}
.pc.hi{background:#111116}
.pc-tier{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
.pc-price{font-size:48px;font-weight:600;letter-spacing:-0.05em;margin-bottom:4px}
.pc-price sup{font-size:22px;font-weight:500;vertical-align:top;margin-top:10px;display:inline-block}
.pc-per{font-size:14px;color:var(--muted)}
.pc-hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.pc-items{display:flex;flex-direction:column;gap:10px}
.pc-item{font-size:13.5px;color:var(--muted);display:flex;gap:12px;align-items:baseline}
.pc-item-check{color:var(--accent);flex-shrink:0;font-size:12px}

.price-cta{margin-top:72px;display:flex;flex-direction:column;align-items:center}
.price-cta-h{font-size:clamp(26px,3vw,40px);font-weight:600;letter-spacing:-0.04em;line-height:1.1;margin-bottom:36px}
.price-cta-h em{font-family:var(--serif);font-style:italic;font-weight:400}
.price-note{font-size:12px;color:var(--dim);margin-top:14px;letter-spacing:.01em}

/* ── Footer ── */
footer{padding:48px var(--pad);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.foot-brand{display:flex;align-items:center;gap:9px}
.foot-word{font-size:14px;font-weight:600;letter-spacing:-0.025em}
.foot-copy{font-size:13px;color:var(--dim)}
.foot-links{display:flex;gap:22px}
.foot-link{font-size:13px;color:var(--muted);transition:color .15s}
.foot-link:hover{color:var(--ink)}

/* ── Sticky ── */
.sticky{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;transition:opacity .3s,transform .3s}
.sticky.hide{opacity:0;transform:translateX(-50%) translateY(12px);pointer-events:none}
.sticky-inner{
  display:flex;align-items:center;gap:14px;
  background:rgba(16,16,22,0.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line2);border-radius:999px;
  padding:8px 8px 8px 24px;
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
}
.sticky-text{font-size:13px;color:rgba(255,255,255,0.65);white-space:nowrap;letter-spacing:-0.01em}
.sticky-btn{background:#fff;color:#08080D;padding:10px 22px;border-radius:999px;font-size:13px;font-weight:600;transition:opacity .15s;white-space:nowrap}
.sticky-btn:hover{opacity:.85}

.rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Mark = ({ size=24, color="#A8B4E8", bg="#08080D" }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
    width={size} height={size} style={{display:"block",width:size,height:size,flexShrink:0}}>
    <g fill={color}>
      <rect x="46" y="14" width="8" height="8" rx="1.5"/>
      <rect x="78" y="46" width="8" height="8" rx="1.5"/>
      <rect x="46" y="78" width="8" height="8" rx="1.5"/>
      <rect x="14" y="46" width="8" height="8" rx="1.5"/>
      <rect x="69" y="23" width="8" height="8" rx="1.5" transform="rotate(45 73 27)"/>
      <rect x="69" y="69" width="8" height="8" rx="1.5" transform="rotate(45 73 73)"/>
      <rect x="23" y="69" width="8" height="8" rx="1.5" transform="rotate(45 27 73)"/>
      <rect x="23" y="23" width="8" height="8" rx="1.5" transform="rotate(45 27 27)"/>
      <circle cx="50" cy="50" r="17"/>
      <circle cx="50" cy="50" r="11" fill={bg}/>
      <circle cx="50" cy="50" r="6"/>
      <circle cx="50" cy="50" r="2.2" fill={bg}/>
    </g>
  </svg>
);

const Form = ({ source, btn="Join waitlist", ph="your@email.com" }) => {
  const [v,setV]=useState(""), [ok,setOk]=useState(false), [ld,setLd]=useState(false), [er,setEr]=useState("");
  const go = async e => {
    e.preventDefault();
    if (!v.includes("@")) { setEr("Enter a valid email."); return; }
    setLd(true); setEr("");
    try {
      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      const { error } = await sb.from("waitlist").insert([{ email:v, source:source||"landing" }]);
      if (error && error.code!=="23505") setEr("Something went wrong. Try again.");
      else setOk(true);
    } catch { setEr("Something went wrong. Try again."); }
    finally { setLd(false); }
  };
  if (ok) return <div className="form-thanks">You're on the list.<br/>We'll be in touch.</div>;
  return (
    <div className="form-wrap">
      <form className="form-row" onSubmit={go}>
        <input type="email" value={v} onChange={e=>{setV(e.target.value);setEr("")}} placeholder={ph} autoComplete="email"/>
        <button className="form-btn" type="submit" disabled={ld}>{ld?"…":btn}</button>
      </form>
      {er && <div className="form-error">{er}</div>}
      <div className="form-note">Free to join. No credit card.</div>
    </div>
  );
};

const useReveal = () => {
  const r = useRef(null);
  useEffect(() => {
    const el=r.current; if(!el) return;
    const o=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target);} });
    },{threshold:0.07});
    o.observe(el); return ()=>o.disconnect();
  },[]);
  return r;
};

/* Sparkline path */
const Spark = ({ points, color="#4F5A97" }) => {
  const w=200, h=28;
  const min=Math.min(...points), max=Math.max(...points);
  const xs=points.map((_,i)=>(i/(points.length-1))*w);
  const ys=points.map(p=>h-((p-min)/(max-min||1))*(h-4)-2);
  const d="M"+xs.map((x,i)=>`${x},${ys[i]}`).join(" L");
  return (
    <svg className="spark-svg" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <path d={d} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};
