  <style>
:root {
  --bg:       #0A0A0F;
  --bg-2:     #111118;
  --bg-3:     #18181F;
  --purple:   #505A98;
  --purple-2: #B4BEE7;
  --white:    #FFFFFF;
  --muted:    rgba(255,255,255,0.5);
  --muted-2:  rgba(255,255,255,0.25);
  --line:     rgba(255,255,255,0.08);
  --line-2:   rgba(255,255,255,0.14);

  --sans:    "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:    "Geist Mono", ui-monospace, "SF Mono", monospace;
  --serif:   "Instrument Serif", "Times New Roman", serif;
  --maxw:    1160px;
  --pad:     clamp(20px, 4vw, 56px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--white); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }
::selection { background: var(--purple); color: white; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }

/* ── Nav ── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 62px;
}
.nav-brand { display: flex; align-items: center; gap: 10px; }
.nav-brand-word { font-weight: 600; font-size: 18px; letter-spacing: -0.025em; }
.nav-cta {

  padding: 9px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 500; letter-spacing: -0.005em;
  transition: opacity .15s;
}
.nav-cta:hover { opacity: 0.85; }

/* ── Hero ── */
.hero {
  min-height: 100svh;

  position: relative;
}
.hero-eyebrow {
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--purple-2);
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 40px;
}
.hero-eyebrow::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--purple-2);

}

.hero h1 {
  font-size: clamp(36px, 5.8vw, 88px);
  font-weight: 500;
  line-height: 1.02;
  letter-spacing: -0.04em;
  margin-bottom: 28px;
  max-width: 18ch;
}
.hero h1 .num { color: var(--purple-2); }
.hero h1 .ital { font-family: var(--serif); font-style: italic; font-weight: 400; }

.hero-sub {
  font-size: clamp(16px, 1.4vw, 20px);
  color: var(--muted);
  max-width: 46ch;
  line-height: 1.5;
  margin-bottom: 48px;
  letter-spacing: -0.005em;
}

/* ── Email form (shared) ── */
.email-form { max-width: 440px; }
.email-wrap {

.email-submit {

.email-submit:disabled { opacity: 0.5; cursor: default; }
.email-foot {

.email-error { font-family: var(--mono); font-size: 12px; color: #E88; margin-top: 10px; }
.email-thanks {

  letter-spacing: -0.02em; color: var(--purple-2);

.claude-pill {

.chat-section .suggest-chip { background: rgba(255,255,255,0.05); border-color: var(--line); color: rgba(255,255,255,0.65); }

/* ── Money moments ── */
.moments-section {

  border-bottom: 1px solid var(--line);
}
.moments-section .section-label {

.moments-section .section-label::before { content: ""; width: 24px; height: 1px; background: var(--purple); }

.moments-grid {

.moment-card {

.moment-tag {

  background: rgba(80,90,152,0.15);

.moment-card p {

.moment-card p .num { color: var(--purple-2); }

.moment-luca {

  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;

/* ── Price section ── */
.price-section {

  border-bottom: 1px solid var(--line);
  background: var(--bg-2);

.price-sub {

  margin-bottom: 48px;

  letter-spacing: 0.02em;

/* ── Footer ── */
.footer {
  padding: 36px 0;
  border-top: 1px solid var(--line);
}
.footer-inner {
  display: flex; justify-content: space-between; align-items: center;
  gap: 24px; flex-wrap: wrap;
}
.footer-left { display: flex; align-items: center; gap: 10px; }
.footer-fine { font-family: var(--mono); font-size: 11px; color: var(--muted-2); letter-spacing: 0.02em; }
.footer-links { display: flex; gap: 24px; font-family: var(--mono); font-size: 11px; color: var(--muted-2); letter-spacing: 0.04em; text-transform: uppercase; }
.footer-links a:hover { color: var(--white); }

/* ── Sticky bar ── */
.sticky-bar {
  display: none;
  position: fixed; left: 12px; right: 12px; bottom: 12px;
  background: var(--purple);
  color: white;
  border-radius: 16px;
  padding: 15px 20px;
  font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
  align-items: center; justify-content: space-between;
  gap: 12px; z-index: 40;
  box-shadow: 0 14px 40px -8px rgba(80,90,152,0.5);
  text-decoration: none;
  transition: transform .25s ease, opacity .25s ease;
  transform: translateY(120%); opacity: 0;
}
.sticky-bar.in { transform: translateY(0); opacity: 1; }
.sticky-bar .arrow {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: grid; place-items: center;
  flex-shrink: 0;
}

/* ── Reveal ── */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: translateY(0); }

      const [error, setError] = React.useState("");

      const submit = async (e) => {
        e.preventDefault();
        if (!email.includes("@")) return;
        setLoading(true); setError("");
        try {
          const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
          const { error: sbErr } = await client.from("waitlist").insert([{ email, source: id || "landing" }]);
          if (sbErr && sbErr.code !== "23505") setError("Something went wrong. Try again.");
          else setSubmitted(true);
        } catch (_) { setError("Something went wrong. Try again."); }
        finally { setLoading(false); }
      };

      if (submitted) return (
        <div className="email-form">
          <div className="email-thanks">You're on the list.</div>
          <div className="email-foot" style={{ marginTop: 14 }}>Check {email} — first wave opens soon.</div>
        </div>
      );

      return (
        <form className="email-form" onSubmit={submit}>
          <div className="email-wrap">
            <input type="email" placeholder="you@email.com" value={email} onChange={e => setEmail(e.target.value)} required disabled={loading} />
            <button type="submit" className="email-submit" disabled={loading}>{loading ? "Joining…" : "Join waitlist"}</button>
          </div>
          {error && <div className="email-error">{error}</div>}
          <div className="email-foot">Free · no credit card · cancel anytime</div>
        </form>
      );
    };
    window.EmailForm = EmailForm;
  </script>

  <!-- ChatDemo -->
  <script type="text/babel">
    const SUGGESTED = [
      "Can I afford a house in 3 years?",
      "Am I saving enough for retirement?",
      "Where should I move the $32k in my checking?",
      "Should I pay off my student loans faster?",
    ];
    const CANNED = {
      [SUGGESTED[0]]: "On a $650k place with 20% down, you need **$160k** for the down payment plus closing. At your current $1,170/mo savings rate you'll get there with about $4k to spare — but the $32k sitting in your Chase checking is dragging on returns. Move $24k of it into your Ally HYSA earning 4.2% and you'll add **$1,008/yr** without changing your spending. You're closer than you think, Maya.",
      [SUGGESTED[1]]: "At 29 with **$84,200** in your 401k and **$19,400** in the Roth, you're ahead of ~78% of your peers. But your 8% contribution is leaving free money on the table — Fidelity's full match runs to 12%. Bump to 10% and you'll add roughly **$280/mo** in matched dollars. Separately, your Roth is **$3,200** short of the 2026 limit. Auto-deposit $78/wk for 41 weeks and we close it before December.",
      [SUGGESTED[2]]: "Most of it shouldn't be there. Keep **$8,400** in Chase (one month's spend × 2 — your real emergency buffer). The other **$24,000** belongs in your Ally HYSA at 4.2% — that's **$1,008/yr** in interest you're not getting right now. Do it before Friday's paycheck hits and you'll have one clean month of cash flow to read.",
      [SUGGESTED[3]]: "Probably not. Your loans are at **4.5%** — your Ally HYSA pays **4.2%**. The math is almost identical. Meanwhile your Roth IRA averages **8–9%** long-term, and it's tax-free. Keep the $312/mo minimum, max the Roth first ($3,200 to go this year), and only attack the loans if rates change. The exception: if the 4.5% feels heavy emotionally, paying ahead has real value. Money isn't only math.",
    };
    const FALLBACK = "In this preview I can answer the four sample questions above using **Maya's** real profile. To see Luca reason about *your* numbers — your income, your accounts, your goals — join the waitlist below.";
    const INITIAL = { role: "luca", text: "Morning, Maya. I just looked at your accounts — your **net worth is $126,260**, up $1,840 this month. Your checking balance is high again. What's on your mind?" };

    const renderBold = (text) => text.split(/(\*\*[^*]+\*\*)/g).map((p, i) =>
      p.startsWith("**") && p.endsWith("**")
        ? <strong key={i}>{p.slice(2, -2)}</strong>
        : <React.Fragment key={i}>{p}</React.Fragment>
    );

    const ChatDemo = () => {
      const [messages, setMessages] = React.useState([INITIAL]);
      const [input, setInput] = React.useState("");
      const [busy, setBusy] = React.useState(false);
      const [used, setUsed] = React.useState([]);
      const scrollRef = React.useRef(null);

      React.useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

      const ask = async (q) => {
        if (!q.trim() || busy) return;
        setMessages(p => [...p, { role: "user", text: q }]);
        setInput(""); setBusy(true);
        await new Promise(r => setTimeout(r, 700 + Math.random() * 600));
        setMessages(p => [...p, { role: "luca", text: CANNED[q] || FALLBACK }]);
        setBusy(false);
      };

      return (
        <div className="demo">
          <div className="demo-chat">
            <div className="demo-head">
              <div className="demo-head-title">
                <span className="demo-head-dot"/>
                <span className="demo-head-text-full">luca.live — connected to Maya's accounts</span>
                <span className="demo-head-text-short">luca.live · Maya</span>
              </div>
              <button className="demo-reset" onClick={() => { setMessages([INITIAL]); setUsed([]); setInput(""); }}>↺ reset</button>
            </div>
            <div className="demo-scroll" ref={scrollRef}>
              {messages.map((m, i) => (
                <div key={i} className={`msg ${m.role}`}>
                  <div className="msg-avatar">{m.role === "luca" ? "L" : "M"}</div>
                  <div className="msg-bubble">{renderBold(m.text)}</div>
                </div>
              ))}
              {busy && <div className="msg luca"><div className="msg-avatar">L</div><div className="msg-bubble"><div className="typing"><span/><span/><span/></div></div></div>}
            </div>
            <div className="demo-input-wrap">
              <div className="suggest-row">
                {SUGGESTED.map(s => <button key={s} className="suggest-chip" disabled={busy || used.includes(s)} onClick={() => { setUsed(p => [...p, s]); ask(s); }}>{s}</button>)}
              </div>
              <form className="demo-input" onSubmit={e => { e.preventDefault(); ask(input); }}>
                <input type="text" placeholder="Try one of the questions above…" value={input} onChange={e => setInput(e.target.value)} disabled={busy}/>
                <button type="submit" className="demo-send" disabled={busy || !input.trim()} aria-label="Send">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </button>
              </form>
            </div>
          </div>
          <aside className="demo-profile">
            <div>
              <h4>Sample profile</h4>
              <div className="name">Maya, 29 · NYC</div>
              <div className="profile-note">Real numbers, connected via Plaid. Read-only.</div>
            </div>
            <div className="profile-grid">
              <div className="profile-row"><span>Net worth</span><b>$126,260</b></div>
              <div className="profile-row"><span>Checking</span><b>$32,400</b></div>
              <div className="profile-row"><span>HYSA · 4.2%</span><b>$8,100</b></div>
              <div className="profile-row"><span>401k</span><b>$84,200</b></div>
              <div className="profile-row"><span>Roth IRA</span><b>$19,400</b></div>
              <div className="profile-row"><span>Student loans</span><b>−$18,000</b></div>
              <div className="profile-row"><span>Saves / mo</span><b>$1,170</b></div>
            </div>
          </aside>
        </div>
      );
    };
    window.ChatDemo = ChatDemo;
  </script>

  <!-- App -->
  <script type="text/babel">
    const useReveal = () => {
      React.useEffect(() => {
        const io = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: 0.1 });
        document.querySelectorAll("[data-reveal]").forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    };

    const Nav = () => (
      <header className="nav">
        <div className="wrap nav-inner">
          <a href="#" style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <LucaMark size={26}/>
            <span style={{ fontWeight: 600, fontSize: 18, letterSpacing: "-0.025em" }}>Luca</span>
          </a>
          <a href="#waitlist" className="nav-cta">Join waitlist</a>
        </div>
      </header>
    );

    const Hero = () => (
      <section className="hero" id="top">
        <div className="wrap">
          <div className="hero-eyebrow">Coming summer 2026</div>
          <h1>
            Your <span className="num">$32,400</span> sitting in checking is losing you <span className="num">$1,400</span> a <span className="ital">year.</span>
          </h1>
          <p className="hero-sub">
            Luca connects to your real accounts and tells you exactly what to do with your money.
          </p>
          <EmailForm id="hero"/>
          <div className="claude-pill">
            <span className="dot"/>
            Powered by Claude · the most advanced reasoning AI
          </div>
        </div>
      </section>
    );

    const ChatSection = () => (
      <section className="chat-section">
        <div className="wrap">
          <div className="section-label">Luca in action</div>
          <ChatDemo/>
        </div>
      </section>
    );

    const MOMENTS = [
      {
        tag: "Spending",
        text: <>You spent <span className="num">$1,240</span> on dining last month. That's <span className="bad">34%</span> of your take-home.</>,
        luca: "Luca flagged it on the 9th. You still had 3 weeks left in the month."
      },
      {
        tag: "Debt",
        text: <>Your student loan at <span className="bad">6.8%</span> is costing you <span className="num">$94</span>/month in interest alone.</>,
        luca: "At your current pace you pay it off in 2031. Luca has a faster path."
      },
      {
        tag: "Goals",
        text: <>At your current savings rate you hit your house goal in <span className="bad">2031.</span> Not <span className="num">2028.</span></>,
        luca: "One move — $24k from checking to HYSA — closes 14 months of the gap."
      },
    ];

    const MoneyMoments = () => (
      <section className="moments-section">
        <div className="wrap">
          <div className="section-label">What Luca sees</div>
          <div className="moments-grid">
            {MOMENTS.map((m, i) => (
              <div key={i} className="moment-card reveal" data-reveal>
                <div className="moment-tag">{m.tag}</div>
                <p>{m.text}</p>
                <div className="moment-luca">{m.luca}</div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const PriceSection = () => (
      <section className="price-section" id="waitlist">
        <div className="wrap">
          <p className="price-line"><span className="num">$14.99</span>/month. Less than one hour with a <span className="ital">financial advisor.</span></p>
          <p className="price-sub">Cancel anytime. No AUM fees. No surprises.</p>
          <EmailForm id="pricing"/>
        </div>
      </section>
    );

    const Footer = () => (
      <footer className="footer">
        <div className="wrap footer-inner">
          <div className="footer-left">
            <LucaMark size={18}/>
            <span className="footer-fine">© 2026 Luca · Not a registered investment advisor. For educational purposes.</span>
          </div>
          <div className="footer-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Disclaimer</a>
          </div>
        </div>
      </footer>
    );

    const StickyBar = () => {
      const [show, setShow] = React.useState(false);
      React.useEffect(() => {
        const fn = () => {
          const past = window.scrollY > window.innerHeight * 0.5;
          const nearBottom = window.innerHeight + window.scrollY > document.body.offsetHeight - 500;
          setShow(past && !nearBottom);
        };
        window.addEventListener("scroll", fn, { passive: true });
        fn();
        return () => window.removeEventListener("scroll", fn);
      }, []);
      return (
        <a href="#waitlist" className={`sticky-bar ${show ? "in" : ""}`}>
          <span>Join the waitlist — free</span>
          <span className="arrow">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </span>
        </a>
      );
    };

    const App = () => {
      useReveal();
      return (
        <>
          <Nav/>
          <main>
            <Hero/>
            <ChatSection/>
            <MoneyMoments/>
            <PriceSection/>
          </main>
          <Footer/>
          <StickyBar/>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
