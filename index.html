  <style>
:root {
  --bg:         #0C0C11;
  --bg-2:       #111118;
  --bg-card:    #17171F;
  --bg-card-2:  #1C1C26;
  --ink:        #FFFFFF;
  --muted:      rgba(255,255,255,0.45);
  --muted-2:    rgba(255,255,255,0.25);
  --line:       rgba(255,255,255,0.07);
  --line-2:     rgba(255,255,255,0.12);
  --purple:     #4F5A97;
  --purple-2:   #6672AA;
  --purple-text:#A8B4E8;
  --purple-glow:rgba(79,90,151,0.15);
  --green:      #4ADE80;
  --red:        #F87171;
  --sans:  "Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:  "Geist Mono",ui-monospace,"SF Mono",monospace;
  --serif: "Instrument Serif","Times New Roman",serif;
  --maxw:  1100px;
  --pad:   clamp(20px, 5vw, 60px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }
::selection { background: var(--purple); color: white; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }

/* ── Reveal ── */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ── Nav ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(12,12,17,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: var(--maxw); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 58px; padding: 0 var(--pad);
}
.nav-brand { display: flex; align-items: center; gap: 10px; }
.nav-word { font-weight: 600; font-size: 16px; letter-spacing: -0.03em; color: white; }
.nav-cta {
  background: white; color: #0C0C11;
  padding: 8px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
  transition: opacity .15s, transform .1s;
}
.nav-cta:hover { opacity: 0.88; }
.nav-cta:active { transform: scale(0.97); }

/* ── Hero ── */
.hero {
  min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 130px var(--pad) 100px;
  max-width: var(--maxw); margin: 0 auto;
  position: relative;
}

/* ambient glow */
.hero::before {
  content: "";
  position: fixed; top: -20vh; left: -10vw;
  width: 80vw; height: 80vw; max-width: 900px; max-height: 900px;
  background: radial-gradient(circle, rgba(79,90,151,0.13) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

.hero-content { position: relative; z-index: 1; max-width: 760px; }

.hero-badge {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--purple-text);
  border: 1px solid rgba(168,180,232,0.2);
  background: rgba(79,90,151,0.1);
  border-radius: 999px; padding: 5px 14px 5px 10px;
  margin-bottom: 40px;
}
.hero-badge-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--purple-text);
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

h1 {
  font-size: clamp(44px, 6vw, 92px);
  font-weight: 500; line-height: 1.02;
  letter-spacing: -0.045em;
  margin-bottom: 28px;
}
h1 .ital { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; }
h1 .dim { color: var(--muted); }

.hero-sub {
  font-size: clamp(16px, 1.4vw, 19px);
  color: var(--muted);
  max-width: 48ch; line-height: 1.7;
  margin-bottom: 48px;
  letter-spacing: -0.005em;
}

/* ── Form ── */
.form-wrap { max-width: 420px; }
.form-row {

  border-radius: 14px; padding: 5px 5px 5px 20px;

}
.form-row:focus-within {

}
.form-row input {

.form-btn {
  background: var(--purple); color: white;

.form-btn:hover:not(:disabled) { opacity: 0.82; }
.form-btn:active { transform: scale(0.97); }
.form-btn:disabled { opacity: 0.35; cursor: default; }

.section-label {

.section-h .ital { font-family: var(--serif); font-style: italic; font-weight: 400; }
.section-sub {

}

/* ── How it works ── */
.steps {
  margin-top: 64px;
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 1px;
  background: var(--line);
  border-radius: 20px; overflow: hidden;

.step {

}
.step-num {

  color: var(--purple-text); letter-spacing: 0.06em;

}
.step-title {
  font-size: 16px; font-weight: 500;
  letter-spacing: -0.025em; margin-bottom: 10px;
}
.step-body { font-size: 14px; color: var(--muted); line-height: 1.65; }

/* ── Chat preview ── */
.chat-preview {
  margin-top: 64px;
  background: var(--bg-card);
  border: 1px solid var(--line-2);
  border-radius: 20px;
  overflow: hidden;
}
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
}
.chat-avatar {
  width: 36px; height: 36px; border-radius: 11px;

  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.chat-name { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
.chat-online { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 5px; }
.chat-online::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
.chat-body { padding: 24px; display: flex; flex-direction: column; gap: 12px; }

.msg.ai { align-items: flex-start; }
.msg.user { align-items: flex-end; }

.data-card {

.dc-item { display: flex; flex-direction: column; gap: 3px; }

.typing {

.typing span {

/* ── Moments ── */
.moments-grid {
  margin-top: 64px;

@media (max-width: 700px) { .moments-grid { grid-template-columns: 1fr; } }

.moment {

.moment:hover { border-color: var(--line-2); }
.moment-tag {

.moment-title { font-size: 16px; font-weight: 500; letter-spacing: -0.025em; margin-bottom: 10px; line-height: 1.35; }

.moment-stat-val { font-size: 22px; font-weight: 600; letter-spacing: -0.04em; color: var(--green); }

.price-amt { font-size: 42px; font-weight: 600; letter-spacing: -0.05em; }

.price-period { font-size: 13px; color: var(--muted-2); margin-top: 2px; }
.price-card.featured .price-period { color: rgba(255,255,255,0.55); }
.price-hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }
.price-card.featured .price-hr { border-color: rgba(255,255,255,0.18); }
.price-features { display: flex; flex-direction: column; gap: 9px; }
.price-feat { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.price-card.featured .price-feat { color: rgba(255,255,255,0.85); }
.price-check { font-size: 12px; color: var(--purple-text); flex-shrink: 0; }

.price-cta { margin-top: 56px; max-width: 440px; }
.price-cta-h {
  font-size: clamp(24px, 2.8vw, 36px); font-weight: 500;

  margin-bottom: 28px;
}
.price-cta-h .ital { font-family: var(--serif); font-style: italic; font-weight: 400; }
.price-small { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-2); margin-top: 14px; }

/* ── Sticky bar ── */
.sticky {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);

}
.sticky.hide { opacity: 0; transform: translateX(-50%) translateY(16px); pointer-events: none; }

.sticky-btn {

/* ── Footer ── */
.footer {

.footer-inner {

.footer-word { font-size: 15px; font-weight: 600; letter-spacing: -0.03em; }
.footer-copy { font-size: 13px; color: var(--muted-2); }
.footer-links { display: flex; gap: 24px; }
.footer-link { font-size: 13px; color: var(--muted); transition: color .15s; }
.footer-link:hover { color: white; }

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const LucaMark = ({ size = 24 }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
    width={size} height={size}
    style={{ display:"block", width:size, height:size, flexShrink:0 }}>
    <g fill="#A8B4E8">
      <rect x="46" y="14" width="8" height="8" rx="1.5"/>
      <rect x="78" y="46" width="8" height="8" rx="1.5"/>
      <rect x="46" y="78" width="8" height="8" rx="1.5"/>
      <rect x="14" y="46" width="8" height="8" rx="1.5"/>
      <rect x="69" y="23" width="8" height="8" rx="1.5" transform="rotate(45 73 27)"/>
      <rect x="69" y="69" width="8" height="8" rx="1.5" transform="rotate(45 73 73)"/>
      <rect x="23" y="69" width="8" height="8" rx="1.5" transform="rotate(45 27 73)"/>
      <rect x="23" y="23" width="8" height="8" rx="1.5" transform="rotate(45 27 27)"/>
      <circle cx="50" cy="50" r="17"/>
      <circle cx="50" cy="50" r="11" fill="#0C0C11"/>
      <circle cx="50" cy="50" r="6"/>
      <circle cx="50" cy="50" r="2.2" fill="#0C0C11"/>
    </g>
  </svg>
);

const EmailForm = ({ source, btnText = "Join waitlist", placeholder = "your@email.com" }) => {
  const [email, setEmail]     = useState("");
  const [done, setDone]       = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState("");

  const submit = async (e) => {
    e.preventDefault();
    if (!email.includes("@")) { setError("Enter a valid email."); return; }
    setLoading(true); setError("");
    try {
      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      const { error: err } = await sb.from("waitlist").insert([{ email, source: source || "landing" }]);
      if (err && err.code !== "23505") setError("Something went wrong. Try again.");
      else setDone(true);
    } catch (_) { setError("Something went wrong. Try again."); }
    finally { setLoading(false); }
  };

  if (done) return <div className="form-thanks">You're on the list. We'll be in touch.</div>;

  return (
    <div className="form-wrap">
      <form className="form-row" onSubmit={submit}>
        <input
          type="email" value={email}
          onChange={e => { setEmail(e.target.value); setError(""); }}
          placeholder={placeholder}
          autoComplete="email"
        />
        <button className="form-btn" type="submit" disabled={loading}>
          {loading ? "…" : btnText}
        </button>
      </form>
      {error && <div className="form-error">{error}</div>}
      <div className="form-note">No spam · Cancel anytime</div>
    </div>
  );
};

const useReveal = () => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); obs.unobserve(e.target); } });
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
};

const App = () => {
  const [sticky, setSticky] = useState(false);
  const heroRef = useRef(null);
  const r1 = useReveal(), r2 = useReveal(), r3 = useReveal(), r4 = useReveal();

  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => setSticky(!e.isIntersecting), { threshold: 0.2 });
    if (heroRef.current) obs.observe(heroRef.current);
    return () => obs.disconnect();
  }, []);

  return (
    <>
      {/* Nav */}
      <nav className="nav">
        <div className="nav-inner">
          <div className="nav-brand">
            <LucaMark size={26} />
            <span className="nav-word">Luca</span>
          </div>
          <a href="#price" className="nav-cta">Join waitlist</a>
        </div>
