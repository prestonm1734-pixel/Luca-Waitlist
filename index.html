  <style>
:root{
  --bg:#FBFAF7;
  --bg-2:#F4F2EC;
  --paper:#FFFFFF;
  --ink:#0B0B0B;
  --ink-2:#1A1A1A;
  --muted:#5C5C57;
  --dim:#8A8A82;
  --line:#E5E3DC;
  --line-2:#D5D3CC;
  --purple:#505A98;
  --purple-hi:#6B75AD;
  --purple-soft:#EDEEF6;
  --red:#A8332E;
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",serif;
  --pad:clamp(24px,5.5vw,80px);
  --max:1120px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--purple);color:#fff}

/* ── Nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);
  background:rgba(251,250,247,.86);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-word{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.nav-link{font-size:13px;color:var(--muted);transition:color .15s}
.nav-link:hover{color:var(--ink)}

/* ── Hero ── */
.hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:140px var(--pad) 80px;position:relative;
}
.eyebrow{
  font-size:12px;color:var(--purple);
  letter-spacing:.12em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px;margin-bottom:44px;
}
.eyebrow-dot{width:5px;height:5px;border-radius:50%;background:var(--purple);animation:bl 2.5s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}

h1.hero-h{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(48px,7.5vw,108px);
  line-height:1.0;letter-spacing:-.025em;
  max-width:14ch;margin:0 auto 32px;color:var(--ink);
}
.hero-sub{
  font-size:clamp(16px,1.5vw,21px);color:var(--muted);
  line-height:1.6;max-width:46ch;margin:0 auto 48px;
  letter-spacing:-.005em;
}

/* ── Form ── */
.form-wrap{width:100%;max-width:440px;margin:0 auto}
.form-row{
  display:flex;align-items:center;
  background:var(--paper);border:1px solid var(--line-2);
  border-radius:8px;padding:5px 5px 5px 18px;
  transition:border-color .2s,box-shadow .2s;
}
.form-row:focus-within{border-color:var(--purple);box-shadow:0 0 0 3px rgba(80,90,152,.1)}
.form-row input{
  flex:1;background:none;border:none;outline:none;
  font-size:15px;color:var(--ink);padding:12px 0;min-width:0;
}
.form-row input::placeholder{color:var(--dim)}
.form-btn{
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:5px;
  font-size:13.5px;font-weight:500;white-space:nowrap;flex-shrink:0;
  transition:background .15s,transform .1s;
  letter-spacing:-.005em;
}
.form-btn:hover:not(:disabled){background:var(--purple)}
.form-btn:active{transform:scale(.97)}
.form-btn:disabled{opacity:.35;cursor:default}
.form-micro{font-size:11.5px;color:var(--dim);margin-top:16px;letter-spacing:.01em}
.form-error{font-size:12px;color:var(--red);margin-top:10px}
.form-thanks{font-size:20px;font-weight:500;letter-spacing:-.025em;color:var(--purple);line-height:1.45}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s ease}

/* ── Section commons ── */
section{padding:140px var(--pad)}
section.tight{padding:100px var(--pad)}
.inner{max-width:var(--max);margin:0 auto}
hr.div{border:none;border-top:1px solid var(--line);max-width:var(--max);margin:0 auto}

.kicker{
  font-size:12px;color:var(--purple);text-transform:uppercase;
  letter-spacing:.12em;margin-bottom:24px;
}
h2{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(36px,5.5vw,76px);line-height:1.02;letter-spacing:-.022em;
  color:var(--ink);
}
.sub{
  font-size:clamp(16px,1.4vw,19px);color:var(--muted);
  line-height:1.65;max-width:48ch;margin-top:24px;
}

/* ── Shift section (split comparison) ── */
.shift-grid{
  margin-top:80px;
  display:grid;grid-template-columns:1fr 1fr;
  gap:0;border-top:1px solid var(--line);
}
@media(max-width:680px){.shift-grid{grid-template-columns:1fr}}
.shift-col{padding:44px 48px 44px 0;border-right:1px solid var(--line)}
.shift-col:last-child{border-right:none;padding:44px 0 44px 48px}
@media(max-width:680px){
  .shift-col{border-right:none;border-bottom:1px solid var(--line);padding:36px 0}
  .shift-col:last-child{border-bottom:none;padding:36px 0 0 0}
}
.shift-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--dim);margin-bottom:18px;
}
.shift-h{
  font-family:var(--serif);font-size:clamp(22px,2.6vw,34px);
  line-height:1.2;letter-spacing:-.02em;margin-bottom:14px;
}
.shift-p{font-size:14.5px;color:var(--muted);line-height:1.7;max-width:32ch}
.shift-col.luca .shift-label{color:var(--purple)}

/* ── Activity Feed ── */
.feed-wrap{
  margin-top:64px;
  background:var(--paper);
  border:1px solid var(--line);border-radius:12px;
  overflow:hidden;
}
.feed-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;border-bottom:1px solid var(--line);
  background:var(--bg-2);
}
.feed-title{font-size:13px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.feed-title::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--purple);animation:bl 2s ease-in-out infinite}
.feed-meta{font-size:12px;color:var(--dim);font-family:var(--sans)}
.feed-item{
  display:grid;grid-template-columns:90px 1fr auto;
  gap:24px;align-items:center;
  padding:24px 28px;border-bottom:1px solid var(--line);
  transition:background .15s;
}
.feed-item:last-child{border-bottom:none}
.feed-item:hover{background:#FCFBF8}
@media(max-width:680px){
  .feed-item{grid-template-columns:1fr;gap:14px;padding:20px 22px}
}
.feed-time{
  font-size:11px;color:var(--dim);font-family:var(--sans);
  text-transform:uppercase;letter-spacing:.06em;
}
.feed-text{font-size:15px;color:var(--ink);line-height:1.5;letter-spacing:-.005em}
.feed-text strong{color:var(--purple);font-weight:500}
.feed-action{
  background:var(--ink);color:#fff;
  padding:8px 18px;border-radius:6px;
  font-size:12.5px;font-weight:500;
  white-space:nowrap;transition:background .15s,transform .1s;
}
.feed-action:hover{background:var(--purple)}
.feed-action:active{transform:scale(.97)}
.feed-action.done{background:transparent;color:var(--dim);border:1px solid var(--line-2);cursor:default}
.feed-action.done:hover{background:transparent}
@media(max-width:680px){.feed-action{align-self:flex-start}}

/* ── Three pillars ── */
.pillars{
  margin-top:80px;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:0;border-top:1px solid var(--line);
}
@media(max-width:680px){.pillars{grid-template-columns:1fr}}
.pillar{padding:48px 40px 0 0;border-right:1px solid var(--line)}
.pillar:last-child{border-right:none;padding-left:40px;padding-right:0}
.pillar:nth-child(2){padding-left:40px}
@media(max-width:680px){
  .pillar,.pillar:nth-child(2),.pillar:last-child{
    padding:40px 0;border-right:none;border-bottom:1px solid var(--line);
  }
  .pillar:last-child{border-bottom:none}
}
.pillar-num{
  font-family:var(--serif);font-size:22px;
  color:var(--purple);margin-bottom:24px;
}
.pillar-h{
  font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);
  line-height:1.2;letter-spacing:-.02em;margin-bottom:14px;
}
.pillar-b{font-size:14.5px;color:var(--muted);line-height:1.7;max-width:34ch}

/* ── Statement section ── */
.statement{
  text-align:center;padding:160px var(--pad);
  background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.statement-h{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(36px,5.5vw,80px);
  line-height:1.05;letter-spacing:-.025em;
  max-width:18ch;margin:0 auto;
}
.statement-h em{color:var(--purple);font-style:italic}
.statement-sub{
  font-size:clamp(15px,1.4vw,18px);color:var(--muted);
  max-width:42ch;margin:32px auto 0;line-height:1.7;
}

/* ── Pricing ── */
.price-row{
  margin-top:64px;
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:48px;padding-bottom:32px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.price-left{flex:1;min-width:260px}
.price-name{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--purple);margin-bottom:14px}
.price-amount{font-family:var(--serif);font-size:clamp(48px,6vw,80px);line-height:1;letter-spacing:-.025em}
.price-amount sup{font-size:.4em;vertical-align:top;margin-top:.2em;display:inline-block;font-weight:400}
.price-period{font-size:14px;color:var(--muted);margin-top:8px}
.price-right{font-size:14.5px;color:var(--muted);line-height:1.7;max-width:30ch}
.price-features{margin-top:32px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:600px){.price-features{grid-template-columns:1fr}}
.pf{font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.pf-check{color:var(--purple);font-size:12px;flex-shrink:0}

/* ── Final CTA ── */
.cta-section{text-align:center;padding:140px var(--pad)}
.cta-h{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(34px,5vw,68px);line-height:1.06;letter-spacing:-.025em;
  max-width:18ch;margin:0 auto 40px;
}
.cta-h em{color:var(--purple);font-style:italic}

/* ── Footer ── */
footer{padding:48px var(--pad);border-top:1px solid var(--line);background:var(--bg)}
.foot-row{
  max-width:var(--max);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:16px;
}
.foot-brand{display:flex;align-items:center;gap:9px}
.foot-word{font-size:15px;font-weight:600;letter-spacing:-.02em}
.foot-copy{font-size:13px;color:var(--dim)}
.foot-links{display:flex;gap:24px}
.foot-link{font-size:13px;color:var(--muted);transition:color .15s}
.foot-link:hover{color:var(--ink)}
.foot-bottom{
  max-width:var(--max);margin:20px auto 0;
  padding-top:18px;border-top:1px solid var(--line);
  text-align:center;font-size:11px;color:var(--dim);letter-spacing:.02em;
}

/* Sticky */
.sticky{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;transition:opacity .3s,transform .3s}
.sticky.hide{opacity:0;transform:translateX(-50%) translateY(12px);pointer-events:none}
.sticky-inner{
  display:flex;align-items:center;gap:14px;
  background:var(--ink);
  border-radius:999px;
  padding:7px 7px 7px 22px;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
}
.sticky-text{font-size:13px;color:rgba(255,255,255,.7);white-space:nowrap;letter-spacing:-.005em}
.sticky-btn{background:var(--purple);color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s}
.sticky-btn:hover{background:var(--purple-hi)}

/* Scroll hint */
.scroll-hint{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  opacity:.28;animation:bob 2.6s ease-in-out infinite;cursor:pointer;
  transition:opacity .2s;
}
.scroll-hint:hover{opacity:.5}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

/* Reveal */
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Mark = ({ size=24, fill="#505A98", bg="#FBFAF7" }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
    width={size} height={size} style={{display:"block",width:size,height:size,flexShrink:0}}>
    <g fill={fill}>
      <rect x="46" y="14" width="8" height="8" rx="1.5"/>
      <rect x="78" y="46" width="8" height="8" rx="1.5"/>
      <rect x="46" y="78" width="8" height="8" rx="1.5"/>
      <rect x="14" y="46" width="8" height="8" rx="1.5"/>
      <rect x="69" y="23" width="8" height="8" rx="1.5" transform="rotate(45 73 27)"/>
      <rect x="69" y="69" width="8" height="8" rx="1.5" transform="rotate(45 73 73)"/>
      <rect x="23" y="69" width="8" height="8" rx="1.5" transform="rotate(45 27 73)"/>
      <rect x="23" y="23" width="8" height="8" rx="1.5" transform="rotate(45 27 27)"/>
      <circle cx="50" cy="50" r="17"/>
      <circle cx="50" cy="50" r="11" fill={bg}/>
      <circle cx="50" cy="50" r="6"/>
      <circle cx="50" cy="50" r="2.2" fill={bg}/>
    </g>
  </svg>
);

const useReveal = () => {
  const r = useRef(null);
  useEffect(() => {
    const el = r.current; if (!el) return;
    const o = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); o.unobserve(e.target); }});
    }, { threshold: 0.07 });
    o.observe(el); return () => o.disconnect();
  }, []);
  return r;
};

const EmailForm = ({ source, btn="Get early access", ph="Enter your email", micro }) => {
  const [v, setV] = useState('');
  const [ok, setOk] = useState(false);
  const [ld, setLd] = useState(false);
  const [er, setEr] = useState('');
  const rowRef = useRef(null);

  const go = async e => {
    e.preventDefault();
    if (!v.includes('@')) {
      setEr('Enter a valid email.');
      rowRef.current?.classList.add('shake');
      setTimeout(() => rowRef.current?.classList.remove('shake'), 400);
      return;
    }
    setLd(true); setEr('');
    try {
      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      const { error } = await sb.from("waitlist").insert([{ email: v, source: source || "landing" }]);
      if (error && error.code !== "23505") setEr("Something went wrong. Try again.");
      else setOk(true);
    } catch { setEr("Something went wrong. Try again."); }
    finally { setLd(false); }
  };

  if (ok) return <div className="form-thanks">You're on the list. We'll be in touch.</div>;
  return (
    <div className="form-wrap">
      <form className="form-row" ref={rowRef} onSubmit={go}>
        <input type="email" value={v} onChange={e => { setV(e.target.value); setEr(''); }}
          placeholder={ph} autoComplete="email"/>
        <button className="form-btn" type="submit" disabled={ld}>{ld ? '…' : btn}</button>
      </form>
      {er && <div className="form-error">{er}</div>}
      {micro && <div className="form-micro">{micro}</div>}
    </div>
  );
};

/* ── Activity Feed (the wow moment) ── */
const FEED = [
  { time:"2:34 AM", text:<>Caught a <strong>$35 overdraft fee</strong> from Chase. Dispute letter drafted and ready to send.</>, action:"Approve" },
  { time:"3:11 AM", text:<>Found <strong>$9.99/mo</strong> for an iCloud plan you haven't used in 92 days. Cancellation script prepared.</>, action:"Approve" },
  { time:"4:48 AM", text:<>Flagged <strong>$340 in deductible</strong> business expenses this month. Added to your 2026 tax folder.</>, action:"Done" },
  { time:"5:22 AM", text:<>Your savings account earns <strong>0.01%</strong>. Moving to Ally at <strong>4.2%</strong> would earn you <strong>$1,240/yr</strong>.</>, action:"Approve" },
  { time:"6:09 AM", text:<>Safe to spend today: <strong>$184</strong>. Accounts for rent, groceries, and your Tuesday card payment.</>, action:"Done" },
];

const ActivityFeed = () => (
  <div className="feed-wrap">
    <div className="feed-header">
      <div className="feed-title">Luca · Activity feed</div>
      <div className="feed-meta">Last night · 5 actions</div>
    </div>
    {FEED.map((item, i) => (
      <div key={i} className="feed-item">
        <div className="feed-time">{item.time}</div>
        <div className="feed-text">{item.text}</div>
        <button className={`feed-action ${item.action === 'Done' ? 'done' : ''}`}>
          {item.action === 'Done' ? '✓ Done' : item.action}
        </button>
      </div>
    ))}
  </div>
);

const App = () => {
  const [bar, setBar] = useState(false);
  const heroRef = useRef(null);
  const r1 = useReveal(), r2 = useReveal(), r3 = useReveal(), r4 = useReveal(), r5 = useReveal();

  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => setBar(!e.isIntersecting), { threshold: 0.15 });
    if (heroRef.current) obs.observe(heroRef.current);
    return () => obs.disconnect();
  }, []);

  return (<>
    <nav>
      <div className="brand"><Mark size={26}/><span className="brand-word">Luca</span></div>
      <a href="#waitlist" className="nav-link">Get early access →</a>
    </nav>

    {/* ── Hero ── */}
    <div className="hero" ref={heroRef}>
      <div className="eyebrow"><span className="eyebrow-dot"/>Now in private beta</div>
      <h1 className="hero-h">Your money has an agent now.</h1>
      <p className="hero-sub">
        Luca watches every dollar 24/7. Finds problems before you know they exist. Delivers ready-to-execute solutions. You just tap approve.
      </p>
      <EmailForm source="hero" micro="Bank-level encryption · Read-only · Powered by Claude"/>
      <a href="#shift" className="scroll-hint" aria-label="Scroll">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </a>
    </div>

    <hr className="div"/>

    {/* ── Shift section ── */}
    <section id="shift">
      <div className="inner rv" ref={r1}>
        <div className="kicker">The shift</div>
