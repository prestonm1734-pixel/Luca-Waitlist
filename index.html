  <style>
:root{
  --bg:#0A0A14;--bg2:#0D0D1A;--bg3:#111120;
  --card:#13131F;--card2:#181828;
  --purple:#505A98;--purple-hi:#6872B8;--purple-dim:rgba(80,90,152,.15);--purple-glow:rgba(80,90,152,.18);
  --ink:#FFFFFF;--muted:rgba(255,255,255,.52);--dim:rgba(255,255,255,.24);--dimmer:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.11);
  --green:#34D399;--red:#F87171;--amber:#FBBF24;
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",serif;
  --pad:clamp(20px,5.5vw,80px);--max:1100px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--purple);color:#fff}

/* ── Nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);
  background:rgba(10,10,20,.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-word{font-size:16px;font-weight:600;letter-spacing:-.025em}
.nav-btn{
  background:var(--purple);color:#fff;
  padding:8px 20px;border-radius:999px;
  font-size:13px;font-weight:500;
  transition:background .15s,transform .1s;
}
.nav-btn:hover{background:var(--purple-hi)}
.nav-btn:active{transform:scale(.97)}

/* ── Hero ── */
.hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:100px var(--pad) 80px;
  position:relative;overflow:hidden;
}
.hero-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
  width:min(800px,120vw);height:min(800px,120vw);
  background:radial-gradient(circle,rgba(80,90,152,.22) 0%,transparent 65%);
  pointer-events:none;
}
.hero-content{position:relative;z-index:1;animation:heroIn .9s ease both}
@keyframes heroIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:var(--accent,#A8B4E8);letter-spacing:.06em;text-transform:uppercase;
  border:1px solid rgba(168,180,232,.2);background:rgba(80,90,152,.1);
  border-radius:999px;padding:5px 14px 5px 10px;margin-bottom:36px;color:#A8B4E8;
}
.hero-dot{width:5px;height:5px;border-radius:50%;background:#A8B4E8;animation:blink 2.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
h1.hero-h{
  font-size:clamp(38px,6.5vw,92px);
  font-weight:700;line-height:1.0;letter-spacing:-.05em;
  max-width:16ch;margin:0 auto 24px;
}
.hero-sub{
  font-size:clamp(15px,1.6vw,20px);color:var(--muted);
  line-height:1.65;max-width:38ch;margin:0 auto 48px;letter-spacing:-.008em;
}

/* ── Forms ── */
.form-wrap{width:100%;max-width:420px;margin:0 auto}
.form-row{
  display:flex;align-items:center;
  background:rgba(255,255,255,.06);border:1px solid var(--line2);
  border-radius:14px;padding:5px 5px 5px 20px;
  transition:border-color .2s,box-shadow .2s;
}
.form-row:focus-within{border-color:rgba(80,90,152,.6);box-shadow:0 0 0 3px rgba(80,90,152,.12)}
.form-row input{flex:1;background:none;border:none;outline:none;font-size:15px;color:#fff;padding:12px 0;min-width:0}
.form-row input::placeholder{color:rgba(255,255,255,.22)}
.form-btn{
  background:var(--purple);color:#fff;padding:12px 22px;border-radius:10px;
  font-size:13.5px;font-weight:600;white-space:nowrap;flex-shrink:0;
  transition:background .15s,transform .1s;
}
.form-btn:hover:not(:disabled){background:var(--purple-hi)}
.form-btn:active{transform:scale(.97)}
.form-btn:disabled{opacity:.35;cursor:default}
.form-micro{font-size:11.5px;color:var(--dim);margin-top:14px;letter-spacing:.01em}
.form-error{font-size:12px;color:var(--red);margin-top:10px}
.form-thanks{font-size:20px;font-weight:500;letter-spacing:-.03em;color:#A8B4E8;line-height:1.45}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s ease}
.scroll-hint{
  position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:.28;animation:bob 2.6s ease-in-out infinite;cursor:pointer;
  transition:opacity .2s;
}
.scroll-hint:hover{opacity:.55}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}

/* ── Section common ── */
.s{padding:120px var(--pad)}
.s-inner{max-width:var(--max);margin:0 auto}
.s-center{text-align:center;display:flex;flex-direction:column;align-items:center}
.kicker{font-size:12px;color:#A8B4E8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}
h2.sh{font-size:clamp(32px,5vw,64px);font-weight:700;letter-spacing:-.048em;line-height:1.04;margin-bottom:16px}
h2.sh em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.025em}
.sdesc{font-size:clamp(15px,1.4vw,18px);color:var(--muted);max-width:44ch;line-height:1.7;letter-spacing:-.005em}

/* ── Accounts section ── */
.accounts-section{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.networth-block{margin-bottom:56px;text-align:center}
.networth-label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.networth-val{font-size:clamp(52px,7vw,96px);font-weight:700;letter-spacing:-.06em;color:var(--green);line-height:1}

.accounts-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:56px;
}
@media(max-width:900px){.accounts-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:580px){.accounts-grid{grid-template-columns:repeat(2,1fr)}}

.acc-card{
  background:var(--card);border:1px solid var(--line2);
  border-radius:16px;padding:20px 18px;
  opacity:0;transform:translateY(16px);
  transition:opacity .5s ease,transform .5s ease,border-color .2s;
}
.acc-card.loaded{opacity:1;transform:none}
.acc-card:hover{border-color:rgba(80,90,152,.35)}
.acc-bank{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.acc-name{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.3}
.acc-bal{font-size:22px;font-weight:600;letter-spacing:-.04em}
.acc-bal.pos{color:var(--ink)}
.acc-bal.neg{color:var(--red)}
.acc-rate{font-size:11px;color:var(--green);margin-top:4px}

/* Morning brief */
.brief-wrap{
  background:var(--card);border:1px solid var(--line2);
  border-radius:20px;padding:32px 36px;
  position:relative;
}
@media(max-width:600px){.brief-wrap{padding:24px 20px}}
.brief-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brief-avatar{
  width:36px;height:36px;border-radius:11px;background:var(--purple);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brief-name{font-size:14px;font-weight:600;letter-spacing:-.02em}
.brief-status{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;margin-top:2px}
.brief-status::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}
.brief-text{font-size:clamp(15px,1.4vw,17px);line-height:1.75;color:rgba(255,255,255,.88);min-height:4em}
.brief-cursor{display:inline-block;width:2px;height:1.1em;background:var(--purple);margin-left:2px;animation:cur .9s ease-in-out infinite;vertical-align:text-bottom}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}

/* ── Pillars ── */
.pillars-grid{
  margin-top:64px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:24px;overflow:hidden;
}
@media(max-width:680px){.pillars-grid{grid-template-columns:1fr}}
.pillar{background:var(--bg);padding:48px 40px;transition:background .2s}
.pillar:hover{background:var(--card)}
.pillar-icon{
  width:48px;height:48px;border-radius:14px;
  border:1px solid var(--line2);background:var(--card);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;
}
.pillar-title{font-size:20px;font-weight:600;letter-spacing:-.035em;margin-bottom:12px}
.pillar-body{font-size:14px;color:var(--muted);line-height:1.7}

/* ── Chat demo ── */
.chat-section{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px;justify-content:center}
.chip{
  padding:10px 20px;border-radius:999px;
  border:1px solid var(--line2);background:var(--card);
  font-size:13.5px;color:var(--muted);cursor:pointer;
  transition:border-color .2s,background .2s,color .2s;
}
.chip:hover,.chip.active{border-color:rgba(80,90,152,.5);background:rgba(80,90,152,.1);color:var(--ink)}

.chat-window{
  background:var(--card);border:1px solid var(--line2);
  border-radius:20px;overflow:hidden;max-width:740px;margin:0 auto;
  box-shadow:0 32px 80px rgba(0,0,0,.4);
}
.chat-topbar{
  display:flex;align-items:center;gap:12px;
  padding:16px 24px;border-bottom:1px solid var(--line);
}
.chat-ava{width:34px;height:34px;border-radius:10px;background:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-name{font-size:14px;font-weight:600;letter-spacing:-.02em}
.chat-online{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;margin-top:2px}
.chat-online::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}
.chat-msgs{padding:24px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.cm{display:flex;flex-direction:column}
.cm.u{align-items:flex-end}
.cm.a{align-items:flex-start}
.bbl{
  padding:12px 18px;border-radius:20px;
  font-size:14px;line-height:1.6;max-width:82%;
}
.cm.a .bbl{background:rgba(255,255,255,.07);color:rgba(255,255,255,.88);border-bottom-left-radius:4px}
.cm.u .bbl{background:var(--purple);color:#fff;border-bottom-right-radius:4px}
.hi{color:#8899DD;font-weight:600}
.typing-row{display:flex;gap:4px;align-items:center;padding:12px 18px;background:rgba(255,255,255,.07);border-radius:20px;border-bottom-left-radius:4px;align-self:flex-start}
.typing-row span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);animation:td 1.4s ease-in-out infinite}
.typing-row span:nth-child(2){animation-delay:.18s}
.typing-row span:nth-child(3){animation-delay:.36s}
@keyframes td{0%,60%,100%{opacity:.3;transform:scale(1)}30%{opacity:1;transform:scale(1.2)}}
.chat-footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-field{flex:1;font-size:13px;color:rgba(255,255,255,.2);background:rgba(255,255,255,.05);border-radius:10px;padding:10px 14px}
.chat-send{width:32px;height:32px;border-radius:9px;background:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Health ── */
.health-layout{
  margin-top:64px;
  display:grid;grid-template-columns:1fr 1fr;
  gap:80px;align-items:center;
}
@media(max-width:720px){.health-layout{grid-template-columns:1fr;gap:48px}}
.score-ring-wrap{display:flex;flex-direction:column;align-items:center}
.score-number{font-size:clamp(80px,12vw,140px);font-weight:700;letter-spacing:-.07em;color:var(--green);line-height:1}
.score-label{font-size:13px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.08em}
.score-tip{
  margin-top:24px;font-size:14px;color:var(--muted);
  line-height:1.6;max-width:28ch;text-align:center;
  background:var(--card);border:1px solid var(--line2);
  border-radius:14px;padding:16px 20px;
}
.score-tip strong{color:#A8B4E8;font-weight:500}

.health-bars{display:flex;flex-direction:column;gap:20px}
.hb{display:flex;flex-direction:column;gap:8px}
.hb-top{display:flex;justify-content:space-between;align-items:baseline}
.hb-name{font-size:14px;font-weight:500;letter-spacing:-.015em}
.hb-score{font-size:13px;color:var(--muted)}
.hb-track{background:rgba(255,255,255,.06);border-radius:999px;height:6px;overflow:hidden}
.hb-fill{height:100%;border-radius:999px;width:0;transition:width 1.2s cubic-bezier(.25,.1,.25,1)}
.hb-fill.green{background:var(--green)}
.hb-fill.purple{background:var(--purple)}
.hb-fill.red{background:var(--red)}
.hb-fill.amber{background:var(--amber)}

/* ── Access ── */
.access-section{
  background:var(--purple);padding:120px var(--pad);
  text-align:center;position:relative;overflow:hidden;
}
.access-section::before{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(700px,100vw);height:min(700px,100vw);
  background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 65%);
  pointer-events:none;
}
.access-big{
  font-size:clamp(28px,4.5vw,62px);font-weight:700;
  letter-spacing:-.045em;line-height:1.1;max-width:18ch;margin:0 auto 20px;
  position:relative;z-index:1;
}
.access-italic{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(22px,3.5vw,48px);letter-spacing:-.025em;
  color:rgba(255,255,255,.88);margin-bottom:20px;
  position:relative;z-index:1;
}
.access-price{font-size:15px;color:rgba(255,255,255,.6);position:relative;z-index:1}

/* ── Waitlist section ── */
.waitlist-section{background:var(--bg2);border-top:1px solid var(--line)}

/* ── Footer ── */
footer{
  background:var(--bg);border-top:1px solid var(--line);
  padding:40px var(--pad);
}
.foot-main{
  max-width:var(--max);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:20px;margin-bottom:24px;
}
.foot-brand{display:flex;align-items:center;gap:10px}
.foot-word{font-size:15px;font-weight:600;letter-spacing:-.025em}
.foot-links{display:flex;gap:24px}
.foot-link{font-size:13px;color:var(--muted);transition:color .15s}
.foot-link:hover{color:var(--ink)}
.foot-copy{font-size:13px;color:var(--dim)}
.foot-bottom{max-width:var(--max);margin:0 auto;border-top:1px solid var(--line);padding-top:20px;text-align:center;font-size:11px;color:var(--dimmer);letter-spacing:.02em}

/* Sticky */
.sticky{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;transition:opacity .3s,transform .3s}
.sticky.hide{opacity:0;transform:translateX(-50%) translateY(12px);pointer-events:none}
.sticky-inner{
  display:flex;align-items:center;gap:14px;
  background:rgba(10,10,20,.94);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line2);border-radius:999px;
  padding:8px 8px 8px 22px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
}
.sticky-text{font-size:13px;color:rgba(255,255,255,.6);white-space:nowrap}
.sticky-btn{background:var(--purple);color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s}
.sticky-btn:hover{background:var(--purple-hi)}

/* reveal */
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

const { useState, useEffect, useRef, useCallback } = React;

/* ── Logo ── */

/* ── Hooks ── */
const useReveal = () => {
  const r = useRef(null);
  useEffect(() => {
    const el = r.current; if (!el) return;
    const o = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); o.unobserve(e.target); }});
    }, { threshold: 0.07 });
    o.observe(el); return () => o.disconnect();
  }, []);
  return r;
};

function useCounter(target, duration=2000) {
  const [val, setVal] = useState(0);
  const triggered = useRef(false);
  const trigger = useCallback(() => {
    if (triggered.current) return;
    triggered.current = true;
    const t0 = performance.now();
    const tick = now => {
      const p = Math.min((now - t0) / duration, 1);
      const e = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(e * target));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [target, duration]);
  return [val, trigger];
}

function useWordStream() {
  const [text, setText] = useState('');
  const [done, setDone] = useState(false);
  const timer = useRef(null);

  const stream = useCallback((fullText, delay=30) => {
    clearInterval(timer.current);
    setText(''); setDone(false);
    const words = fullText.split(' ');
    let i = 0;
    timer.current = setInterval(() => {
      if (i < words.length) {
        const word = words[i]; i++;
        setText(p => p ? p + ' ' + word : word);
      } else { clearInterval(timer.current); setDone(true); }
    }, delay);
  }, []);

  const reset = useCallback(() => {
    clearInterval(timer.current);
    setText(''); setDone(false);
  }, []);

  useEffect(() => () => clearInterval(timer.current), []);
  return { text, done, stream, reset };
}

/* ── Highlight money amounts ── */
function HiText({ text }) {
  const parts = text.split(/(\$[\d,]+(?:\/month)?|[\d.]+%\s*APY|\d+,\d+)/g);
  return <>{parts.map((p, i) => /^\$|APY$|,\d{3}$/.test(p) ? <span key={i} className="hi">{p}</span> : p)}</>;
}

/* ── Email Form ── */
const EmailForm = ({ source, btn="Join the waitlist", ph="Enter your email", micro }) => {
  const [v, setV] = useState('');
  const [ok, setOk] = useState(false);
  const [ld, setLd] = useState(false);
  const [er, setEr] = useState('');
  const rowRef = useRef(null);

  const go = async e => {
    e.preventDefault();
    if (!v.includes('@')) {
      setEr('Enter a valid email.');
      rowRef.current?.classList.add('shake');
      setTimeout(() => rowRef.current?.classList.remove('shake'), 400);
      return;
    }
    setLd(true); setEr('');
    try {
      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      const { error } = await sb.from("waitlist").insert([{ email: v, source: source || "landing" }]);
      if (error && error.code !== "23505") setEr("Something went wrong. Try again.");
      else setOk(true);
    } catch { setEr("Something went wrong. Try again."); }
    finally { setLd(false); }
  };

  if (ok) return <div className="form-thanks">You are on the list. We will be in touch.</div>;
  return (
    <div className="form-wrap">
      <form className="form-row" ref={rowRef} onSubmit={go}>
        <input type="email" value={v} onChange={e => { setV(e.target.value); setEr(''); }}
          placeholder={ph} autoComplete="email"/>
        <button className="form-btn" type="submit" disabled={ld}>{ld ? '…' : btn}</button>
      </form>
      {er && <div className="form-error">{er}</div>}
      {micro && <div className="form-micro">{micro}</div>}
    </div>
  );
};

const AccountsSection = () => {
  const [loaded, setLoaded] = useState([]);
  const [briefActive, setBriefActive] = useState(false);
  const { text: briefText, done: briefDone, stream } = useWordStream();
  const [nwVal, nwTrigger] = useCounter(NET_WORTH);

  const triggered = useRef(false);
  const r = useReveal();

  useEffect(() => {
    const el = sectionRef.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting || triggered.current) return;
      triggered.current = true;
      nwTrigger();
      ACCOUNTS.forEach((_, i) => {
        setTimeout(() => setLoaded(p => [...p, i]), 200 + i * 200);
      });
      setTimeout(() => { setBriefActive(true); stream(BRIEF); }, 200 + ACCOUNTS.length * 200 + 400);
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [nwTrigger, stream]);

  return (
    <div className="s accounts-section" id="accounts" ref={sectionRef}>
      <div className="s-inner">

                <div className="acc-bank">{acc.bank}</div>
                <div className="acc-name">{acc.name}</div>
                <div className={`acc-bal ${acc.pos ? 'pos' : 'neg'}`}>

                {acc.rate && <div className="acc-rate">{acc.rate}</div>}

          <div className="brief-wrap">
            <div className="brief-header">
              <div className="brief-avatar"><Mark size={18} bg="#505A98"/></div>

  );
};

  const [scoreVal, scoreTrigger] = useCounter(TOTAL, 1600);
  const sectionRef = useRef(null);
  const triggered = useRef(false);
  const r = useReveal();

  useEffect(() => {
    const el = sectionRef.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting || triggered.current) return;
      triggered.current = true;
      scoreTrigger();
      setTimeout(() => setAnimated(true), 100);
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [scoreTrigger]);

  return (
    <div className="s" ref={sectionRef}>

        <div className="rv s-center" ref={r}>
