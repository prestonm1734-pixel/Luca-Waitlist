  <style>
:root{
  --bg:#000;--ink:#F5F5F7;--muted:rgba(245,245,247,.44);--dim:rgba(245,245,247,.2);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.11);
  --accent:#A8B4E8;--purple:#4F5A97;
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",serif;
  --pad:clamp(24px,6vw,80px);--max:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--purple);color:#fff}

/* Nav */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);
  background:rgba(0,0,0,.8);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-word{font-size:15px;font-weight:600;letter-spacing:-.02em}
.nav-cta{font-size:13px;font-weight:500;color:var(--accent);transition:opacity .15s}
.nav-cta:hover{opacity:.65}

/* Hero */
.hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:120px var(--pad) 100px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:1000px;height:1000px;
  background:radial-gradient(circle,rgba(79,90,151,.12) 0%,transparent 65%);
  pointer-events:none;
}
.eyebrow{
  font-size:13px;color:var(--accent);margin-bottom:32px;
  display:inline-flex;align-items:center;gap:8px;position:relative;z-index:1;
}
.blink{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bl 2.5s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.1}}
h1{
  font-size:clamp(64px,10vw,148px);font-weight:600;line-height:.96;letter-spacing:-.055em;
  margin-bottom:28px;position:relative;z-index:1;
}
h1 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.03em;color:var(--accent)}
.hero-sub{
  font-size:clamp(17px,1.8vw,22px);color:var(--muted);
  line-height:1.6;max-width:28ch;margin-bottom:52px;
  letter-spacing:-.01em;position:relative;z-index:1;
}

/* Form */
.fw{max-width:360px;width:100%;position:relative;z-index:1}
.fr{
  display:flex;align-items:center;
  background:rgba(255,255,255,.07);border:1px solid var(--line2);
  border-radius:999px;padding:5px 5px 5px 22px;
  transition:border-color .2s,background .2s;
}
.fr:focus-within{border-color:rgba(168,180,232,.5);background:rgba(255,255,255,.09)}
.fr input{flex:1;background:none;border:none;outline:none;font-size:15px;color:#fff;padding:11px 0;min-width:0}
.fr input::placeholder{color:rgba(255,255,255,.2)}
.fb{
  background:var(--accent);color:#000;padding:11px 22px;border-radius:999px;
  font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;
  transition:opacity .15s,transform .1s;
}
.fb:hover:not(:disabled){opacity:.82}
.fb:active{transform:scale(.98)}
.fb:disabled{opacity:.3;cursor:default}
.fn{font-size:12px;color:var(--dim);margin-top:14px}
.fe{font-size:12px;color:#F87171;margin-top:10px}
.ft{font-size:22px;font-weight:500;letter-spacing:-.03em;color:var(--accent);line-height:1.4}

/* Section shell */
.s{padding:140px var(--pad);display:flex;flex-direction:column;align-items:center;text-align:center}
.s.tight{padding:100px var(--pad)}
.si{max-width:var(--max);width:100%}
hr{border:none;border-top:1px solid var(--line)}

/* Kicker + Headlines */
.kicker{font-size:13px;color:var(--accent);letter-spacing:.01em;margin-bottom:28px}
h2{font-size:clamp(44px,7.5vw,108px);font-weight:600;line-height:.97;letter-spacing:-.054em}
h2 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.03em;color:var(--accent)}
h2 .soft{color:var(--muted)}
.ssub{font-size:clamp(16px,1.5vw,20px);color:var(--muted);max-width:36ch;line-height:1.65;margin-top:22px;letter-spacing:-.008em}

/* ── Prompts grid ── */
.prompts-grid{
  margin-top:72px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:var(--max);width:100%;text-align:left;
}
@media(max-width:700px){.prompts-grid{grid-template-columns:1fr 1fr}}
@media(max-width:440px){.prompts-grid{grid-template-columns:1fr}}
.prompt-card{
  background:#080808;border:1px solid var(--line2);border-radius:16px;
  padding:24px 26px;cursor:default;
  transition:border-color .2s,background .2s;
}
.prompt-card:hover{border-color:rgba(168,180,232,.28);background:#0C0C0C}
.prompt-icon{width:32px;height:32px;margin-bottom:16px;opacity:.7}
.prompt-q{font-size:15px;font-weight:500;letter-spacing:-.025em;color:var(--ink);line-height:1.4}
.prompt-tag{display:inline-block;margin-top:12px;font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}

/* ── Chat UI ── */
.chat-frame{

  border:1px solid var(--line2);border-radius:24px;overflow:hidden;

.chat-bar{

.cm{display:flex;flex-direction:column}
.cm.u{align-items:flex-end}
.cm.a{align-items:flex-start}
.bbl{

.data-chips{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}

.chip-val{font-size:19px;font-weight:600;letter-spacing:-.04em}
.chip-note{font-size:11px;color:var(--muted);margin-top:2px}
.typing{

.typing span:nth-child(3){animation-delay:.36s}

.chat-inp{

.m-h{font-size:clamp(22px,2.4vw,32px);font-weight:600;letter-spacing:-.04em;line-height:1.1;margin-bottom:14px}

.how{

.how-col:nth-child(2){padding-left:40px}

.how-n{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.how-t{font-size:18px;font-weight:600;letter-spacing:-.03em;margin-bottom:10px}
.how-b{font-size:14px;color:var(--muted);line-height:1.65}

.price-pair{
  margin-top:72px;display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--line);border:1px solid var(--line);

@media(max-width:480px){.price-pair{grid-template-columns:1fr}}
.pc{background:#000;padding:36px}
.pc.hi{background:#060606}
.pc-tier{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:20px}
.pc-amt{font-size:52px;font-weight:600;letter-spacing:-.055em}

.price-small{font-size:12px;color:var(--dim);margin-top:14px}

.sticky{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;transition:opacity .3s,transform .3s}
.sticky.hide{opacity:0;transform:translateX(-50%) translateY(12px);pointer-events:none}

.sticky-text{font-size:13px;color:rgba(255,255,255,.58);white-space:nowrap}
.sticky-btn{background:var(--accent);color:#000;padding:10px 22px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;transition:opacity .15s}
.sticky-btn:hover{opacity:.82}

/* Footer */
footer{padding:48px var(--pad);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.foot-brand{display:flex;align-items:center;gap:9px}
.foot-word{font-size:14px;font-weight:600;letter-spacing:-.02em}
.foot-copy{font-size:13px;color:var(--dim)}
.foot-links{display:flex;gap:22px}
.foot-link{font-size:13px;color:var(--muted);transition:color .15s}
.foot-link:hover{color:var(--ink)}

/* Reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .75s ease,transform .75s ease}
.rv.in{opacity:1;transform:none}

const Form = ({ source, btn="Join waitlist", ph="your@email.com" }) => {
  const [v,setV]=useState(""), [ok,setOk]=useState(false), [ld,setLd]=useState(false), [er,setEr]=useState("");
  const go = async e => {
    e.preventDefault();
    if (!v.includes("@")) { setEr("Enter a valid email."); return; }
    setLd(true); setEr("");
    try {
      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  );
};

const useReveal = () => {
  const r = useRef(null);
  useEffect(()=>{
    const el=r.current; if(!el) return;
    const o=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target);} });
    },{threshold:0.07});
    o.observe(el); return ()=>o.disconnect();
  },[]);
  return r;
};
