<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — talk to your money.</title>
  <meta name="description" content="Luca is an AI personal finance advisor that connects to your real bank and investment accounts and gives you specific, personalized advice based on your actual numbers.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <style>
/* Luca — landing page styles */
:root {
  --indigo: #4F5A97;
  --indigo-deep: #3D4778;
  --indigo-soft: #ECEFF7;
  --indigo-ink: #1E2240;
  --ink: #0A0A0A;
  --ink-2: #1A1A1A;
  --muted: #6B6B6B;
  --muted-2: #9B9B9B;
  --line: #ECECEA;
  --line-strong: #CFCFCB;
  --paper: #FAFAF8;
  --white: #FFFFFF;
  --green: #2F7A4F;

  --maxw: 1240px;
  --pad: clamp(24px, 4vw, 56px);

  --display: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --sans: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
  --serif: "Instrument Serif", "Times New Roman", serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--white);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }

::selection { background: var(--indigo); color: white; }

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--pad);
}

/* Header */
.nav {
  position: sticky; top: 0;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  z-index: 50;
  transition: border-color .2s ease;
}
.nav.scrolled { border-bottom-color: var(--line); }
.nav .wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 32px;
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.nav-brand img { display: block; width: 26px; height: 26px; }
.nav-brand-word {
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.nav-links {
  display: flex;
  gap: 32px;
  align-items: center;
}
.nav-links a {
  font-size: 14px;
  color: var(--muted-2);
  transition: color .15s ease;
}
.nav-links a:hover { color: var(--ink); }
.nav-cta {
  background: var(--ink);
  color: white;
  border: none;
  padding: 9px 16px;
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1.2;
  cursor: pointer;
  transition: background .15s ease, transform .15s ease;
  white-space: nowrap;
}
.nav-cta:hover { background: var(--indigo); transform: translateY(-1px); }

@media (max-width: 720px) {
  .nav .wrap { padding: 0 20px; }
  .nav-links a:not(.nav-cta) { display: none; }
  .nav-inner { height: 58px; }
  .nav-brand img { width: 22px; height: 22px; }
  .nav-brand-word { font-size: 16px; }
  .nav-cta { padding: 7px 13px; font-size: 11.5px; line-height: 1.2; }
}

.logo-mark { width: 32px; height: 32px; display: block; }

/* === Hero === */
.hero {
  padding: clamp(48px, 9vw, 120px) 0 clamp(40px, 6vw, 64px);
  position: relative;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--indigo);
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 36px;
}
.eyebrow::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--indigo);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.hero h1 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(38px, 5.6vw, 84px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  margin: 0 0 32px;
  max-width: 18ch;
}
.hero h1 .ital {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.02em;
}
.hero-sub {
  font-size: clamp(17px, 1.4vw, 20px);
  color: var(--muted);
  max-width: 54ch;
  line-height: 1.5;
  margin: 0 0 56px;
  letter-spacing: -0.005em;
}

/* === Chat demo === */
.demo {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--white);
  box-shadow: 0 1px 0 rgba(10,10,10,0.02), 0 30px 60px -30px rgba(40,50,100,0.18);
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 320px;
  min-height: 420px;
}
@media (max-width: 880px) {
  .demo { grid-template-columns: 1fr; }
  .demo-profile {
    border-left: none !important;
    border-bottom: 1px solid var(--line);
    order: -1;
  }
}

.demo-chat {
  display: flex; flex-direction: column;
  padding: 28px 28px 18px;
  position: relative;
  min-height: 420px;
  min-width: 0;
}
.demo-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 18px;
  gap: 12px;
  min-width: 0;
}
.demo-head-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--muted);
  font-family: var(--mono);
  letter-spacing: 0.02em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.demo-head-title > span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.demo-head-text-short { display: none; }
@media (max-width: 720px) {
  .demo-head-text-full { display: none; }
  .demo-head-text-short { display: inline; }
}
.demo-head-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px rgba(47,122,79,0.12);
}
.demo-reset {
  font-family: var(--mono); font-size: 12px;
  color: var(--muted-2); background: none; border: none; padding: 4px 8px;
  border-radius: 6px;
}
.demo-reset:hover { background: var(--paper); color: var(--ink); }

.demo-scroll {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 18px;
  padding-right: 6px;
  min-height: 240px;
}
.msg { display: flex; gap: 14px; max-width: 92%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; max-width: 80%; }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  flex-shrink: 0;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
}
.msg.luca .msg-avatar { background: var(--indigo-soft); color: var(--indigo); }
.msg.user .msg-avatar { background: var(--ink); color: white; }
.msg-bubble {
  font-size: 15.5px;
  line-height: 1.55;
  letter-spacing: -0.005em;
  white-space: pre-wrap;
}
.msg.user .msg-bubble {
  background: var(--paper);
  padding: 10px 14px;
  border-radius: 14px 14px 4px 14px;
  border: 1px solid var(--line);
}
.msg.luca .msg-bubble { padding-top: 3px; }
.msg-bubble strong { color: var(--indigo); font-weight: 600; }

.typing {
  display: inline-flex; gap: 4px; align-items: center;
  padding: 4px 0;
}
.typing span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--indigo);
  opacity: 0.4;
  animation: bounce 1.2s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { opacity:0.3; transform: translateY(0);} 40%{opacity:1; transform: translateY(-3px);} }

.demo-input-wrap { margin-top: 14px; min-width: 0; }
.suggest-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  min-width: 0;
}
.suggest-chip {
  font-family: var(--sans);
  font-size: 13px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink-2);
  padding: 7px 12px;
  border-radius: 999px;
  transition: all .15s ease;
  letter-spacing: -0.005em;
}
.suggest-chip:hover { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-soft); }
.suggest-chip:disabled { opacity: 0.4; cursor: default; }
.demo-input {
  display: flex; align-items: center;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px 4px 4px 16px;
  transition: border-color .15s ease;
}
.demo-input:focus-within { border-color: var(--indigo); background: white; }
.demo-input input {
  flex: 1; background: none; border: none; outline: none;
  font-size: 15.5px; color: var(--ink);
  padding: 12px 6px;
}
.demo-input input::placeholder { color: var(--muted-2); }
.demo-send {
  background: var(--ink); color: white; border: none;
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  transition: background .15s ease;
}
.demo-send:hover:not(:disabled) { background: var(--indigo); }
.demo-send:disabled { opacity: 0.3; cursor: default; }

.demo-profile {
  border-left: 1px solid var(--line);
  background: var(--paper);
  padding: 26px 26px 22px;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--muted);
  display: flex; flex-direction: column; gap: 18px;
  min-width: 0;
}
.demo-profile h4 {
  font-family: var(--sans);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted-2);
  margin: 0 0 4px;
  font-weight: 500;
}
.demo-profile .name {
  font-family: var(--display);
  font-size: 17px;
  color: var(--ink);
  font-weight: 500;
  letter-spacing: -0.01em;
}
.profile-grid { display: grid; gap: 10px; }
.profile-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
}
.profile-row:last-child { border-bottom: none; }
.profile-row b {
  color: var(--ink); font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.profile-note {
  font-size: 11px; line-height: 1.5;
  color: var(--muted-2);
  font-family: var(--sans);
  letter-spacing: -0.005em;
  margin-top: 4px;
}

/* === Luca's read === */
.lucas-read {
  margin-top: 4px;
  padding-top: 22px;
  border-top: 1px solid var(--line-strong);
}
.lucas-read-tag {
  font-family: var(--mono); font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--indigo);
  margin-bottom: 8px;
}
.lucas-read p {
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
  line-height: 1.35;
  letter-spacing: -0.005em;
  color: var(--indigo-ink);
  margin: 0;
}
.lucas-read p b {
  font-style: normal;
  font-family: var(--display);
  font-weight: 500;
  color: var(--indigo);
}

/* === Differentiator === */
.diff-section { background: var(--paper); border-top: 1px solid var(--line); }
.diff-grid {
  margin-top: 56px;
  display: flex; flex-direction: column;
  gap: 0;
  border-top: 1px solid var(--line);
}
.diff-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border-bottom: 1px solid var(--line);
}
.diff-them, .diff-us { padding: 28px 32px; }
.diff-them { border-right: 1px solid var(--line); color: var(--muted); }
.diff-us { background: white; }
.diff-label {
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted-2);
  margin-bottom: 14px;
}
.diff-us .diff-label { color: var(--indigo); }
.diff-them p, .diff-us p {
  font-family: var(--display);
  font-size: 17px;
  line-height: 1.45;
  letter-spacing: -0.01em;
  margin: 0;
}
.diff-us p { color: var(--ink); }
.diff-us p b { font-weight: 500; color: var(--indigo); }

@media (max-width: 720px) {
  .diff-grid { margin-top: 32px; }
  .diff-row { grid-template-columns: 1fr; }
  .diff-them, .diff-us { padding: 22px 20px; }
  .diff-them { border-right: none; border-bottom: 1px dashed var(--line); }
  .diff-them p, .diff-us p { font-size: 15.5px; }
  .lucas-read p { font-size: 16px; line-height: 1.4; }
}

.savings-figure-small {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px dashed var(--line-strong);
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
  letter-spacing: -0.01em;
  color: var(--indigo);
  line-height: 1.4;
}
@media (max-width: 720px) { .savings-figure-small { font-size: 16px; } }

/* === Manifesto === */
.manifesto {
  padding: clamp(64px, 9vw, 120px) 0 clamp(64px, 9vw, 120px);
  border-top: 1px solid var(--line);
}
.manifesto-rule {
  width: 48px; height: 1px;
  background: var(--indigo);
  margin-bottom: 32px;
}
.manifesto-text {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(26px, 3.6vw, 52px);
  line-height: 1.18;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0 0 18px;
  max-width: 24ch;
}
.manifesto-text:last-of-type { color: var(--indigo); margin-bottom: 0; }
.manifesto-text .ital { font-family: var(--serif); font-style: italic; font-weight: 400; }

/* === Sections === */
.section {
  padding: clamp(80px, 10vw, 140px) 0;
  border-top: 1px solid var(--line);
}
.section-eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--indigo);
  margin-bottom: 28px;
  display: flex; gap: 12px; align-items: center;
}
.section-eyebrow .num { display: inline-block; min-width: 24px; }
.section h2 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(30px, 4vw, 56px);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin: 0 0 28px;
  max-width: 22ch;
}
.section h2 .ital { font-family: var(--serif); font-style: italic; font-weight: 400; }
.section-lead {
  font-size: clamp(17px, 1.5vw, 20px);
  color: var(--muted);
  max-width: 56ch;
  line-height: 1.5;
  margin: 0;
}

/* === Account connector === */
.accounts-stage {
  margin-top: 64px;
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: stretch;
}
@media (max-width: 880px) { .accounts-stage { grid-template-columns: 1fr; } }

.accounts-list { display: flex; flex-direction: column; gap: 12px; }
.account-card {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: white;
  transition: all .25s cubic-bezier(.2,.7,.2,1);
  position: relative;
  overflow: hidden;
}
.account-card.connected {
  border-color: var(--indigo);
  box-shadow: 0 10px 30px -20px rgba(79,90,151,0.4);
}
.account-card .acc-logo {
  width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700;
  letter-spacing: -0.02em;
  font-size: 16px;
  color: white;
  flex-shrink: 0;
}
.account-card .acc-info { flex: 1; min-width: 0; }
.account-card .acc-name { font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
.account-card .acc-meta { font-family: var(--mono); font-size: 12px; color: var(--muted-2); margin-top: 2px; }
.account-card .acc-bal {
  font-family: var(--mono);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  color: var(--ink);
  text-align: right;
}
.account-card .acc-bal .small { color: var(--muted-2); font-size: 11px; display: block; }

.accounts-snapshot {
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px;
  background: var(--paper);
  display: flex; flex-direction: column; gap: 18px;
  position: relative;
}
.snapshot-label {
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted-2);
}
.snapshot-figure {
  font-family: var(--display);
  font-size: clamp(48px, 6.5vw, 88px);
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.snapshot-delta {
  font-family: var(--mono); font-size: 13px;
  color: var(--green);
  display: inline-flex; align-items: center; gap: 6px;
}
.snapshot-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin-top: 8px;
}
.snapshot-item { border-top: 1px solid var(--line-strong); padding-top: 12px; }
.snapshot-item .k {
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted-2);
  margin-bottom: 4px;
}
.snapshot-item .v {
  font-family: var(--display); font-size: 22px;
  font-weight: 500; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.snapshot-spark { margin-top: 12px; }

/* === Daily brief === */
.brief-wrap { margin-top: 56px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 36px; align-items: start; }
@media (max-width: 880px) { .brief-wrap { grid-template-columns: 1fr; } }

.brief-card {
  background: var(--ink);
  color: white;
  border-radius: 24px;
  padding: 36px;
  position: relative;
  overflow: hidden;
  min-height: 460px;
}
.brief-meta {
  font-family: var(--mono); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: rgba(255,255,255,0.5);
  margin-bottom: 24px;
  display: flex; align-items: center; gap: 12px;
}
.brief-meta::before {
  content: ""; width: 24px; height: 1px; background: rgba(255,255,255,0.3);
}
.brief-card h3 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(24px, 2.6vw, 34px);
  line-height: 1.15;
  letter-spacing: -0.025em;
  margin: 0 0 24px;
  color: white;
}
.brief-card h3 .accent { color: #B4BEE7; }
.brief-card p {
  font-size: 15.5px;
  line-height: 1.55;
  color: rgba(255,255,255,0.78);
  margin: 0 0 18px;
  letter-spacing: -0.005em;
}
.brief-card p strong { color: white; font-weight: 600; }
.brief-bullets { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-direction: column; gap: 14px; }
.brief-bullets li {
  font-size: 14px; line-height: 1.4;
  color: rgba(255,255,255,0.85);
  padding-left: 22px;
  position: relative;
}
.brief-bullets li::before {
  content: ""; position: absolute; left: 0; top: 7px;
  width: 12px; height: 1px; background: var(--indigo);
}
.brief-bullets li b { color: white; font-weight: 600; }

.alerts-list { display: flex; flex-direction: column; gap: 12px; }
.alert {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  display: flex; gap: 14px; align-items: flex-start;
  background: white;
  transition: border-color .15s, transform .15s;
  cursor: pointer;
}
.alert:hover { border-color: var(--indigo); transform: translateX(4px); }
.alert-icon {
  height: 26px;
  padding: 0 10px;
  border-radius: 6px;
  background: var(--indigo-soft);
  color: var(--indigo);
  display: inline-flex; align-items: center;
  flex-shrink: 0;
  font-family: var(--mono); font-weight: 500;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
}
.alert-body .alert-title {
  font-size: 15px; font-weight: 500; letter-spacing: -0.01em;

    const SUGGESTED = [
      "Can I afford a house in 3 years?",
      "Am I saving enough for retirement?",
      "Where should I move the $32k in my checking?",
      "Should I pay off my student loans faster?",
    ];

    const CANNED = {
      [SUGGESTED[0]]: "On a $650k place with 20% down, you need **$160k** for the down payment plus closing. At your current $1,170/mo savings rate you'll get there with about $4k to spare — but the $32k sitting in your Chase checking is dragging on returns. Move $24k of it into your Ally HYSA earning 4.2% and you'll add **$1,008/yr** without changing your spending. You're closer than you think, Maya.",
      [SUGGESTED[1]]: "At 29 with **$84,200** in your 401k and **$19,400** in the Roth, you're ahead of ~78% of your peers. But your 8% contribution is leaving free money on the table — Fidelity's full match runs to 12%. Bump to 10% and you'll add roughly **$280/mo** in matched dollars. Separately, your Roth is **$3,200** short of the 2026 limit. Auto-deposit $78/wk for 41 weeks and we close it before December.",
      [SUGGESTED[2]]: "Most of it shouldn't be there. Keep **$8,400** in Chase (one month's spend × 2 — your real emergency buffer). The other **$24,000** belongs in your Ally HYSA at 4.2% — that's **$1,008/yr** in interest you're not getting right now. Do it before Friday's paycheck hits and you'll have one clean month of cash flow to read.",
      [SUGGESTED[3]]: "Probably not. Your loans are at **4.5%** — your Ally HYSA pays **4.2%**. The math is almost identical. Meanwhile your Roth IRA averages **8–9%** long-term, and it's tax-free. Keep the $312/mo minimum, max the Roth first ($3,200 to go this year), and only attack the loans if rates change. The exception: if the 4.5% feels heavy emotionally, paying ahead has real value. Money isn't only math.",
    };

    const FALLBACK = "In this preview I can answer the four sample questions above using **Maya's** real profile. To see Luca reason about *your* numbers — your income, your accounts, your goals — join the waitlist below. Early access opens summer 2026.";

    const INITIAL_MSG = {
      role: "luca",
      text: "Morning, Maya. I just looked at your accounts — your **net worth is $126,260**, up $1,840 this month. Your checking balance is high again. What's on your mind?"
    };

    const renderBold = (text) => {
      const parts = text.split(/(\*\*[^*]+\*\*)/g);
      return parts.map((p, i) => {
        if (p.startsWith("**") && p.endsWith("**")) {
          return <strong key={i}>{p.slice(2, -2)}</strong>;
        }
        return <React.Fragment key={i}>{p}</React.Fragment>;
      });
    };

    const simulateThinking = () => new Promise(r => setTimeout(r, 700 + Math.random() * 600));

    const ChatDemo = () => {
      const [messages, setMessages] = React.useState([INITIAL_MSG]);
      const [input, setInput] = React.useState("");
      const [busy, setBusy] = React.useState(false);
      const [usedSuggestions, setUsedSuggestions] = React.useState([]);
      const scrollRef = React.useRef(null);

      React.useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages, busy]);

      const ask = async (q) => {
        if (!q.trim() || busy) return;
        setMessages(prev => [...prev, { role: "user", text: q }]);
        setInput("");
        setBusy(true);
        await simulateThinking();
        const reply = CANNED[q] || FALLBACK;
        setMessages(prev => [...prev, { role: "luca", text: reply }]);
        setBusy(false);
      };

      const reset = () => {
        setMessages([INITIAL_MSG]);
        setUsedSuggestions([]);
        setInput("");
      };

      const onSuggest = (q) => {
        setUsedSuggestions(prev => [...prev, q]);
        ask(q);
      };

      return (
        <div className="demo reveal" data-reveal>
          <div className="demo-chat">
            <div className="demo-head">
              <div className="demo-head-title">
                <span className="demo-head-dot" />
                <span className="demo-head-text-full">luca.live — connected to Maya's accounts</span>
                <span className="demo-head-text-short">luca.live · Maya's accounts</span>
              </div>
              <button className="demo-reset" onClick={reset}>↺ reset</button>
            </div>

            <div className="demo-scroll" ref={scrollRef}>
              {messages.map((m, i) => (
                <div key={i} className={`msg ${m.role}`}>
                  <div className="msg-avatar">{m.role === "luca" ? "L" : "M"}</div>
                  <div className="msg-bubble">{renderBold(m.text)}</div>
                </div>
              ))}
              {busy && (
                <div className="msg luca">
                  <div className="msg-avatar">L</div>
                  <div className="msg-bubble">
                    <div className="typing"><span /><span /><span /></div>
                  </div>
                </div>
              )}
            </div>

            <div className="demo-input-wrap">
              <div className="suggest-row">
                {SUGGESTED.map((s) => (
                  <button
                    key={s}
                    className="suggest-chip"
                    disabled={busy || usedSuggestions.includes(s)}
                    onClick={() => onSuggest(s)}
                  >{s}</button>
                ))}
              </div>
              <form className="demo-input" onSubmit={(e) => { e.preventDefault(); ask(input); }}>
                <input
                  type="text"
                  placeholder="Try one of the questions above…"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  disabled={busy}
                />
                <button type="submit" className="demo-send" disabled={busy || !input.trim()} aria-label="Send">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                </button>
              </form>
            </div>
          </div>

          <aside className="demo-profile">
            <div>
              <h4>Sample profile</h4>
              <div className="name">Maya, 29 · NYC</div>
              <div className="profile-note">Luca's answers below come from her real numbers — connected via Plaid, read-only.</div>
            </div>
            <div className="profile-grid">
              <div className="profile-row"><span>Net worth</span><b>$126,260</b></div>
              <div className="profile-row"><span>Checking</span><b>$32,400</b></div>
              <div className="profile-row"><span>HYSA · 4.2%</span><b>$8,100</b></div>
              <div className="profile-row"><span>401k</span><b>$84,200</b></div>
              <div className="profile-row"><span>Roth IRA</span><b>$19,400</b></div>
              <div className="profile-row"><span>Student loans</span><b>−$18,000</b></div>
              <div className="profile-row"><span>Saves / mo</span><b>$1,170</b></div>
            </div>
          </aside>
        </div>
      );
    };
    window.ChatDemo = ChatDemo;
  </script>

  <script type="text/babel">
    const Afford = () => {
      const [target, setTarget] = React.useState(650000);
      const [years, setYears] = React.useState(3);
      const [downPct, setDownPct] = React.useState(20);

      const monthlyIncome = 9333;
      const monthlySpend = 4171;
      const currentSavings = 40500;
      const currentMonthlySave = 1170;

      const downAmount = target * downPct / 100;
      const closingCosts = target * 0.03;
      const needed = downAmount + closingCosts;
      const months = years * 12;
      const projected = currentSavings * Math.pow(1.042, years) + currentMonthlySave * months * 1.04;
      const gap = needed - projected;
      const requiredMonthly = Math.max(0, (needed - currentSavings * Math.pow(1.042, years)) / months);
      const onTrack = gap <= 0;
      const stretch = !onTrack && (requiredMonthly - currentMonthlySave) < (monthlyIncome - monthlySpend) * 1.1;

      let verdict, copy;
      if (onTrack) {
        verdict = <span><span className="ital">yes</span> — you're already on track.</span>;
        copy = `At your current savings rate, you'll have enough for the down payment plus closing costs with about $${Math.round(-gap/1000)}k to spare. Don't change much — just keep going.`;
      } else if (stretch) {
        verdict = <span><span className="ital">yes</span>, but you'll need to save more.</span>;
        copy = `You need to save $${Math.round(requiredMonthly).toLocaleString()}/mo (currently $${currentMonthlySave.toLocaleString()}/mo). That's tight but doable — move the $32k checking surplus into a 4.5% HYSA, and redirect ~$${Math.round(requiredMonthly - currentMonthlySave).toLocaleString()}/mo from spending.`;
      } else {
        verdict = <span><span className="ital">not</span> at this price.</span>;
        copy = `You'd need to save $${Math.round(requiredMonthly).toLocaleString()}/mo, more than your current monthly cash flow allows. Consider $${Math.round(target * 0.75 / 10000) * 10000} or stretching to ${years + 2} years.`;
      }

      return (
        <div className="afford-stage reveal" data-reveal>
          <p className="afford-q">
            Can I afford a <span className="var">${(target/1000).toFixed(0)}k</span> place in <span className="var">{years}</span> {years === 1 ? "year" : "years"} with <span className="var">{downPct}%</span> down<span className="ital">?</span>
          </p>
          <div className="afford-controls">
            <div className="afford-control">
              <label><span>Home price</span><b>${target.toLocaleString()}</b></label>
              <input className="range" type="range" min="250000" max="1200000" step="25000" value={target} onChange={(e) => setTarget(+e.target.value)} />
            </div>
            <div className="afford-control">
              <label><span>Timeline</span><b>{years} {years === 1 ? "year" : "years"}</b></label>
              <input className="range" type="range" min="1" max="10" step="1" value={years} onChange={(e) => setYears(+e.target.value)} />
            </div>
            <div className="afford-control">
              <label><span>Down payment</span><b>{downPct}%</b></label>
              <input className="range" type="range" min="5" max="30" step="1" value={downPct} onChange={(e) => setDownPct(+e.target.value)} />
            </div>
            <div className="afford-control">
              <label><span>Maya's savings rate</span><b>${currentMonthlySave.toLocaleString()}/mo</b></label>
              <input className="range" type="range" min="0" max="3500" step="50" value={currentMonthlySave} disabled style={{opacity: 0.5}} />
            </div>
          </div>
          <div className="afford-answer">
            <div>
              <div className={`verdict ${onTrack ? "yes" : (stretch ? "" : "no")}`}>{verdict}</div>
              <p>{copy}</p>
            </div>
            <div className="afford-numbers">
              <div className="afford-num-row"><span className="k">Total needed</span><span className="v">${Math.round(needed).toLocaleString()}</span></div>
              <div className="afford-num-row"><span className="k">Projected savings</span><span className="v">${Math.round(projected).toLocaleString()}</span></div>
              <div className="afford-num-row"><span className="k">Gap</span><span className="v" style={{color: onTrack ? "var(--green)" : "#8A3D3D"}}>{onTrack ? `+${Math.round(-gap).toLocaleString()}` : `−${Math.round(gap).toLocaleString()}`}</span></div>
              <div className="afford-num-row"><span className="k">Save / month to hit it</span><span className="v">${Math.round(requiredMonthly).toLocaleString()}</span></div>
              <div className="afford-num-row"><span className="k">Where Luca says to park it</span><span className="v">Ally HYSA · 4.2%</span></div>
            </div>
          </div>
        </div>
      );
    };
    window.Afford = Afford;
  </script>

  <script type="text/babel">
    const ACCOUNTS = [
      { id: "chase",    name: "Chase Checking",          meta: "•••• 4821",       balance: 32400,  color: "#117ACA", letter: "C" },
      { id: "ally",     name: "Ally High-Yield Savings",  meta: "4.2% APY",        balance: 8100,   color: "#660099", letter: "A" },
      { id: "fidelity", name: "Fidelity 401k",            meta: "Target 2055 Fund", balance: 84200,  color: "#268d3a", letter: "F" },
      { id: "vanguard", name: "Vanguard Roth IRA",        meta: "VTSAX",           balance: 19400,  color: "#9B1C2E", letter: "V" },
      { id: "amex",     name: "Chase Sapphire",           meta: "•••• 3304",       balance: -1840,  color: "#0A0A0A", letter: "C" },
      { id: "sallie",   name: "Federal Student Loans",    meta: "4.5% wt avg",     balance: -18000, color: "#5A5FA8", letter: "S" },
    ];

    const fmtBal = (n) => (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString();

    const Spark = ({ data }) => {
      const w = 320, h = 56, pad = 2;
      if (!data || data.length < 2) return null;
      const min = Math.min(...data), max = Math.max(...data);
      const range = max - min || 1;
      const stepX = (w - pad * 2) / (data.length - 1);
      const points = data.map((d, i) => [pad + i * stepX, pad + (h - pad * 2) * (1 - (d - min) / range)]);
      const line = points.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(" ");
      const fill = `${line} L${w - pad},${h} L${pad},${h} Z`;
      return (
        <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
          <path className="fill" d={fill} />
          <path className="line" d={line} />
        </svg>
      );
    };

    const Accounts = () => {
      const total  = ACCOUNTS.reduce((s, a) => s + a.balance, 0);
      const assets = ACCOUNTS.reduce((s, a) => s + (a.balance > 0 ? a.balance : 0), 0);
      const liab   = ACCOUNTS.reduce((s, a) => s + (a.balance < 0 ? -a.balance : 0), 0);

      const spark = React.useMemo(() => {
        const n = 24;
        return Array.from({ length: n }, (_, i) => {
          const base = total * (0.55 + 0.45 * (i / (n - 1)));
          return base + Math.sin(i * 0.7) * 0.04 * total;
        });
      }, [total]);

      return (
        <div className="accounts-stage reveal" data-reveal>
          <div className="accounts-list">
            {ACCOUNTS.map((a) => (
              <div key={a.id} className="account-card connected">
                <div className="acc-logo" style={{ background: a.color }}>{a.letter}</div>
                <div className="acc-info">
                  <div className="acc-name">{a.name}</div>
                  <div className="acc-meta">{a.meta}</div>
                </div>
                <div className="acc-bal">
                  {fmtBal(a.balance)}
                  <span className="small">{a.balance < 0 ? "balance owed" : "current balance"}</span>
                </div>
              </div>
            ))}
          </div>

          <div className="accounts-snapshot">
            <div className="snapshot-label">Net worth — live</div>
            <div className="snapshot-figure">${total.toLocaleString()}</div>
            <div className="snapshot-delta">↗ +$1,840 this month · {ACCOUNTS.length} accounts linked</div>
            <div className="snapshot-grid">
              <div className="snapshot-item"><div className="k">Assets</div><div className="v">${assets.toLocaleString()}</div></div>
              <div className="snapshot-item"><div className="k">Liabilities</div><div className="v">−${liab.toLocaleString()}</div></div>
              <div className="snapshot-item"><div className="k">Savings rate</div><div className="v">28%</div></div>
              <div className="snapshot-item"><div className="k">Cash flow</div><div className="v" style={{ color: "var(--green)" }}>+$1,170</div></div>
            </div>
            <div className="snapshot-spark">
              <Spark data={spark} />
              <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--mono)", fontSize: 10, color: "var(--muted-2)", marginTop: 4, letterSpacing: "0.04em" }}>
                <span>24 MONTHS AGO</span><span>TODAY</span>
              </div>
            </div>
            <div className="lucas-read">
              <div className="lucas-read-tag">Luca's read</div>
              <p>Your <b>$32,400 in checking</b> is the weak spot. Move $24k into the Ally HYSA and you'll earn <b>$1,008/yr</b> doing nothing else.</p>
            </div>
          </div>
        </div>
      );
    };
    window.Accounts = Accounts;
  </script>

  <script type="text/babel">

      React.useEffect(() => {
        const els = document.querySelectorAll("[data-reveal]");
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add("in"); });
        }, { threshold: 0.12 });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    };

    const useScrolled = () => {
      const [scrolled, setScrolled] = React.useState(false);
      React.useEffect(() => {
