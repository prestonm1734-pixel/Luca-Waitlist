<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — The autonomous financial agent.</title>
  <meta name="description" content="Luca watches every dollar 24/7. Finds problems before you know they exist. Delivers ready-to-execute solutions. You just tap approve.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%237B86E8'><rect x='46' y='14' width='8' height='8' rx='1.5'/><rect x='78' y='46' width='8' height='8' rx='1.5'/><rect x='46' y='78' width='8' height='8' rx='1.5'/><rect x='14' y='46' width='8' height='8' rx='1.5'/><rect x='69' y='23' width='8' height='8' rx='1.5' transform='rotate(45 73 27)'/><rect x='69' y='69' width='8' height='8' rx='1.5' transform='rotate(45 73 73)'/><rect x='23' y='69' width='8' height='8' rx='1.5' transform='rotate(45 27 73)'/><rect x='23' y='23' width='8' height='8' rx='1.5' transform='rotate(45 27 27)'/><circle cx='50' cy='50' r='17'/><circle cx='50' cy='50' r='11' fill='%230A0908'/><circle cx='50' cy='50' r='6'/><circle cx='50' cy='50' r='2.2' fill='%230A0908'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#0A0908;
  --bg-2:#0F0E0D;
  --panel:#13110F;
  --panel-2:#1A1715;
  --ink:#F5F1E8;
  --ink-2:#E4DFD3;
  --muted:#8E867A;
  --dim:#56514A;
  --line:#1F1B17;
  --line-2:#2A2520;
  --line-3:#3A332C;
  --accent:#7B86E8;
  --accent-hi:#9AA3F0;
  --accent-soft:rgba(123,134,232,.10);
  --accent-glow:rgba(123,134,232,.28);
  --green:#7FC598;
  --red:#E07C6E;
  --gold:#D4B66A;
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Instrument Serif","Times New Roman",serif;
  --pad:clamp(20px,5vw,72px);
  --max:1240px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 800px at 20% -10%, rgba(123,134,232,.06), transparent 60%),
    radial-gradient(900px 600px at 100% 15%, rgba(212,182,106,.03), transparent 55%),
    var(--bg);
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:#0A0908}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:0}
input{font-family:inherit}

.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.7'/></svg>");
}

.shell{position:relative;z-index:2;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

.topbar{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  background:rgba(10,9,8,.72);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:32px}
.nav-link{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;transition:color .2s}
.nav-link:hover{color:var(--ink)}
.status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(127,197,152,.7);animation:pulse 2.4s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(127,197,152,.7)}
  70%{box-shadow:0 0 0 8px rgba(127,197,152,0)}
  100%{box-shadow:0 0 0 0 rgba(127,197,152,0)}
}
@media(max-width:760px){.nav{display:none}}

.issue{
  display:flex;justify-content:space-between;align-items:center;
  padding:28px 0 18px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.16em;
}
.issue-l{display:flex;gap:36px;align-items:center}
.issue-l span:first-child{color:var(--ink-2)}
@media(max-width:640px){.issue-l span:not(:first-child){display:none}.issue-r{display:none}}

.hero{padding:80px 0 100px;position:relative}
.hero-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:64px;align-items:end}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr;gap:48px}}

.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.18em;
  padding:6px 12px;border:1px solid var(--line-3);
  border-radius:100px;background:var(--accent-soft);
  margin-bottom:36px;
}
.eyebrow-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}

.hero-title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(56px,9vw,128px);
  line-height:.92;letter-spacing:-.025em;
  color:var(--ink);
  margin:0 0 32px;
}
.hero-title em{font-style:italic;color:var(--accent-hi);font-weight:400}
.hero-title .word{display:inline-block;opacity:0;transform:translateY(24px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero-title .word:nth-child(1){animation-delay:.04s}
.hero-title .word:nth-child(2){animation-delay:.12s}
.hero-title .word:nth-child(3){animation-delay:.20s}
.hero-title .word:nth-child(4){animation-delay:.28s}
.hero-title .word:nth-child(5){animation-delay:.36s}
.hero-title .word:nth-child(6){animation-delay:.44s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

.hero-sub{
  font-family:var(--sans);font-weight:400;
  font-size:clamp(16px,1.7vw,19px);line-height:1.5;
  color:var(--muted);max-width:520px;margin:0 0 40px;
  opacity:0;animation:rise .9s .7s cubic-bezier(.2,.7,.2,1) forwards;
}

.hero-form{
  display:flex;gap:0;
  border:1px solid var(--line-3);border-radius:100px;
  padding:6px;background:var(--panel);
  max-width:480px;
  transition:border-color .25s,box-shadow .25s;
  opacity:0;animation:rise .9s .85s cubic-bezier(.2,.7,.2,1) forwards;
}
.hero-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hero-form input{
  flex:1;background:0;border:0;outline:0;
  font-size:15px;color:var(--ink);
  padding:12px 18px;letter-spacing:-.005em;
}
.hero-form input::placeholder{color:var(--dim)}
.hero-form button{
  background:var(--ink);color:var(--bg);
  font-weight:500;font-size:14px;
  padding:12px 22px;border-radius:100px;
  letter-spacing:-.005em;
  transition:transform .2s,background .2s;
}
.hero-form button:hover{background:var(--accent-hi);transform:translateY(-1px)}
.hero-form button:disabled{opacity:.5;cursor:wait}
.hero-form.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hero-micro{
  display:flex;gap:16px;margin-top:18px;
  font-family:var(--mono);font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.14em;
  opacity:0;animation:rise .9s 1s cubic-bezier(.2,.7,.2,1) forwards;
}
.hero-micro span{display:flex;align-items:center;gap:6px}
.hero-micro span::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--muted)}

.hero-ok{
  font-family:var(--serif);font-style:italic;
  color:var(--accent-hi);font-size:18px;
  padding:14px 4px;
}
.hero-err{
  color:var(--red);font-family:var(--mono);font-size:11px;
  text-transform:uppercase;letter-spacing:.14em;
  padding:10px 4px 0;
}

.hero-right{
  border:1px solid var(--line-2);
  border-radius:18px;
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg-2) 100%);
  padding:28px;
  position:relative;overflow:hidden;
  opacity:0;animation:rise .9s 1.1s cubic-bezier(.2,.7,.2,1) forwards;
}
.hero-right::before{
  content:"";position:absolute;top:-1px;left:24px;right:24px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.6;
}
.hr-label{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.18em;
  display:flex;align-items:center;gap:8px;margin-bottom:18px;
}
.hr-label::after{content:"";flex:1;height:1px;background:var(--line-2)}
.hr-num{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(40px,5vw,56px);
  letter-spacing:-.02em;line-height:1;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:6px;
}
.hr-num small{font-size:.4em;color:var(--muted);font-family:var(--mono);font-weight:400}
.hr-cap{
  font-family:var(--sans);font-size:13px;color:var(--muted);
  margin-top:10px;line-height:1.5;
}
.hr-tickers{
  margin-top:22px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:11px;
}
.tick{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:11.5px}
.tick-l{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;flex-shrink:0}
.tick-r{color:var(--ink);font-variant-numeric:tabular-nums}
.tick-r.green{color:var(--green)}

.section{padding:clamp(80px,12vw,140px) 0;border-top:1px solid var(--line)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:60px;gap:40px;flex-wrap:wrap}
.section-num{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.18em;margin-bottom:18px}
.section-title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(38px,5.6vw,68px);
  line-height:1;letter-spacing:-.02em;
  margin:0;max-width:760px;
}
.section-title em{font-style:italic;color:var(--accent-hi)}
.section-sub{
  font-family:var(--sans);font-size:15px;line-height:1.5;
  color:var(--muted);max-width:380px;margin:0;
}

.agent{
  border:1px solid var(--line-2);border-radius:20px;
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg-2) 100%);
  overflow:hidden;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset;
}
.agent-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.2);
}
.agent-head-l{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.14em}
.agent-head-r{display:flex;gap:24px;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.agent-head-r b{color:var(--green);font-variant-numeric:tabular-nums;font-weight:500}
@media(max-width:640px){.agent-head{flex-direction:column;align-items:flex-start;gap:12px}.agent-head-r{gap:16px;font-size:10.5px}}

.feed{padding:8px 0}
.feed-row{
  display:grid;grid-template-columns:90px 1fr auto;
  gap:24px;align-items:center;
  padding:20px 24px;border-bottom:1px solid var(--line);
  transition:background .2s;
  opacity:0;transform:translateY(8px);
}
.feed-row.in{opacity:1;transform:translateY(0);transition:opacity .5s,transform .5s,background .2s}
.feed-row:last-child{border-bottom:0}
.feed-row:hover{background:rgba(255,255,255,.015)}
@media(max-width:760px){.feed-row{grid-template-columns:1fr;gap:10px;padding:18px 20px}}
.feed-time{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.feed-text{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink-2);letter-spacing:-.005em}
.feed-text strong{color:var(--ink);font-weight:500}
.feed-text .save{color:var(--green);font-weight:500;font-variant-numeric:tabular-nums}
.feed-text .loss{color:var(--red);font-weight:500;font-variant-numeric:tabular-nums}
.feed-btn{
  font-family:var(--sans);font-size:13px;font-weight:500;
  padding:9px 18px;border-radius:100px;
  background:var(--ink);color:var(--bg);
  letter-spacing:-.005em;
  transition:transform .2s,background .2s,opacity .2s;
  white-space:nowrap;
  border:1px solid var(--ink);
}
.feed-btn:hover{background:var(--accent-hi);border-color:var(--accent-hi);transform:translateY(-1px)}
.feed-btn.done{
  background:transparent;color:var(--green);border:1px solid var(--line-3);
  display:inline-flex;align-items:center;gap:6px;
  cursor:default;pointer-events:none;
}
.feed-btn.done::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(127,197,152,.5)}
@media(max-width:760px){.feed-btn{justify-self:start}}

.agent-foot{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  border-top:1px solid var(--line);
  background:rgba(0,0,0,.18);
}
.agent-stat{padding:22px 24px;border-right:1px solid var(--line)}
.agent-stat:last-child{border-right:0}
.agent-stat-l{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin-bottom:8px}
.agent-stat-n{font-family:var(--serif);font-size:30px;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.agent-stat-n.green{color:var(--green)}
@media(max-width:640px){.agent-foot{grid-template-columns:1fr}.agent-stat{border-right:0;border-bottom:1px solid var(--line)}.agent-stat:last-child{border-bottom:0}}

.brief-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
@media(max-width:980px){.brief-grid{grid-template-columns:1fr;gap:32px}}
.brief-panel{
  border:1px solid var(--line-2);border-radius:18px;
  background:var(--panel);
  padding:36px;
  position:relative;
  min-height:280px;
}
.brief-panel::before{
  content:"";position:absolute;left:24px;right:24px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.brief-h{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.brief-h-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--line-3);display:flex;align-items:center;justify-content:center}
.brief-h-l{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.16em}
.brief-h-r{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;margin-left:auto}
.brief-text{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(22px,2.6vw,30px);line-height:1.32;
  color:var(--ink-2);letter-spacing:-.005em;
  min-height:160px;
}
.brief-text strong{font-style:italic;color:var(--accent-hi);font-weight:400}
.brief-cursor{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;vertical-align:text-top;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

.brief-side{display:flex;flex-direction:column;gap:14px}
.brief-side-h{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px}
.acct{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:18px 20px;border:1px solid var(--line-2);border-radius:14px;
  background:var(--panel);
  transition:border-color .2s, transform .2s;
}
.acct:hover{border-color:var(--line-3);transform:translateX(2px)}
.acct-l{display:flex;flex-direction:column;gap:2px}
.acct-bank{font-size:14px;color:var(--ink);font-weight:500;letter-spacing:-.005em}
.acct-name{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.acct-bal{font-family:var(--serif);font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.acct-bal.neg{color:var(--red)}

.networth-num{font-family:var(--serif);font-size:clamp(40px,5vw,56px);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:6px}
.networth-delta{font-family:var(--mono);font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.14em;margin-bottom:20px}

.ask-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:48px}
@media(max-width:980px){.ask-grid{grid-template-columns:1fr}}
.ask-q{display:flex;flex-direction:column;gap:10px}
.ask-q-h{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px}
.qbtn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  text-align:left;
  padding:18px 20px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line-2);
  color:var(--ink-2);font-size:15px;letter-spacing:-.005em;
  transition:border-color .2s,transform .2s,background .2s;
  font-family:var(--sans);font-weight:400;
}
.qbtn::after{content:"→";color:var(--dim);font-size:18px;transition:transform .2s,color .2s}
.qbtn:hover{border-color:var(--line-3);transform:translateX(2px)}
.qbtn:hover::after{color:var(--accent);transform:translateX(3px)}
.qbtn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.qbtn.active::after{color:var(--accent)}

.ask-a{
  border:1px solid var(--line-2);border-radius:18px;
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg-2) 100%);
  padding:36px;position:relative;min-height:340px;
  display:flex;flex-direction:column;
}
.ask-a::before{
  content:"";position:absolute;left:24px;right:24px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.ask-a-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.ask-a-l{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.16em}
.ask-a-body{
  font-family:var(--serif);font-size:clamp(19px,2vw,24px);
  line-height:1.4;color:var(--ink-2);letter-spacing:-.005em;
  flex:1;
}
.ask-a-body strong{font-weight:400;font-style:italic;color:var(--accent-hi)}
.ask-a-empty{color:var(--dim);font-style:italic}

.health-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center}
@media(max-width:980px){.health-grid{grid-template-columns:1fr}}
.health-num{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(120px,18vw,220px);
  line-height:.9;letter-spacing:-.04em;
  color:var(--ink);font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;
}
.health-num small{font-size:.32em;color:var(--muted);font-family:var(--mono);font-weight:400;margin-left:8px}
.health-cap{
  font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--muted);
  max-width:380px;margin-top:18px;
}
.health-cap em{color:var(--accent-hi);font-style:normal;font-weight:500}

.bars{display:flex;flex-direction:column;gap:22px}
.bar{display:flex;flex-direction:column;gap:8px}
.bar-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.bar-name{color:var(--ink-2);letter-spacing:-.005em}

function useInView(threshold=.3) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !seen) { setSeen(true); io.unobserve(el); }
    }, { threshold });
    io.observe(el);
    return () => io.disconnect();
  }, [seen, threshold]);
  return [ref, seen];
}

function useCounter(target, duration=1800) {
  const [val, setVal] = useState(0);
  const fired = useRef(false);
  const trigger = useCallback(() => {
    if (fired.current) return;
    fired.current = true;
    const t0 = performance.now();
    const tick = now => {
      const p = Math.min((now - t0) / duration, 1);
      const e = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(e * target));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [target, duration]);
  return [val, trigger];
}

function useWordStream() {
  const [text, setText] = useState('');
  const [done, setDone] = useState(false);
  const timer = useRef(null);
  const stream = useCallback((full, delay=42) => {
    clearInterval(timer.current);
    setText(''); setDone(false);
    const words = full.split(' ');
    let i = 0;
    timer.current = setInterval(() => {
      if (i < words.length) {
        const w = words[i]; i++;
        setText(p => p ? p + ' ' + w : w);
      } else { clearInterval(timer.current); setDone(true); }
    }, delay);
  }, []);
  useEffect(() => () => clearInterval(timer.current), []);
  return { text, done, stream };
}

  const [ref, seen] = useInView(.3);

  }, [seen, triggerScore]);

  return (
    <section className="section shell" ref={ref}>
      <div className="section-head reveal in">
        <div>
          <div className="section-num">§ 04 · Financial Health</div>
          <h2 className="section-title">Your money, <em>diagnosed.</em></h2>

      <div className="health-grid">
        <div>
          <div className="health-num">{score}<small>/ 100</small></div>
          <div className="health-cap">
            Stronger than 78% of users your age. Fix <em>spending consistency</em> and your score jumps to 88.
          </div>
        </div>
        <div className="bars">
          {HEALTH.map((h, i) => (
            <div key={i} className={`bar ${h.kind === 'weak' ? 'weak' : ''}`}>
              <div className="bar-h">
                <span className="bar-name">{h.name}</span>
                <span className="bar-score">{h.score} / {h.max}</span>
              </div>
              <div className="bar-track">
                <div className={`bar-fill ${h.kind}`} style={{width: animated ? `${(h.score / h.max) * 100}%` : 0, transitionDelay: `${i * 120}ms`}}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
};
