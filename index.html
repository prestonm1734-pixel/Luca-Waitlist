<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — The autonomous financial agent.</title>
  <meta name="description" content="Luca watches every dollar 24/7. Finds problems before you know they exist. Delivers ready-to-execute solutions. You just tap approve.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%232D2A6E'><rect x='46' y='14' width='8' height='8' rx='1.5'/><rect x='78' y='46' width='8' height='8' rx='1.5'/><rect x='46' y='78' width='8' height='8' rx='1.5'/><rect x='14' y='46' width='8' height='8' rx='1.5'/><rect x='69' y='23' width='8' height='8' rx='1.5' transform='rotate(45 73 27)'/><rect x='69' y='69' width='8' height='8' rx='1.5' transform='rotate(45 73 73)'/><rect x='23' y='69' width='8' height='8' rx='1.5' transform='rotate(45 27 73)'/><rect x='23' y='23' width='8' height='8' rx='1.5' transform='rotate(45 27 27)'/><circle cx='50' cy='50' r='17'/><circle cx='50' cy='50' r='11' fill='%23FFFFFF'/><circle cx='50' cy='50' r='6'/><circle cx='50' cy='50' r='2.2' fill='%23FFFFFF'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
:root{
  --paper:#FFFFFF;
  --cream:#F8F5EE;
  --bg-dark:#0B0B0E;
  --bg-dark-2:#15151A;

  --ink:#0E0E12;
  --ink-2:#26252A;
  --muted:#6B6862;
  --muted-2:#9A968D;
  --dim:#B8B3A7;

  --ink-on-dark:#F5F1E8;
  --muted-on-dark:#A19D92;
  --dim-on-dark:#5C594F;

  --line:#E5E1D5;
  --line-2:#D5D0C2;
  --line-dark:#26252A;
  --line-dark-2:#3A3833;

  --accent:#2D2A6E;
  --accent-hi:#7B86E8;
  --accent-soft:rgba(45,42,110,.05);

  --green:#3F7A52;
  --red:#9C3A2E;

  --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Fraunces","Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;

  --pad:clamp(28px,6vw,112px);
  --max:1180px;

  --shadow-sm:0 1px 2px rgba(20,18,12,.04), 0 1px 3px rgba(20,18,12,.03);
  --shadow:0 1px 2px rgba(20,18,12,.04), 0 8px 24px rgba(20,18,12,.05);
  --shadow-lg:0 1px 2px rgba(20,18,12,.04), 0 24px 60px -12px rgba(20,18,12,.10), 0 8px 24px rgba(20,18,12,.04);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
html{scroll-behavior:smooth}
body{min-height:100vh;overflow-x:hidden}
::selection{background:var(--accent);color:#fff}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:0;color:inherit}
input{font-family:inherit}

.shell{position:relative;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

/* ─── theme blocks ─── */
.theme-light{background:var(--paper);color:var(--ink)}
.theme-cream{background:var(--cream);color:var(--ink)}
.theme-dark{background:var(--bg-dark);color:var(--ink-on-dark)}

/* ─── topbar ─── */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);background:rgba(11,11,14,.65);border-bottom:1px solid rgba(255,255,255,.06);color:var(--ink-on-dark);transition:background .3s,color .3s,border-color .3s}
.topbar.is-light{background:rgba(255,255,255,.78);color:var(--ink);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:11px;font-weight:500;font-size:16px;letter-spacing:-.012em}
.brand-name{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.nav{display:flex;align-items:center;gap:36px}
.nav-link{font-size:13.5px;color:var(--muted-on-dark);transition:color .2s;letter-spacing:-.005em}
.topbar.is-light .nav-link{color:var(--muted)}
.nav-link:hover{color:var(--ink-on-dark)}
.topbar.is-light .nav-link:hover{color:var(--ink)}
.topbar-cta{font-size:13.5px;padding:10px 18px;border-radius:100px;background:var(--paper);color:var(--ink);font-weight:500;letter-spacing:-.005em;transition:transform .2s,background .2s}
.topbar-cta:hover{transform:translateY(-1px);background:#fff}
@media(max-width:760px){.nav{display:none}}

/* ─── HERO (dark) ─── */
.hero{
  position:relative;
  background:
    radial-gradient(800px 600px at 80% 30%, rgba(123,134,232,.10), transparent 60%),
    radial-gradient(700px 500px at 10% 80%, rgba(212,182,106,.08), transparent 60%),
    linear-gradient(180deg, #0B0B0E 0%, #0E0E14 100%);
  color:var(--ink-on-dark);
  padding:clamp(80px,12vw,160px) 0 clamp(80px,12vw,160px);
  overflow:hidden;
  border-bottom:1px solid var(--line-dark);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.5'/></svg>");
  opacity:.06;mix-blend-mode:overlay;
}
.hero-inner{position:relative;z-index:1;max-width:920px}

.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted-on-dark);text-transform:uppercase;letter-spacing:.14em;margin-bottom:56px}
.eyebrow::before{content:"";width:24px;height:1px;background:rgba(255,255,255,.18)}

.hero-title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(54px,9vw,128px);
  line-height:.94;letter-spacing:-.028em;
  color:var(--ink-on-dark);margin:0 0 40px;
  font-variation-settings:"opsz" 144,"SOFT" 50;
  max-width:14ch;
}
.hero-title em{font-style:italic;font-weight:400;color:var(--accent-hi)}
.hero-title .word{display:inline-block;opacity:0;transform:translateY(28px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.hero-title .word:nth-child(1){animation-delay:.06s}
.hero-title .word:nth-child(2){animation-delay:.14s}
.hero-title .word:nth-child(3){animation-delay:.22s}
.hero-title .word:nth-child(4){animation-delay:.30s}
.hero-title .word:nth-child(5){animation-delay:.38s}
.hero-title .word:nth-child(6){animation-delay:.46s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

.hero-sub{
  font-family:var(--sans);font-weight:400;
  font-size:clamp(17px,1.7vw,20px);line-height:1.55;
  color:var(--muted-on-dark);max-width:56ch;margin:0 0 48px;
  letter-spacing:-.008em;
  opacity:0;animation:rise 1s .56s cubic-bezier(.2,.7,.2,1) forwards;
}

.hero-form{
  display:flex;align-items:center;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.10);border-radius:100px;
  padding:7px;max-width:520px;
  transition:border-color .25s,box-shadow .25s,background .25s;
  opacity:0;animation:rise 1s .72s cubic-bezier(.2,.7,.2,1) forwards;
  backdrop-filter:blur(8px);
}
.hero-form:focus-within{border-color:var(--accent-hi);background:rgba(255,255,255,.06);box-shadow:0 0 0 4px rgba(123,134,232,.12)}
.hero-form input{flex:1;background:0;border:0;outline:0;font-size:15.5px;color:var(--ink-on-dark);padding:14px 22px;letter-spacing:-.008em}
.hero-form input::placeholder{color:var(--dim-on-dark)}
.hero-form button{background:var(--paper);color:var(--ink);font-weight:500;font-size:14.5px;padding:14px 26px;border-radius:100px;letter-spacing:-.005em;transition:transform .2s,background .2s}
.hero-form button:hover{background:#fff;transform:translateY(-1px)}
.hero-form button:disabled{opacity:.5;cursor:wait}
.hero-form.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.hero-micro{display:flex;flex-wrap:wrap;gap:24px;margin-top:24px;font-family:var(--mono);font-size:11.5px;color:var(--dim-on-dark);text-transform:uppercase;letter-spacing:.12em;opacity:0;animation:rise 1s .88s cubic-bezier(.2,.7,.2,1) forwards}
.hero-micro span{display:flex;align-items:center;gap:8px}
.hero-micro span::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--dim-on-dark)}

.hero-ok{font-family:var(--serif);font-style:italic;color:var(--accent-hi);font-size:22px;padding:18px 6px;font-variation-settings:"opsz" 144}
.hero-err{color:#E07C6E;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;padding:12px 6px 0}

/* ─── section frame ─── */
.section{padding:clamp(96px,16vw,200px) 0}
.section + .section{border-top:1px solid var(--line)}
.theme-dark + .theme-dark, .theme-dark.section{border-top-color:var(--line-dark)}

/* ─── Statement (sans split) ─── */
.statement{
  font-family:var(--sans);font-weight:500;
  font-size:clamp(36px,5.2vw,68px);
  line-height:1.08;letter-spacing:-.022em;
  margin:0;max-width:18ch;
}
.statement .fade{color:var(--muted-2)}
.statement .dark-fade{color:#5A5852}

/* ─── Capabilities cycle (Harvey-style list) ─── */
.cap-eyebrow{font-family:var(--sans);font-size:clamp(20px,2.4vw,28px);font-weight:500;color:var(--ink);letter-spacing:-.012em;margin-bottom:48px;max-width:30ch}
.cap-list{display:flex;flex-direction:column;gap:clamp(8px,1.5vw,18px);margin-bottom:64px}
.cap-item{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(40px,6.4vw,84px);
  line-height:1.08;letter-spacing:-.022em;
  color:#D8D4C7;
  transition:color .5s ease;
  cursor:default;font-variation-settings:"opsz" 144;
}
.cap-item.active{color:var(--ink)}
.cap-cta{display:inline-block;font-size:14.5px;padding:14px 24px;border:1px solid var(--line-2);border-radius:100px;color:var(--ink);background:var(--paper);box-shadow:var(--shadow-sm);transition:transform .2s,border-color .2s,box-shadow .2s;letter-spacing:-.005em;font-weight:500}
.cap-cta:hover{transform:translateY(-1px);border-color:var(--line-3);box-shadow:var(--shadow)}

/* ─── Section heads ─── */
.section-head{margin-bottom:clamp(56px,7vw,96px);max-width:880px}
.section-num{font-family:var(--mono);font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.16em;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.section-num::before{content:"";width:18px;height:1px;background:var(--accent);opacity:.4}
.theme-dark .section-num{color:var(--accent-hi)}
.theme-dark .section-num::before{background:var(--accent-hi);opacity:.4}
.section-title{font-family:var(--sans);font-weight:500;font-size:clamp(36px,5.2vw,64px);line-height:1.06;letter-spacing:-.022em;margin:0 0 24px;color:var(--ink)}
.section-title em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);font-variation-settings:"opsz" 144}
.theme-dark .section-title{color:var(--ink-on-dark)}
.theme-dark .section-title em{color:var(--accent-hi)}
.section-sub{font-size:clamp(16px,1.6vw,18px);line-height:1.55;color:var(--muted);max-width:62ch;margin:0;letter-spacing:-.008em}
.theme-dark .section-sub{color:var(--muted-on-dark)}

/* ─── Live agent panel ─── */
.agent{background:var(--paper);border:1px solid var(--line-2);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden}
.agent-head{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FBFAF4 0%,var(--paper) 100%)}
.agent-head-l{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.12em}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(63,122,82,.45);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,122,82,.45)}70%{box-shadow:0 0 0 8px rgba(63,122,82,0)}100%{box-shadow:0 0 0 0 rgba(63,122,82,0)}}
.agent-head-r{display:flex;gap:28px;font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.agent-head-r b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
@media(max-width:680px){.agent-head{flex-direction:column;align-items:flex-start;gap:14px;padding:20px 22px}.agent-head-r{gap:18px;font-size:11px}}

.feed-row{display:grid;grid-template-columns:96px 1fr auto;gap:28px;align-items:center;padding:22px 28px;border-bottom:1px solid var(--line);transition:background .2s;opacity:0;transform:translateY(8px)}
.feed-row.in{opacity:1;transform:translateY(0);transition:opacity .6s,transform .6s,background .2s}
.feed-row:last-child{border-bottom:0}
.feed-row:hover{background:#FBFAF4}
@media(max-width:760px){.feed-row{grid-template-columns:1fr;gap:12px;padding:22px}}
.feed-time{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.feed-text{font-size:15.5px;line-height:1.5;color:var(--ink-2);letter-spacing:-.008em}
.feed-text strong{color:var(--ink);font-weight:500}
.feed-text .save{color:var(--green);font-weight:500;font-variant-numeric:tabular-nums}
.feed-text .loss{color:var(--red);font-weight:500;font-variant-numeric:tabular-nums}
.feed-btn{font-size:13.5px;font-weight:500;padding:10px 20px;border-radius:100px;background:var(--ink);color:var(--paper);letter-spacing:-.005em;transition:transform .2s,background .2s;white-space:nowrap;border:1px solid var(--ink)}
.feed-btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.feed-btn.done{background:transparent;color:var(--green);border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:8px;cursor:default;pointer-events:none}
.feed-btn.done::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}
@media(max-width:760px){.feed-btn{justify-self:start}}

/* ─── Morning brief ─── */
.brief-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(32px,5vw,72px);align-items:start}
@media(max-width:980px){.brief-grid{grid-template-columns:1fr;gap:40px}}
.brief-panel{background:var(--paper);border:1px solid var(--line-2);border-radius:24px;padding:clamp(28px,4vw,48px);box-shadow:var(--shadow-lg);min-height:300px;position:relative}
.brief-h{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.brief-h-icon{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.brief-h-l{font-family:var(--mono);font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.14em}
.brief-h-r{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-left:auto}
.brief-text{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.6vw,30px);line-height:1.36;color:var(--ink);letter-spacing:-.012em;min-height:180px;font-variation-settings:"opsz" 144}
.brief-text strong{font-style:italic;color:var(--accent);font-weight:500}
.brief-cursor{display:inline-block;width:2px;height:.95em;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

.brief-side{display:flex;flex-direction:column;gap:14px}
.brief-side-h{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px}
.networth-num{font-family:var(--serif);font-size:clamp(44px,5.4vw,60px);letter-spacing:-.022em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:8px;font-variation-settings:"opsz" 144}
.networth-delta{font-family:var(--mono);font-size:11.5px;color:var(--green);text-transform:uppercase;letter-spacing:.12em;margin-bottom:24px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s,border-color .25s}
.acct:hover{transform:translateX(3px);box-shadow:var(--shadow);border-color:var(--line-2)}
.acct-bank{font-size:14.5px;color:var(--ink);font-weight:500;letter-spacing:-.008em}
.acct-name{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.acct-bal{font-family:var(--serif);font-size:22px;letter-spacing:-.014em;font-variant-numeric:tabular-nums;color:var(--ink)}
.acct-bal.neg{color:var(--red)}

/* ─── Ask Luca ─── */
.ask-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(28px,4vw,56px)}
@media(max-width:980px){.ask-grid{grid-template-columns:1fr}}
.ask-q-h{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:14px}
.qbtn{display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;width:100%;padding:20px 22px;border-radius:14px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);font-size:15.5px;letter-spacing:-.008em;box-shadow:var(--shadow-sm);margin-bottom:12px;transition:transform .25s,box-shadow .25s,border-color .25s,background .25s;font-family:var(--sans);font-weight:400}
.qbtn::after{content:"→";color:var(--dim);font-size:18px;transition:transform .25s,color .25s}
.qbtn:hover{transform:translateX(3px);box-shadow:var(--shadow);border-color:var(--line-2)}
.qbtn:hover::after{color:var(--accent);transform:translateX(3px)}
.qbtn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.qbtn.active::after{color:var(--accent)}
.ask-a{background:var(--paper);border:1px solid var(--line-2);border-radius:24px;padding:clamp(28px,4vw,48px);box-shadow:var(--shadow-lg);min-height:360px;display:flex;flex-direction:column}
.ask-a-head{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.ask-a-l{font-family:var(--mono);font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.14em}
.ask-a-body{font-family:var(--serif);font-size:clamp(20px,2vw,25px);line-height:1.42;color:var(--ink);letter-spacing:-.012em;flex:1;font-variation-settings:"opsz" 144}
.ask-a-empty{color:var(--dim);font-style:italic}

/* ─── Stats (DARK Harvey-style) ─── */
.stats-title{font-family:var(--sans);font-weight:500;font-size:clamp(36px,5.2vw,64px);line-height:1.06;letter-spacing:-.022em;margin:0 0 clamp(48px,8vw,96px);max-width:18ch;color:var(--ink-on-dark)}
.stat-list{display:flex;flex-direction:column}
.stat{display:flex;flex-direction:column;gap:clamp(20px,3vw,36px);padding:clamp(36px,5vw,56px) 0;border-top:1px solid var(--line-dark-2)}
.stat:last-child{border-bottom:1px solid var(--line-dark-2)}
.stat-label{font-size:clamp(15px,1.5vw,17px);color:var(--ink-on-dark);font-weight:400;letter-spacing:-.005em}
.stat-num{font-family:var(--serif);font-weight:400;font-size:clamp(56px,9vw,108px);line-height:.95;letter-spacing:-.028em;color:var(--ink-on-dark);font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 144}

/* ─── Pricing (CREAM) ─── */
.price-wrap{display:flex;justify-content:center}
.price-card{width:100%;max-width:540px;background:var(--paper);border:1px solid var(--line-2);border-radius:28px;padding:clamp(36px,5vw,56px);box-shadow:var(--shadow-lg);position:relative}
.price-tag{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.16em;padding:5px 12px;border:1px solid var(--line-2);border-radius:100px;background:var(--accent-soft)}

function useReveal(){
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting){ el.classList.add('in'); io.unobserve(el); }
    }, { threshold:.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function useInView(threshold=.3){
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !seen){ setSeen(true); io.unobserve(el); }
    }, { threshold });
    io.observe(el);
    return () => io.disconnect();
  }, [seen, threshold]);
  return [ref, seen];
}

function useCounter(target, duration=1800){
  const [val, setVal] = useState(0);
  const fired = useRef(false);
  const trigger = useCallback(() => {
    if (fired.current) return;
    fired.current = true;
    const t0 = performance.now();
    const tick = now => {
      const p = Math.min((now - t0) / duration, 1);
      const e = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(e * target));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [target, duration]);
  return [val, trigger];
}

function useWordStream(){
  const [text, setText] = useState('');
  const [done, setDone] = useState(false);
  const timer = useRef(null);
  const stream = useCallback((full, delay=48) => {
    clearInterval(timer.current);
    setText(''); setDone(false);
    const words = full.split(' ');
    let i = 0;
    timer.current = setInterval(() => {
      if (i < words.length){
        const w = words[i]; i++;
        setText(p => p ? p + ' ' + w : w);
      } else { clearInterval(timer.current); setDone(true); }
    }, delay);
  }, []);
  useEffect(() => () => clearInterval(timer.current), []);
  return { text, done, stream };
}
