/* ── Design tokens ── */
:root {
  --bg:          #08080D;
  --bg-2:        #0D0D18;
  --bg-card:     #101020;
  --purple:      #5563A8;
  --purple-dim:  rgba(85,99,168,0.12);

  --muted:       rgba(255,255,255,0.42);

  --border:      rgba(255,255,255,0.065);
  --border-2:    rgba(255,255,255,0.11);
  --green:       #3A9E68;
  --red:         #D97070;

  --sans:  "Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:  "Geist Mono",ui-monospace,"SF Mono",monospace;
  --serif: "Instrument Serif","Times New Roman",serif;
  --maxw:  1120px;
  --pad:   clamp(20px, 5vw, 64px);

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--sans);

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }
::selection { background: var(--purple); color: white; }

/* ── Layout ── */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }

/* ── Nav ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(8,8,13,0.75);
  backdrop-filter: blur(20px) saturate(1.4);

.nav-cta:hover { opacity: 0.82; transform: translateY(-1px); }
.nav-cta:active { transform: scale(0.97); }

  padding: 120px 0 80px;

  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
/* Ambient glow */
.hero::before {
  content: "";
  position: absolute; pointer-events: none;
  top: -10%; left: -5%;
  width: 70vw; height: 70vw;
  max-width: 900px; max-height: 900px;
  background: radial-gradient(circle, rgba(85,99,168,0.09) 0%, transparent 65%);
}
.hero::after {
  content: "";
  position: absolute; pointer-events: none;
  bottom: -20%; right: -10%;
  width: 50vw; height: 50vw;
  max-width: 600px; max-height: 600px;
  background: radial-gradient(circle, rgba(85,99,168,0.05) 0%, transparent 70%);
}

.hero-label {
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--purple-text);
  display: inline-flex; align-items: center; gap: 10px;

}
.hero-label::before {

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

.hero h1 {

          <rect x="69" y="23" width="8" height="8" rx="1.5" transform="rotate(45 73 27)"/>
          <rect x="69" y="69" width="8" height="8" rx="1.5" transform="rotate(45 73 73)"/>
          <rect x="23" y="69" width="8" height="8" rx="1.5" transform="rotate(45 27 73)"/>

  <!-- EmailForm -->
  <script type="text/babel">
    const EmailForm = ({ source }) => {
      const [email, setEmail]       = React.useState("");
      const [done, setDone]         = React.useState(false);
      const [loading, setLoading]   = React.useState(false);
      const [error, setError]       = React.useState("");

      const submit = async (e) => {
        e.preventDefault();
        if (!email.includes("@")) return;
        setLoading(true); setError("");
        try {
          const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
          const { error: err } = await sb.from("waitlist").insert([{ email, source: source || "landing" }]);
          if (err && err.code !== "23505") setError("Something went wrong. Try again.");
          else setDone(true);
        } catch (_) { setError("Something went wrong. Try again."); }
        finally { setLoading(false); }
      };

      if (done) return (
        <div>
          <div className="form-thanks">You're on the list.</div>
          <div className="form-note" style={{marginTop:12}}>Check {email} — first wave opens soon.</div>
        </div>
      );

      return (
        <form onSubmit={submit}>
          <div className="form-row">
            <input type="email" placeholder="you@email.com" value={email}
              onChange={e => setEmail(e.target.value)} required disabled={loading}/>
            <button type="submit" className="form-btn" disabled={loading}>
              {loading ? "Joining…" : "Join waitlist"}
            </button>
          </div>
          {error && <div className="form-error">{error}</div>}
          <div className="form-note">Free · no credit card · cancel anytime</div>
        </form>
      );
    };
    window.EmailForm = EmailForm;
  </script>

  <!-- ChatDemo -->
  <script type="text/babel">
    const SG = [
      "Can I afford a house in 3 years?",
      "Am I saving enough for retirement?",
      "Where should I move the $32k in my checking?",
      "Should I pay off my student loans faster?",
    ];
    const CANNED = {
      [SG[0]]: "On a $650k place with 20% down, you need **$160k** for the down payment plus closing. At your current $1,170/mo savings rate you'll get there with about $4k to spare — but the $32k sitting in your Chase checking is dragging on returns. Move $24k of it into your Ally HYSA earning 4.2% and you'll add **$1,008/yr** without changing your spending. You're closer than you think, Maya.",
      [SG[1]]:  "At 29 with **$84,200** in your 401k and **$19,400** in the Roth, you're ahead of ~78% of your peers. But your 8% contribution is leaving free money on the table — Fidelity's full match runs to 12%. Bump to 10% and you'll add roughly **$280/mo** in matched dollars. Separately, your Roth is **$3,200** short of the 2026 limit. Auto-deposit $78/wk for 41 weeks and we close it before December.",
      [SG[2]]:  "Most of it shouldn't be there. Keep **$8,400** in Chase (one month's spend × 2 — your real emergency buffer). The other **$24,000** belongs in your Ally HYSA at 4.2% — that's **$1,008/yr** in interest you're not getting right now. Do it before Friday's paycheck hits and you'll have one clean month of cash flow to read.",
      [SG[3]]:  "Probably not. Your loans are at **4.5%** — your Ally HYSA pays **4.2%**. The math is almost identical. Meanwhile your Roth IRA averages **8–9%** long-term, and it's tax-free. Keep the $312/mo minimum, max the Roth first ($3,200 to go this year), and only attack the loans if rates change. Money isn't only math.",
    };
    const FALLBACK = "In this preview I can answer the four sample questions using **Maya's** real profile. To see Luca reason about *your* numbers, join the waitlist.";
    const INIT = { role:"luca", text:"Morning, Maya. I just looked at your accounts — your **net worth is $126,260**, up $1,840 this month. Your checking balance is high again. What's on your mind?" };

    const bold = (text) => text.split(/(\*\*[^*]+\*\*)/g).map((p,i) =>
      p.startsWith("**") && p.endsWith("**")
        ? <strong key={i}>{p.slice(2,-2)}</strong>
        : <React.Fragment key={i}>{p}</React.Fragment>
    );

    const ChatDemo = () => {
      const [msgs, setMsgs]   = React.useState([INIT]);
      const [input, setInput] = React.useState("");
      const [busy, setBusy]   = React.useState(false);
      const [used, setUsed]   = React.useState([]);
      const ref = React.useRef(null);

      React.useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [msgs, busy]);

      const ask = async (q) => {
        if (!q.trim() || busy) return;
        setMsgs(p => [...p, { role:"user", text:q }]);
        setInput(""); setBusy(true);
        await new Promise(r => setTimeout(r, 650 + Math.random() * 650));
        setMsgs(p => [...p, { role:"luca", text: CANNED[q] || FALLBACK }]);
        setBusy(false);
      };

      const reset = () => { setMsgs([INIT]); setUsed([]); setInput(""); };

      return (
        <div className="demo">
          <div className="demo-chat">
            <div className="demo-head">
              <div className="demo-head-title">
                <span className="demo-head-dot"/>
                <span className="demo-head-full">luca.live — connected to Maya's accounts</span>
                <span className="demo-head-short">luca.live · Maya</span>
              </div>
              <button className="demo-reset" onClick={reset}>↺ reset</button>
            </div>
            <div className="demo-scroll" ref={ref}>
              {msgs.map((m,i) => (
                <div key={i} className={`msg ${m.role}`}>
                  <div className="msg-av">{m.role==="luca"?"L":"M"}</div>
                  <div className="msg-b">{bold(m.text)}</div>
                </div>
              ))}
              {busy && (
                <div className="msg luca">
                  <div className="msg-av">L</div>
                  <div className="msg-b"><div className="typing"><span/><span/><span/></div></div>
                </div>
              )}
            </div>
            <div className="demo-input-wrap">
              <div className="suggest-row">
                {SG.map(s => (
                  <button key={s} className="suggest-chip"
                    disabled={busy || used.includes(s)}
                    onClick={() => { setUsed(p=>[...p,s]); ask(s); }}>{s}</button>
                ))}
              </div>
              <form className="demo-input" onSubmit={e=>{e.preventDefault();ask(input);}}>
                <input type="text" placeholder="Try one of the questions above…"
                  value={input} onChange={e=>setInput(e.target.value)} disabled={busy}/>
                <button type="submit" className="demo-send" disabled={busy||!input.trim()} aria-label="Send">
                  <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                    <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </button>
              </form>
            </div>
          </div>
          <aside className="demo-profile">
            <div>
              <h4>Sample profile</h4>
              <div className="p-name">Maya, 29 · NYC</div>
              <div className="p-note">Real numbers via Plaid. Read-only.</div>
            </div>
            <div className="p-grid">
              {[["Net worth","$126,260"],["Checking","$32,400"],["HYSA · 4.2%","$8,100"],["401k","$84,200"],["Roth IRA","$19,400"],["Student loans","−$18,000"],["Saves / mo","$1,170"]].map(([k,v])=>(
                <div key={k} className="p-row"><span>{k}</span><b>{v}</b></div>
              ))}
            </div>
          </aside>
        </div>
      );
    };
    window.ChatDemo = ChatDemo;
  </script>

  <!-- App -->
  <script type="text/babel">
    const useReveal = () => {
      React.useEffect(() => {
        const io = new IntersectionObserver(
          entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }),
          { threshold: 0.08 }
        );
        document.querySelectorAll("[data-reveal]").forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    };

    const Nav = () => (
      <header className="nav">
        <div className="wrap nav-inner">
          <a href="#top" className="nav-brand">
            <LucaMark size={24}/>
            <span className="nav-word">Luca</span>
          </a>
          <a href="#waitlist" className="nav-cta">Join waitlist</a>
        </div>
      </header>
    );

    const Hero = () => (
      <section className="hero" id="top">
        <div className="wrap" style={{position:"relative"}}>
          <div className="hero-label">Coming summer 2026</div>
          <h1 className="hero h1">
            Your <span className="num">$32,400</span> in checking<br/>
            is costing you <span className="num">$1,400</span> a <span className="ital">year.</span>
          </h1>
          <p className="hero-sub">
            Luca connects to your real accounts and tells you exactly what to do with your money — every morning, in plain English.
          </p>
          <EmailForm source="hero"/>
          <div className="claude-pill">
            <span className="dot"/>
            Powered by Claude · the most advanced reasoning AI
          </div>
        </div>
        <div className="scroll-hint">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          Scroll
        </div>
      </section>
    );

    const ChatSection = () => (
      <section className="section chat-section">
        <div className="wrap">
          <div className="s-label">Talk to your money</div>
          <ChatDemo/>
        </div>
      </section>
    );

    const MOMENTS = [
      {
        tag: "Spending",
        stat: <>You spent <span className="num">$1,240</span> on dining last month. That's <span className="bad">34%</span> of your take-home.</>,
        insight: "Luca flagged it on the 9th. You still had 3 weeks left in the month.",
      },
      {
        tag: "Debt",
        stat: <>Your student loan at <span className="bad">6.8%</span> is costing you <span className="num">$94</span> a month in interest alone.</>,
        insight: "At your current pace you pay it off in 2031. Luca has a faster path.",
      },
      {
        tag: "Goals",
        stat: <>At your savings rate you hit your house goal in <span className="bad">2031.</span> Not <span className="num">2028.</span></>,
        insight: "One move — $24k from checking to HYSA — closes 14 months of that gap.",
      },
    ];

    const MomentsSection = () => (
      <section className="section">
        <div className="wrap">
          <div className="s-label">What Luca sees</div>
          <div className="moments-grid">
            {MOMENTS.map((m,i) => (
              <div key={i} className="m-card reveal" data-reveal style={{transitionDelay:`${i*80}ms`}}>
                <div className="m-tag">{m.tag}</div>
                <p className="m-stat">{m.stat}</p>
                <div className="m-insight">{m.insight}</div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const PriceSection = () => (
      <section className="section price-section" id="waitlist">
        <div className="wrap">
          <div className="s-label">Pricing</div>
          <h2 className="price-headline">
            <span className="num">$14.99</span> a month.<br/>
            Less than one hour with a <span className="ital">financial advisor.</span>
          </h2>
          <p className="price-sub">Cancel anytime · no AUM fees · no surprises</p>
          <EmailForm source="pricing"/>
        </div>
      </section>
    );

    const Footer = () => (
      <footer className="footer">
        <div className="wrap footer-inner">
          <div className="footer-left">
            <LucaMark size={17}/>
            <span className="footer-fine">© 2026 Luca · Not a registered investment advisor.</span>
          </div>
          <div className="footer-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Disclaimer</a>
          </div>
        </div>
      </footer>
    );

    const StickyBar = () => {
      const [show, setShow] = React.useState(false);
      React.useEffect(() => {
        const fn = () => {
          const past       = window.scrollY > window.innerHeight * 0.5;
          const nearBottom = window.innerHeight + window.scrollY > document.body.offsetHeight - 500;
          setShow(past && !nearBottom);
        };
        window.addEventListener("scroll", fn, { passive:true });
        fn();
        return () => window.removeEventListener("scroll", fn);
      }, []);
      return (
        <a href="#waitlist" className={`sticky ${show ? "in" : ""}`}>
          <span>Join the waitlist — free</span>
          <span className="sticky-arrow">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
              <path d="M3 8h10M9 4l4 4-4 4" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </span>
        </a>
      );
    };

    const App = () => {
      useReveal();
      return (
        <>
          <Nav/>
          <main>
            <Hero/>
            <ChatSection/>
            <MomentsSection/>
            <PriceSection/>
          </main>
          <Footer/>
          <StickyBar/>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
