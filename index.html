<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — talk to your money.</title>
  <meta name="description" content="Your money, finally explained. Luca is the AI financial advisor that knows your real numbers.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23A8B4E8'><rect x='46' y='14' width='8' height='8' rx='1.5'/><rect x='78' y='46' width='8' height='8' rx='1.5'/><rect x='46' y='78' width='8' height='8' rx='1.5'/><rect x='14' y='46' width='8' height='8' rx='1.5'/><rect x='69' y='23' width='8' height='8' rx='1.5' transform='rotate(45 73 27)'/><rect x='69' y='69' width='8' height='8' rx='1.5' transform='rotate(45 73 73)'/><rect x='23' y='69' width='8' height='8' rx='1.5' transform='rotate(45 27 73)'/><rect x='23' y='23' width='8' height='8' rx='1.5' transform='rotate(45 27 27)'/><circle cx='50' cy='50' r='17'/><circle cx='50' cy='50' r='11' fill='%2308080D'/><circle cx='50' cy='50' r='6'/><circle cx='50' cy='50' r='2.2' fill='%2308080D'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:     #08080D;
  --ink:    #F5F5F7;
  --muted:  rgba(245,245,247,0.55);
  --dim:    rgba(245,245,247,0.28);
  --line:   rgba(255,255,255,0.08);
  --purple: #4F5A97;
  --accent: #A8B4E8;
  --sans:   "Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:  "Instrument Serif","Times New Roman",serif;
  --pad:    clamp(24px,6vw,80px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--purple);color:#fff}

/* ── Nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);
  background:rgba(8,8,13,0.78);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-word{font-size:15px;font-weight:600;letter-spacing:-0.025em;color:var(--ink)}
.nav-btn{
  font-size:13px;font-weight:500;color:var(--accent);
  transition:opacity .15s;
}
.nav-btn:hover{opacity:.7}

/* ── Sections ── */
section{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:140px var(--pad);
  min-height:100svh;
  position:relative;
}
section.short{min-height:auto;padding:120px var(--pad)}

/* ── Hero ── */
.hero-eyebrow{
  font-size:13px;font-weight:400;
  color:var(--accent);letter-spacing:0.01em;
  margin-bottom:28px;
  display:flex;align-items:center;gap:8px;
}
.hero-eyebrow-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  animation:blink 2.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

h1{
  font-size:clamp(52px,8.5vw,128px);
  font-weight:600;
  line-height:1.0;
  letter-spacing:-0.05em;
  margin-bottom:28px;
  max-width:14ch;
}
h1 em{
  font-family:var(--serif);
  font-style:italic;
  font-weight:400;
  letter-spacing:-0.03em;
}

.hero-sub{
  font-size:clamp(17px,1.8vw,22px);
  color:var(--muted);
  line-height:1.6;
  max-width:34ch;
  margin-bottom:52px;
  font-weight:400;
  letter-spacing:-0.01em;
}

/* ── Form ── */
.form-wrap{width:100%;max-width:380px}
.form-row{
  display:flex;align-items:center;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.13);
  border-radius:980px;
  padding:5px 5px 5px 22px;
  transition:border-color .2s,background .2s;
}
.form-row:focus-within{
  border-color:rgba(168,180,232,0.4);
  background:rgba(255,255,255,0.09);
}
.form-row input{
  flex:1;background:none;border:none;outline:none;
  font-size:15px;color:#fff;padding:11px 0;min-width:0;
  letter-spacing:-0.005em;
}
.form-row input::placeholder{color:rgba(255,255,255,0.25)}
.form-btn{
  background:#fff;color:#08080D;
  padding:11px 22px;border-radius:999px;
  font-size:13px;font-weight:600;
  white-space:nowrap;flex-shrink:0;
  transition:opacity .15s,transform .1s;
}
.form-btn:hover:not(:disabled){opacity:.85}
.form-btn:active{transform:scale(.98)}
.form-btn:disabled{opacity:.3;cursor:default}
.form-note{
  font-size:12px;color:var(--dim);
  margin-top:14px;letter-spacing:.01em;
}
.form-error{font-size:12px;color:#F87171;margin-top:10px}
.form-thanks{
  font-size:clamp(20px,2vw,26px);
  font-weight:500;letter-spacing:-0.03em;
  color:var(--accent);line-height:1.45;
}

/* ── Big section headlines ── */
h2{
  font-size:clamp(38px,6vw,90px);
  font-weight:600;
  line-height:1.02;
  letter-spacing:-0.048em;
  max-width:18ch;
}
h2 em{
  font-family:var(--serif);font-style:italic;
  font-weight:400;letter-spacing:-0.025em;
}
h2 .dim{color:var(--muted)}

.section-sub{
  font-size:clamp(16px,1.5vw,20px);
  color:var(--muted);
  max-width:36ch;
  line-height:1.65;
  margin-top:20px;
  letter-spacing:-0.008em;
}

/* ── Feature list (Apple-style underneath) ── */
.feat-list{
  margin-top:72px;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:0;
  border-top:1px solid var(--line);
  max-width:900px;width:100%;
  text-align:left;
}
@media(max-width:640px){.feat-list{grid-template-columns:1fr}}
.feat{
  padding:40px 36px 40px 0;
  border-right:1px solid var(--line);
}
.feat:last-child{border-right:none;padding-right:0;padding-left:36px}
.feat:nth-child(2){padding-left:36px}
@media(max-width:640px){
  .feat{border-right:none;border-bottom:1px solid var(--line);padding:36px 0}
  .feat:last-child{border-bottom:none}
  .feat,.feat:nth-child(2),.feat:last-child{padding-left:0;padding-right:0}
}
.feat-title{
  font-size:17px;font-weight:600;
  letter-spacing:-0.03em;margin-bottom:10px;
}
.feat-body{font-size:14px;color:var(--muted);line-height:1.65}

/* ── How section ── */
.how-items{
  margin-top:72px;
  display:flex;flex-direction:column;
  gap:0;
  max-width:680px;width:100%;
  text-align:left;
}
.how-item{
  display:flex;align-items:flex-start;gap:32px;
  padding:40px 0;
  border-bottom:1px solid var(--line);
}
.how-item:first-child{border-top:1px solid var(--line)}
.how-n{
  font-size:13px;color:var(--dim);
  font-weight:500;letter-spacing:0.02em;
  min-width:28px;margin-top:2px;
  flex-shrink:0;
}
.how-title{font-size:18px;font-weight:500;letter-spacing:-0.03em;margin-bottom:8px}
.how-body{font-size:14px;color:var(--muted);line-height:1.65}

/* ── Price ── */
.price-pair{
  margin-top:72px;
  display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  max-width:640px;width:100%;text-align:left;
}
@media(max-width:520px){.price-pair{grid-template-columns:1fr}}
.pc{background:var(--bg);padding:36px}
.pc.hi{background:#111116}
.pc-tier{
  font-size:11px;font-weight:500;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--dim);
  margin-bottom:18px;
}
.pc-price{
  font-size:48px;font-weight:600;letter-spacing:-0.05em;
  margin-bottom:4px;
}
.pc-price sup{font-size:22px;font-weight:500;vertical-align:top;margin-top:10px;display:inline-block}
.pc-per{font-size:14px;color:var(--muted)}
.pc-hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.pc-items{display:flex;flex-direction:column;gap:10px}
.pc-item{font-size:13.5px;color:var(--muted);display:flex;gap:12px;align-items:baseline}
.pc-item-check{color:var(--accent);flex-shrink:0;font-size:12px}

.price-cta{
  margin-top:72px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.price-cta-h{
  font-size:clamp(26px,3vw,40px);font-weight:600;
  letter-spacing:-0.04em;line-height:1.1;
  margin-bottom:36px;
}
.price-cta-h em{font-family:var(--serif);font-style:italic;font-weight:400}
.price-note{font-size:12px;color:var(--dim);margin-top:14px;letter-spacing:.01em}

/* ── Divider ── */
.div-line{border:none;border-top:1px solid var(--line)}

/* ── Footer ── */
footer{
  padding:48px var(--pad);
  border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:16px;
}
.foot-brand{display:flex;align-items:center;gap:9px}
.foot-word{font-size:14px;font-weight:600;letter-spacing:-0.025em}
.foot-copy{font-size:13px;color:var(--dim)}
.foot-links{display:flex;gap:22px}
.foot-link{font-size:13px;color:var(--muted);transition:color .15s}
.foot-link:hover{color:var(--ink)}

/* ── Sticky ── */
.sticky{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:200;transition:opacity .3s,transform .3s;
  pointer-events:all;
}
.sticky.hide{opacity:0;transform:translateX(-50%) translateY(12px);pointer-events:none}
.sticky-inner{
  display:flex;align-items:center;gap:14px;
  background:rgba(16,16,22,0.9);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;
  padding:8px 8px 8px 24px;
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
}
.sticky-text{font-size:13px;color:rgba(255,255,255,0.68);white-space:nowrap;letter-spacing:-0.01em}
.sticky-btn{
  background:#fff;color:#08080D;
  padding:10px 22px;border-radius:999px;
  font-size:13px;font-weight:600;
  transition:opacity .15s;white-space:nowrap;
}
.sticky-btn:hover{opacity:.85}

/* reveal */
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    window.SUPABASE_URL      = 'https://ioeqnfqparfunotdjosy.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_WgGtHiiEJJ-EJzYrG5jV7g_XlZnxTAJ';
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Mark = ({ size = 24 }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
    width={size} height={size} style={{display:"block",width:size,height:size,flexShrink:0}}>
    <g fill="#A8B4E8">
      <rect x="46" y="14" width="8" height="8" rx="1.5"/>
      <rect x="78" y="46" width="8" height="8" rx="1.5"/>
      <rect x="46" y="78" width="8" height="8" rx="1.5"/>
      <rect x="14" y="46" width="8" height="8" rx="1.5"/>
      <rect x="69" y="23" width="8" height="8" rx="1.5" transform="rotate(45 73 27)"/>
      <rect x="69" y="69" width="8" height="8" rx="1.5" transform="rotate(45 73 73)"/>
      <rect x="23" y="69" width="8" height="8" rx="1.5" transform="rotate(45 27 73)"/>
      <rect x="23" y="23" width="8" height="8" rx="1.5" transform="rotate(45 27 27)"/>
      <circle cx="50" cy="50" r="17"/>
      <circle cx="50" cy="50" r="11" fill="#08080D"/>
      <circle cx="50" cy="50" r="6"/>
      <circle cx="50" cy="50" r="2.2" fill="#08080D"/>
    </g>
  </svg>
);

const Form = ({ source, btn = "Join waitlist", ph = "your@email.com" }) => {
  const [v, setV] = useState("");
  const [ok, setOk] = useState(false);
  const [ld, setLd] = useState(false);
  const [er, setEr] = useState("");
  const go = async e => {
    e.preventDefault();
    if (!v.includes("@")) { setEr("Enter a valid email."); return; }
    setLd(true); setEr("");
    try {
      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      const { error } = await sb.from("waitlist").insert([{ email: v, source: source || "landing" }]);
      if (error && error.code !== "23505") setEr("Something went wrong. Try again.");
      else setOk(true);
    } catch { setEr("Something went wrong. Try again."); }
    finally { setLd(false); }
  };
  if (ok) return <div className="form-thanks">You're on the list.<br/>We'll be in touch.</div>;
  return (
    <div className="form-wrap">
      <form className="form-row" onSubmit={go}>
        <input type="email" value={v} onChange={e=>{setV(e.target.value);setEr("")}} placeholder={ph} autoComplete="email"/>
        <button className="form-btn" type="submit" disabled={ld}>{ld ? "…" : btn}</button>
      </form>
      {er && <div className="form-error">{er}</div>}
      <div className="form-note">Free to join. No credit card.</div>
    </div>
  );
};

const useReveal = () => {
  const r = useRef(null);
  useEffect(() => {
    const el = r.current; if (!el) return;
    const o = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); o.unobserve(e.target); }});
    }, { threshold: 0.08 });
    o.observe(el); return () => o.disconnect();
  }, []);
  return r;
};

const App = () => {
  const [bar, setBar] = useState(false);
  const heroRef = useRef(null);
  const r1=useReveal(), r2=useReveal(), r3=useReveal(), r4=useReveal();

  useEffect(() => {
    const o = new IntersectionObserver(([e]) => setBar(!e.isIntersecting), { threshold: 0.15 });
    if (heroRef.current) o.observe(heroRef.current);
    return () => o.disconnect();
  }, []);

  return (<>
    {/* Nav */}
    <nav>
      <div className="brand"><Mark size={26}/><span className="brand-word">Luca</span></div>
      <a href="#waitlist" className="nav-btn">Join the waitlist</a>
    </nav>

    {/* Hero */}
    <section ref={heroRef}>
      <div className="hero-eyebrow"><span className="hero-eyebrow-dot"/>Early access open</div>
      <h1>
        Your money<br/>
        has a lot to<br/>
        <em>say.</em>
      </h1>
      <p className="hero-sub">
        Luca listens to your accounts<br/>and finally tells you the truth.
      </p>
      <Form source="hero" btn="Get early access" ph="your@email.com"/>
    </section>

    {/* Statement 1 */}
    <section className="short">
      <div className="rv" ref={r1}>
        <h2>Most people<br/>have <em className="dim">no idea</em><br/>where it goes.</h2>
        <p className="section-sub">
          Luca connects to every account you have and shows you exactly what's happening — without you having to figure it out.
        </p>
        <div className="feat-list">
          {[
            ["Ask anything","\"Can I afford this?\" \"Why is my balance low?\" \"What should I do with $500?\" Real answers, instantly."],
            ["Your real numbers","Not averages. Not estimates. Your actual spending, income, and savings — updated daily."],
            ["A clear next step","Luca doesn't just show data. It tells you what to do — and why."],
          ].map(([t,b]) => (
            <div key={t} className="feat">
              <div className="feat-title">{t}</div>
              <div className="feat-body">{b}</div>
            </div>
          ))}
        </div>
      </div>
    </section>

    {/* Statement 2 */}
    <section className="short">
      <div className="rv" ref={r2}>
        <h2>Simple as<br/>sending a<br/><em>text.</em></h2>
        <p className="section-sub">No spreadsheets. No learning curve. Just ask.</p>
        <div className="how-items">
          {[
            ["01","Connect your accounts","Link everything in 60 seconds via Plaid. Read-only access. Your data never moves."],
            ["02","Ask Luca anything","Type like you'd text a friend. Luca knows your full picture."],
            ["03","Get a real plan","Specific steps. Real numbers. No generic advice."],
          ].map(([n,t,b]) => (
            <div key={n} className="how-item">
              <div className="how-n">{n}</div>
              <div>
                <div className="how-title">{t}</div>
                <div className="how-body">{b}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>

    {/* Pricing */}
    <section className="short" id="waitlist">
      <div className="rv" ref={r3}>
        <h2>Simple<br/><em>pricing.</em></h2>
        <p className="section-sub">Start free. Upgrade when it clicks.</p>
        <div className="price-pair">
          <div className="pc">
            <div className="pc-tier">Free</div>
            <div className="pc-price"><sup>$</sup>0</div>
            <div className="pc-per">forever</div>
            <hr className="pc-hr"/>
            <div className="pc-items">
              {["1 bank account","Monthly snapshot","3 questions/month"].map(f=>(
                <div key={f} className="pc-item"><span className="pc-item-check">✓</span>{f}</div>
              ))}
            </div>
          </div>
          <div className="pc hi">
            <div className="pc-tier">Pro</div>
            <div className="pc-price"><sup>$</sup>14</div>
            <div className="pc-per">per month</div>
            <hr className="pc-hr"/>
            <div className="pc-items">
              {["Unlimited accounts","Unlimited questions","Goal tracking","Investment guidance","Priority support"].map(f=>(
                <div key={f} className="pc-item"><span className="pc-item-check">✓</span>{f}</div>
              ))}
            </div>
          </div>
        </div>
        <div className="price-cta">
          <div className="price-cta-h">Get <em>6 months free</em><br/>when we launch.</div>
          <Form source="price" btn="Claim your spot" ph="your@email.com"/>
          <div className="price-note">No credit card. No spam.</div>
        </div>
      </div>
    </section>

    {/* Footer */}
    <footer>
      <div className="foot-brand"><Mark size={20}/><span className="foot-word">Luca</span></div>
      <span className="foot-copy">© 2025 Luca</span>
      <div className="foot-links">
        <a href="#" className="foot-link">Privacy</a>
        <a href="#" className="foot-link">Security</a>
      </div>
    </footer>

    {/* Sticky */}
    <div className={`sticky ${bar?"":"hide"}`}>
      <div className="sticky-inner">
        <span className="sticky-text">6 months free when we launch →</span>
        <a href="#waitlist" className="sticky-btn">Join waitlist</a>
      </div>
    </div>
  </>);
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
