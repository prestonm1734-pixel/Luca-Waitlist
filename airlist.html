<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUCA // AIRLIST TERMINAL v0.1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --border: #27272A;
      --border-dim: #18181B;
      --text: #FAFAFA;
      --muted: #71717A;
      --purple: #A855F7;
      --green: #22C55E;
      --amber: #F59E0B;
      --blue: #60A5FA;
      --red: #EF4444;
      --font: 'JetBrains Mono', 'SF Mono', ui-monospace, 'Cascadia Code', monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      height: 100%;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── TOP BAR ── */
    #top-bar {
      height: 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
      background: var(--bg);
    }

    #top-bar-title {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    #top-bar-title span {
      color: var(--text);
      font-weight: 600;
    }

    #top-bar-keys {
      display: flex;
      gap: 6px;
    }

    .key-badge {
      border: 1px solid var(--border);
      padding: 2px 6px;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font);
    }

    /* ── MAIN SPLIT ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    #left-panel {
      width: 30%;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #left-panel-title {
      padding: 10px 14px;
      color: var(--muted);
      font-size: 11px;
      border-bottom: 1px solid var(--border-dim);
      flex-shrink: 0;
      letter-spacing: 0.08em;
    }

    #status-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      font-size: 11px;
      line-height: 1.6;
    }

    #status-feed::-webkit-scrollbar {
      width: 4px;
    }
    #status-feed::-webkit-scrollbar-track {
      background: var(--bg);
    }
    #status-feed::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .feed-entry {
      padding: 1px 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feed-ts {
      color: var(--border);
    }

    .feed-type-SYS { color: var(--muted); }
    .feed-type-NET { color: var(--blue); }
    .feed-type-MEM { color: var(--amber); }
    .feed-type-SEC { color: var(--purple); }

    .feed-msg {
      color: var(--muted);
    }

    /* ── RIGHT PANEL ── */
    #right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    /* ── BACKDROP ── */
    #backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
      display: none;
      pointer-events: none;
    }
    #backdrop.active {
      display: block;
    }

    /* ── SEED ZONE ── */
    #seed-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 80px;
      position: relative;
      overflow-y: auto;
    }

    #seed-inner {
      width: 100%;
      max-width: 600px;
    }

    .comment-line {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    #prompt-wrapper {
      margin-top: 20px;
      transition: transform 0.2s ease;
    }

    #prompt-wrapper.shifted {
      transform: translateY(-20px);
    }

    #prompt-row {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 0;
      position: relative;
    }

    #prompt-row.focused {
      border-color: var(--purple);
    }

    #prompt-row.error {
      border-color: var(--red);
    }

    #prompt-prefix {
      color: var(--purple);
      padding: 10px 10px 10px 14px;
      font-size: 15px;
      flex-shrink: 0;
      user-select: none;
    }

    #email-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      padding: 10px 14px 10px 0;
      border-radius: 2px;
    }

    #email-input::placeholder {
      color: transparent;
    }

    #email-input:disabled {
      color: var(--muted);
    }

    #cursor-char {
      color: var(--text);
      font-size: 15px;
      padding-right: 6px;
      flex-shrink: 0;
      animation: blink 1s step-end infinite;
      user-select: none;
    }

    #cursor-char.hidden {
      display: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #error-msg {
      margin-top: 8px;
      color: var(--red);
      font-size: 12px;
      min-height: 18px;
    }

    #shortcuts-row {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .shortcut-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .shortcut-badge {
      border: 1px solid var(--border);
      padding: 2px 6px;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font);
    }

    /* ── CONSOLE BOX ── */
    #console-box {
      border: 1px solid var(--border);
      background: var(--bg);
      margin-top: 24px;
      padding: 12px;
      display: none;
      font-size: 12px;
      line-height: 1.8;
    }

    #console-box.visible {
      display: block;
    }

    .log-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .log-tag {
      color: var(--muted);
      flex-shrink: 0;
      width: 60px;
    }

    .log-text {
      flex: 1;
    }

    .log-status {
      flex-shrink: 0;
      font-weight: 600;
      min-width: 48px;
      text-align: right;
    }

    .log-status.ok { color: var(--green); }
    .log-status.sig { color: var(--purple); }
    .log-status.done { color: var(--amber); }
    .log-status.warn { color: var(--amber); }

    .log-cursor {
      display: inline;
      animation: blink 1s step-end infinite;
    }

    /* ── ACTION CARD ── */
    #action-card {
      margin-top: 24px;
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #action-card.visible {
      display: block;
    }

    #action-card.animated {
      opacity: 1;
      transform: translateY(0);
    }

    #card-pre {
      white-space: pre;
      overflow-x: auto;
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
    }

    #card-pre::-webkit-scrollbar {
      height: 4px;
    }
    #card-pre::-webkit-scrollbar-track {
      background: var(--bg);
    }
    #card-pre::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .card-header {
      color: var(--muted);
    }

    .card-label {
      color: var(--muted);
    }

    .card-value {
      color: var(--text);
      font-weight: 600;
    }

    .card-id {
      color: var(--purple);
      font-weight: 600;
    }

    .card-status-active {
      color: var(--green);
      font-weight: 600;
    }

    #share-btn-wrapper {
      margin-top: 0;
      padding: 8px 0 2px 0;
    }

    #share-btn {
      border: 1px solid var(--text);
      background: transparent;
      color: var(--text);
      padding: 10px 24px;
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      transition: none;
      display: block;
      margin: 0 auto;
    }

    #share-btn:hover {
      background: #FAFAFA;
      color: #000000;
      border-color: #FAFAFA;
    }

    /* ── BOTTOM STATUS BAR ── */
    #bottom-bar {
      height: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg);
      z-index: 10;
    }

    .status-section {
      padding: 0 14px;
      font-size: 11px;
      color: var(--muted);
      height: 100%;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--border);
    }

    .status-section:last-child {
      border-right: none;
    }

    .status-section span.val {
      color: var(--text);
      margin-left: 4px;
    }

    #node-indicator {
      color: var(--muted);
    }

    #node-indicator.pulse {
      animation: pulse-green 0.6s ease forwards;
    }

    @keyframes pulse-green {
      0% { color: var(--muted); }
      30% { color: var(--green); }
      100% { color: var(--muted); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 767px) {
      #left-panel {
        display: none;
      }

      #seed-zone {
        padding: 30px 20px;
        font-size: 12px;
      }

      .comment-line {
        font-size: 12px;
      }

      #email-input {
        font-size: 14px;
      }

      #prompt-prefix {
        font-size: 14px;
      }

      #cursor-char {
        font-size: 14px;
      }

      #card-pre {
        font-size: 11px;
      }

      #share-btn {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="top-bar">
    <div id="top-bar-title">
      <span>LUCA</span> <span style="color:var(--muted)">//</span> <span>AIRLIST TERMINAL</span>
      <span style="color:var(--muted); margin-left:8px;">v0.1.0</span>
    </div>
    <div id="top-bar-keys">
      <div class="key-badge">[ESC]</div>
      <div class="key-badge">[ENTER]</div>
    </div>
  </div>

  <!-- BACKDROP -->
  <div id="backdrop"></div>

  <!-- MAIN SPLIT -->
  <div id="main">

    <!-- LEFT PANEL -->
    <div id="left-panel">
      <div id="left-panel-title">// STATUS FEED</div>
      <div id="status-feed"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel">
      <div id="seed-zone">
        <div id="seed-inner">
          <div class="comment-line">// AIRLIST ENROLLMENT PROTOCOL</div>
          <div class="comment-line">// Version 2.4.1 — Alpha Node Active</div>

          <div id="prompt-wrapper">
            <div id="prompt-row">
              <div id="prompt-prefix">▸ </div>
              <input
                id="email-input"
                type="email"
                autocomplete="email"
                spellcheck="false"
                aria-label="Enter your email address"
              />
              <span id="cursor-char">▋</span>
            </div>
            <div id="error-msg"></div>
          </div>

          <div id="shortcuts-row">
            <div class="shortcut-item">
              <span class="shortcut-badge">[ENTER]</span>
              <span>submit</span>
            </div>
            <div class="shortcut-item">
              <span class="shortcut-badge">[ESC]</span>
              <span>clear</span>
            </div>
            <div class="shortcut-item">
              <span class="shortcut-badge">[TAB]</span>
              <span>focus</span>
            </div>
          </div>

          <!-- CONSOLE BOX -->
          <div id="console-box"></div>

          <!-- ACTION CARD -->
          <div id="action-card">
            <div id="card-pre"></div>
            <div id="share-btn-wrapper">
              <button id="share-btn">[ SHARE OPERATIONAL LOG TO EXPEDITE DEPLOYMENT ]</button>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM STATUS BAR -->
  <div id="bottom-bar">
    <div class="status-section">uptime:<span class="val" id="uptime-val">00:00:00</span></div>
    <div class="status-section">slots:<span class="val" id="slots-val">4,891 remaining</span></div>
    <div class="status-section" id="node-section">
      <span id="node-indicator">node: ALPHA-7 // ONLINE</span>
    </div>
  </div>

</div>

<script>
  // ── CONSTANTS ──
  const SUPABASE_URL = 'https://ioeqnfqparfunotdjosy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_WgGtHiiEJJ-EJzYrG5jV7g_XlZnxTAJ';

  // ── STATE ──
  let phase = 1; // 1=idle, 2=submitting, 3=done
  let slotsRemaining = 4891;
  let uptimeStart = performance.now();

  // ── DOM REFS ──
  const emailInput = document.getElementById('email-input');
  const promptRow = document.getElementById('prompt-row');
  const promptWrapper = document.getElementById('prompt-wrapper');
  const cursorChar = document.getElementById('cursor-char');
  const errorMsg = document.getElementById('error-msg');
  const consoleBox = document.getElementById('console-box');
  const actionCard = document.getElementById('action-card');
  const cardPre = document.getElementById('card-pre');
  const shareBtn = document.getElementById('share-btn');
  const backdrop = document.getElementById('backdrop');
  const statusFeed = document.getElementById('status-feed');
  const uptimeVal = document.getElementById('uptime-val');
  const slotsVal = document.getElementById('slots-val');
  const nodeIndicator = document.getElementById('node-indicator');

  // ── UPTIME COUNTER ──
  setInterval(function() {
    var elapsed = Math.floor((performance.now() - uptimeStart) / 1000);
    var h = Math.floor(elapsed / 3600);
    var m = Math.floor((elapsed % 3600) / 60);
    var s = elapsed % 60;
    uptimeVal.textContent = pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  }, 1000);

  function pad2(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function formatTimestamp(d) {
    return '[' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + ']';
  }

  // ── LEFT PANEL FEED ──
  var feedTypes = ['SYS', 'NET', 'MEM', 'SEC'];
  var feedMessages = {
    SYS: [
      'Kernel watchdog nominal. Load: {load}',
      'GC sweep: {mb}MB reclaimed',
      'Process pool rebalanced — {n} workers active',
      'Scheduler tick: 0 deferred tasks',
      'Filesystem cache hit rate: {pct}%',
    ],
    NET: [
      'Peer mesh sync — {n} active connections',
      'Routing table updated — {n} new nodes',
      'Latency probe: avg {ms}ms to primary relay',
      'Packet loss: 0.0% on primary uplink',
      'DNS resolution cache refreshed',
    ],
    MEM: [
      'Heap pressure: {pct}% (stable)',
      'Buffer pool: {a}/{b} slots allocated',
      'Swap usage: 0MB — all resident',
      'Large object count: {n} tracked',
      'Arena compaction: {pct}% fragmentation',
    ],
    SEC: [
      'Auth token rotation cycle complete',
      'TLS handshake pool refreshed',
      'Entropy pool refilled: 256 bits available',
      'Certificate pinning verified — 0 anomalies',
      'Rate limit counters reset for epoch',
    ],
  };

  function randomBetween(a, b) {
    return Math.floor(Math.random() * (b - a + 1)) + a;
  }

  function renderFeedMessage(tmpl) {
    return tmpl
      .replace('{load}', (Math.random() * 0.5 + 0.05).toFixed(2))
      .replace('{mb}', (Math.random() * 4 + 0.5).toFixed(1))
      .replace('{n}', randomBetween(5, 999))
      .replace('{pct}', randomBetween(10, 89))
      .replace('{ms}', randomBetween(8, 120))
      .replace('{a}', randomBetween(10, 120))
      .replace('{b}', '256');
  }

  function addFeedEntry(type, msg, ts) {
    var d = ts || new Date();
    var entry = document.createElement('div');
    entry.className = 'feed-entry';

    var tsSpan = document.createElement('span');
    tsSpan.className = 'feed-ts';
    tsSpan.textContent = formatTimestamp(d) + ' ';

    var typeSpan = document.createElement('span');
    typeSpan.className = 'feed-type-' + type;
    typeSpan.textContent = type + '  ';

    var msgSpan = document.createElement('span');
    msgSpan.className = 'feed-msg';
    msgSpan.textContent = msg;

    entry.appendChild(tsSpan);
    entry.appendChild(typeSpan);
    entry.appendChild(msgSpan);
    statusFeed.appendChild(entry);

    // Trim to 100 lines
    while (statusFeed.children.length > 100) {
      statusFeed.removeChild(statusFeed.firstChild);
    }

    statusFeed.scrollTop = statusFeed.scrollHeight;
  }

  // Pre-seed with 8 static entries (~3 min before now)
  var seedData = [
    { type: 'SYS', msg: 'Kernel watchdog nominal. Load: 0.12' },
    { type: 'NET', msg: 'Peer mesh sync — 847 active connections' },
    { type: 'MEM', msg: 'Heap pressure: 23% (stable)' },
    { type: 'SEC', msg: 'Auth token rotation cycle complete' },
    { type: 'SYS', msg: 'GC sweep: 2.3MB reclaimed' },
    { type: 'NET', msg: 'Routing table updated — 12 new nodes' },
    { type: 'MEM', msg: 'Buffer pool: 64/256 slots allocated' },
    { type: 'SEC', msg: 'TLS handshake pool refreshed' },
  ];
  var baseTime = new Date(Date.now() - 3 * 60 * 1000);
  for (var i = 0; i < seedData.length; i++) {
    var seedTs = new Date(baseTime.getTime() + i * 22000);
    addFeedEntry(seedData[i].type, seedData[i].msg, seedTs);
  }

  // Auto-generate new messages
  function scheduleNextFeedEntry() {
    var delay = randomBetween(2000, 4000);
    setTimeout(function() {
      var type = feedTypes[Math.floor(Math.random() * feedTypes.length)];
      var msgs = feedMessages[type];
      var tmpl = msgs[Math.floor(Math.random() * msgs.length)];
      addFeedEntry(type, renderFeedMessage(tmpl));
      scheduleNextFeedEntry();
    }, delay);
  }
  scheduleNextFeedEntry();

  // ── INPUT FOCUS HANDLING ──
  emailInput.addEventListener('focus', function() {
    promptRow.classList.add('focused');
    backdrop.classList.add('active');
    cursorChar.classList.add('hidden');
  });

  emailInput.addEventListener('blur', function() {
    promptRow.classList.remove('focused');
    backdrop.classList.remove('active');
    if (!emailInput.value) {
      cursorChar.classList.remove('hidden');
    }
  });

  emailInput.addEventListener('input', function() {
    if (emailInput.value.length > 0) {
      cursorChar.classList.add('hidden');
    } else {
      cursorChar.classList.remove('hidden');
    }
    // Clear error on typing
    if (promptRow.classList.contains('error')) {
      promptRow.classList.remove('error');
      errorMsg.textContent = '';
    }
  });

  // ── KEYBOARD SHORTCUTS ──
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Tab' && document.activeElement !== emailInput && phase === 1) {
      e.preventDefault();
      emailInput.focus();
    }
    if (e.key === 'Escape') {
      if (phase === 1) {
        emailInput.blur();
      }
      // phase 2/3: do nothing
    }
    if (e.key === 'Enter' && document.activeElement === emailInput) {
      e.preventDefault();
      handleSubmit();
    }
  });

  // ── EMAIL VALIDATION ──
  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  }

  // ── SUBMISSION ──
  function handleSubmit() {
    if (phase !== 1) return;
    var email = emailInput.value.trim();
    if (!isValidEmail(email)) {
      promptRow.classList.add('error');
      errorMsg.textContent = '// INVALID FORMAT — EXPECTED user@domain.tld';
      setTimeout(function() {
        promptRow.classList.remove('error');
        errorMsg.textContent = '';
      }, 2000);
      return;
    }
    phase = 2;
    startSubmission(email);
  }

  function startSubmission(email) {
    // Lock input
    emailInput.disabled = true;
    promptRow.classList.add('focused');
    cursorChar.classList.add('hidden');

    // Shift prompt up
    promptWrapper.classList.add('shifted');

    // Fire Supabase fetch in parallel
    var supabasePromise = fetch(SUPABASE_URL + '/rest/v1/waitlist', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ email: email, source: 'airlist' }),
    });

    // Show console box
    consoleBox.classList.add('visible');
    consoleBox.innerHTML = '';

    // Define log lines
    var logLines = [
      { tag: '[LOG]',    text: 'Initiating handshake with global routing matrix...',     status: '[OK]',   statusClass: 'ok'   },
      { tag: '[LOG]',    text: 'Allocating sandbox memory register (256MB)...',           status: '[OK]',   statusClass: 'ok'   },
      { tag: '[LOG]',    text: 'Scanning IANA namespace for collision conflicts...',       status: '[OK]',   statusClass: 'ok'   },
      { tag: '[LOG]',    text: 'Reserving hardware slot for ' + email + '...',            status: '[OK]',   statusClass: 'ok'   },
      { tag: '[STATUS]', text: 'Enrollment signature generated.',                         status: '[SIG]',  statusClass: 'sig'  },
      { tag: '[STATUS]', text: 'Writing to Alpha Node persistent store...',               status: '[OK]',   statusClass: 'ok'   },
      { tag: '[STATUS]', text: 'Position secured. Queue depth: 4,891.',                  status: '[DONE]', statusClass: 'done' },
    ];

    var lineIndex = 0;
    var charIndex = 0;
    var currentLineEl = null;
    var currentTextEl = null;
    var currentCursorEl = null;

    function buildLineElement(lineData) {
      var lineEl = document.createElement('div');
      lineEl.className = 'log-line';

      var tagEl = document.createElement('span');
      tagEl.className = 'log-tag';
      tagEl.textContent = lineData.tag;

      var textEl = document.createElement('span');
      textEl.className = 'log-text';

      var cursorEl = document.createElement('span');
      cursorEl.className = 'log-cursor';
      cursorEl.textContent = '▋';
      textEl.appendChild(cursorEl);

      lineEl.appendChild(tagEl);
      lineEl.appendChild(textEl);
      consoleBox.appendChild(lineEl);

      return { lineEl: lineEl, textEl: textEl, cursorEl: cursorEl };
    }

    function startNextLine() {
      if (lineIndex >= logLines.length) {
        // All lines done — move cursor to idle blink after last line
        if (currentCursorEl) {
          // already blinking at end
        }
        // Wait for supabase result then maybe show error
        supabasePromise.then(function(res) {
          if (!res.ok && res.status !== 409) {
            // Append error line
            var errLine = document.createElement('div');
            errLine.className = 'log-line';
            var errTag = document.createElement('span');
            errTag.className = 'log-tag';
            errTag.style.color = 'var(--amber)';
            errTag.textContent = '[ERR]';
            var errText = document.createElement('span');
            errText.className = 'log-text';
            errText.textContent = 'Registration write failed — slot reserved locally.';
            var errStatus = document.createElement('span');
            errStatus.className = 'log-status warn';
            errStatus.textContent = '[WARN]';
            errLine.appendChild(errTag);
            errLine.appendChild(errText);
            errLine.appendChild(errStatus);
            consoleBox.appendChild(errLine);
          }
          // Remove cursor from last line
          if (currentCursorEl) {
            currentCursorEl.remove();
          }
          setTimeout(showActionCard.bind(null, email), 350);
        }).catch(function() {
          // Network error — still proceed
          if (currentCursorEl) currentCursorEl.remove();
          setTimeout(showActionCard.bind(null, email), 350);
        });
        return;
      }

      var lineData = logLines[lineIndex];
      var els = buildLineElement(lineData);
      currentLineEl = els.lineEl;
      currentTextEl = els.textEl;
      currentCursorEl = els.cursorEl;
      charIndex = 0;

      // Remove cursor from previous line's status if it exists
      // (cursor is only in textEl before status is appended)

      function typeChar() {
        if (charIndex < lineData.text.length) {
          // Insert char before cursor
          var textNode = document.createTextNode(lineData.text[charIndex]);
          currentTextEl.insertBefore(textNode, currentCursorEl);
          charIndex++;
          setTimeout(typeChar, 15);
        } else {
          // Line done — remove cursor, append status, pause then next line
          currentCursorEl.remove();
          currentCursorEl = null;

          var statusEl = document.createElement('span');
          statusEl.className = 'log-status ' + lineData.statusClass;
          statusEl.textContent = lineData.status;
          currentLineEl.appendChild(statusEl);

          lineIndex++;
          setTimeout(startNextLine, 50);
        }
      }

      typeChar();
    }

    startNextLine();
  }

  // ── ACTION CARD ──
  function showActionCard(email) {
    phase = 3;

    // Decrement slots
    slotsRemaining = Math.max(0, slotsRemaining - 1);
    slotsVal.textContent = slotsRemaining.toLocaleString() + ' remaining';

    // Pulse node indicator
    nodeIndicator.classList.remove('pulse');
    void nodeIndicator.offsetWidth; // reflow
    nodeIndicator.classList.add('pulse');

    // Build enrollment ID
    var enrollId = '0x' + btoa(email).substring(0, 8) + '...';

    // Build card text
    var line = '─'.repeat(66);
    var cardText =
      '┌' + line + '┐\n' +
      '│  <span class="card-header">SYSTEM REGISTER COMPLIANT // ALPHA NODE ACTIVATED</span>               │\n' +
      '├' + line + '┤\n' +
      '│                                                                  │\n' +
      '│  ▸ ENROLLMENT ID:   <span class="card-id">' + padRight(enrollId, 44) + '</span>│\n' +
      '│  ▸ TIER METRIC:     <span class="card-value">Prosumer Operator                              </span>│\n' +
      '│  ▸ NODE:            <span class="card-value">ALPHA-7                                        </span>│\n' +
      '│  ▸ QUEUE POSITION:  <span class="card-value">#4,891                                         </span>│\n' +
      '│  ▸ STATUS:          <span class="card-status-active">ACTIVE                                         </span>│\n' +
      '│                                                                  │\n' +
      '├' + line + '┤\n' +
      '│                                                                  │\n' +
      '│                                                                  │\n' +
      '└' + line + '┘';

    cardPre.innerHTML = cardText;

    actionCard.classList.add('visible');
    // Trigger animation on next frame
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        actionCard.classList.add('animated');
      });
    });
  }

  function padRight(str, len) {
    // Pad plain string to fixed length (no HTML in str)
    while (str.length < len) str += ' ';
    return str;
  }

  // ── SHARE BUTTON ──
  shareBtn.addEventListener('click', function() {
    var msg = 'I just joined the Luca Airlist — reserve your slot before Alpha fills up.';
    var originalText = shareBtn.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(function() {
        shareBtn.textContent = '[ COPIED TO CLIPBOARD ✓ ]';
        setTimeout(function() {
          shareBtn.textContent = originalText;
        }, 2000);
      }).catch(function() {
        fallbackCopy(msg, originalText);
      });
    } else {
      fallbackCopy(msg, originalText);
    }
  });

  function fallbackCopy(text, originalText) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      shareBtn.textContent = '[ COPIED TO CLIPBOARD ✓ ]';
      setTimeout(function() {
        shareBtn.textContent = originalText;
      }, 2000);
    } catch(e) {}
    document.body.removeChild(ta);
  }

  // ── INIT ──
  // Show cursor blinking hint when empty and unfocused
  emailInput.addEventListener('focus', function() {
    cursorChar.classList.add('hidden');
  });
</script>
